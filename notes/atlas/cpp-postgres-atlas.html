->>Idx: insert_entry(key 100, ctid 0:1)\n    Eng->>WAL: log_commit(tx 1) -> Flushes WAL to disk\n    Eng->>TM: commit(tx 1)\n    Eng-->>CLI: Insert successful at CTID (0, 1) and committed\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| Every statement runs inside a transaction, implicit if not declared | **Exact** (PostgreSQL assigns the XID lazily on first write) |\n| `xmin`, `xmax`, `ctid` are queryable system columns | **Exact** |\n| A single coordinator object owning heap, index, WAL, buffers, CLOG, TOAST | **Architecturally divergent** — PostgreSQL is multi-process, one backend per connection, coordinating through shared memory |\n\n### The whole upper half of PostgreSQL is out of scope here\n\nThis engine's \"Lexer / Command Dispatcher\" recognises a fixed statement vocabulary against a single hard-coded `items(item_id int, price int)` schema. PostgreSQL between the wire and the storage layer has:\n\n- **A real parser** (`gram.y`) producing a parse tree, then analysis/rewrite (view expansion, rules, row-level security).\n- **A cost-based planner** — join order search, `Seq Scan` vs `Index Scan` vs `Bitmap Heap Scan`, nested loop / hash / merge joins, all costed against `pg_statistic` histograms and MCV lists collected by `ANALYZE`.\n- **An executor** built from pluggable plan nodes, with parallel workers and JIT compilation of expressions.\n- **A system catalog** — `pg_class`, `pg_attribute`, `pg_index`, … which are themselves ordinary heap tables read through the same buffer manager, cached in the relcache/syscache.\n- **The type system** — `pg_type`, operator classes, collations, extensions.\n\nNone of that exists here, which is the point: this project is the storage engine underneath, not the database.\n"},{"path":"12-buffer-pool-gateway.md","title":"Item 12: Buffer Pool Single Gateway Invariant","md":"# Item 12: Buffer Pool Single Gateway Invariant\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/heap.h:65-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/heap.h), [src/heap.cpp:25-65](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/heap.cpp), [tests/test_buffer_integration.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_buffer_integration.cpp)\n\n---\n\n## 1. The Single Gateway Principle\n\nIn a production database engine, **no subsystem is ever permitted to bypass shared buffers**.\nItem 12 eliminates all direct `Pager::read_page()` and `Pager::write_page()` calls from `HeapFile` and `Engine`.\n\nPostgreSQL holds the same rule for ordinary relation access, with named exceptions worth knowing:\n- **Temporary tables** use per-backend *local* buffers (`localbuf.c`), not shared buffers.\n- **WAL** has its own `wal_buffers` ring and never travels through the shared buffer pool.\n- **Bulk operations** (`COPY`, `CREATE INDEX`, `ALTER TABLE` rewrites) go through the buffer manager but inside a restricted `BufferAccessStrategy` ring so they cannot evict the working set.\n- A handful of paths talk to the storage manager (`smgr`) directly — relation extension, `mdtruncate`, and (from v17) the streaming read interface, which still lands in shared buffers but issues the I/O differently.\n\n```mermaid\nflowchart TD\n    subgraph ExecutionSubsystems[\"Execution Subsystems\"]\n        HEAP[\"HeapFile (CRUD / Scans)\"]\n        VAC[\"Vacuum Engine\"]\n        REPL[\"SQL Execution / Page Dumps\"]\n    end\n\n    subgraph Gateway[\"Buffer Pool Gateway (BufferPoolManager)\"]\n        PIN[\"fetch_page(page_id) -> Pin Frame\"]\n        UNPIN[\"unpin_page(page_id, is_dirty) -> Release Frame\"]\n        FLUSH[\"flush_page(page_id) / flush_all()\"]\n    end\n\n    subgraph PhysicalStorage[\"Physical Disk Files\"]\n        PAGER[\"Pager (OS File System *.db)\"]\n    end\n\n    HEAP -->|ONLY through BPM| PIN\n    VAC -->|ONLY through BPM| PIN\n    REPL -->|ONLY through BPM| PIN\n    PIN --- UNPIN\n    UNPIN --> FLUSH\n    FLUSH --> PAGER\n```\n\n---\n\n## 2. Invariants & Pin/Unpin Lifecycle State Machine\n\n1. **Mandatory Symmetrical Unpinning**: Every `fetch_page()` call **must** have an exactly matching `unpin_page()` invocation in the same call stack (`[src/heap.cpp:55]`).\n2. **Dirty Flag Propagation**: If any tuple bytes, line pointers, or page header offsets are modified in RAM, `unpin_page(page_id, is_dirty=true)` must be passed to ensure the buffer pool schedules disk writeback.\n\n```mermaid\nstateDiagram-v2\n    [*] --> Unloaded\n    Unloaded --> PinnedClean: fetch_page read disk\n    PinnedClean --> PinnedDirty: memory write\n    PinnedClean --> UnpinnedClean: unpin clean\n    PinnedDirty --> UnpinnedDirty: unpin dirty\n    UnpinnedClean --> PinnedClean: fetch_page cache hit\n    UnpinnedDirty --> PinnedDirty: fetch_page cache hit\n    UnpinnedDirty --> UnpinnedClean: flush to disk\n    UnpinnedClean --> Unloaded: clock_sweep eviction\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| All relation page access flows through the buffer manager | **Exact for ordinary access** |\n| Every `fetch_page` is matched by an `unpin_page` | **Exact** — PostgreSQL's `ReadBuffer` / `ReleaseBuffer` discipline, with `ResourceOwner` tracking to catch leaks |\n| Dirtiness is declared by the caller at unpin time | **Divergent in mechanism** — PostgreSQL calls `MarkBufferDirty()` at the moment of mutation, while holding the exclusive content lock, and that call is what pairs with WAL logging |\n| Pin/unpin is the only lock | **Simplified** — PostgreSQL separates the *pin* (page stays resident) from the *content lock* (`LW_SHARED`/`LW_EXCLUSIVE` on the bytes); the state machine above conflates them |\n| No local buffers / no strategy rings | **Missing** — see §1 |\n\n### Implementation status (2026-08-27)\n\nThe gateway is now real. A relation owns exactly one `BufferPoolManager` and\nthere is no path around it: `HeapFile` builds one in its constructor if none is\ninjected, and `Vacuum` and WAL recovery both go through it. Previously VACUUM,\nCLOG and TOAST each used their own `Pager` directly, which is how the cached copy\nand the on-disk copy drifted apart.\n\n`PinnedPage` replaces the fetch-copy-unpin-refetch-copy-back pattern: the pin is\nheld for the whole read-modify-write, so nothing can interleave between the read\nand the write-back. Dirtiness is still declared by the caller, via\n`PinnedPage::mark_dirty()`.\n\nStill outside the gateway: CLOG and TOAST keep their own pagers.\n"},{"path":"13-clog-commit-status-bitmaps.md","title":"Item 13: CLOG Commit Status 2-Bit Bitmap Pages","md":"# Item 13: CLOG Commit Status 2-Bit Bitmap Pages\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/clog.h:1-55](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/clog.h), [src/clog.cpp:1-110](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/clog.cpp), [tests/test_clog.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_clog.cpp)\n\n---\n\n## 1. The Commit Log (CLOG) Architecture\n\nPostgreSQL avoids having to revisit every tuple a transaction touched at commit time by persisting one commit *state* per transaction into dedicated 8KB **commit log** bitmap pages — the `pg_xact` directory (named `pg_clog` before PostgreSQL 10; the internal API is still `clog.c`).\n\nEach transaction is encoded using exactly **2 bits**:\n\n$$\\text{00} = \\text{IN-PROGRESS} \\qquad \\text{01} = \\text{COMMITTED} \\qquad \\text{10} = \\text{ABORTED} \\qquad \\text{11} = \\text{SUB-COMMITTED}$$\n\n```mermaid\nflowchart TD\n    subgraph CLOGBitPacking[\"8KB CLOG Page (32,768 Transactions)\"]\n        BYTE0[\"Byte 0: Tx3 | Tx2 | Tx1 | Tx0\"]\n        BYTE1[\"Byte 1: Tx7 | Tx6 | Tx5 | Tx4\"]\n        BYTEN[\"Byte 8191: Tx32767 .. Tx32764\"]\n    end\n\n    XID[\"Transaction ID: 5\"] --> CALC[\"Page: 5 / 32768 = 0<br/>Byte: (5 % 32768) / 4 = 1<br/>Shift: (5 % 4) * 2 = 2 bits\"]\n    CALC --> BYTE1\n```\n\n---\n\n## 2. Invariants & Mathematical Mapping Formulas\n\n1. **Transaction Density Derivation**:\n   $$\\text{Transactions Per Page} = 8192 \\text{ bytes} \\times 4 \\text{ tx/byte} = 32768 \\text{ transactions}$$\n2. **Exact Bit Offset Formula**:\n   $$\\text{clog\\_page} = \\lfloor \\text{tx\\_id} / 32768 \\rfloor$$\n   $$\\text{byte\\_offset} = \\lfloor (\\text{tx\\_id} \\bmod 32768) / 4 \\rfloor$$\n   $$\\text{bit\\_shift} = (\\text{tx\\_id} \\bmod 4) \\times 2$$\n3. **Instant Visibility on Restart**: CLOG pages are flushed on commit and loaded on startup, enabling instantaneous MVCC snapshot visibility checks without requiring full WAL log replay (`[src/clog.cpp:45]`).\n\n   **PostgreSQL does not fsync CLOG at commit.** The durability of a commit rests entirely on the WAL commit record; the CLOG bit is set in a shared-memory SLRU buffer and written out lazily, normally at checkpoint. If the server crashes between the two, redo re-applies the commit record and re-sets the bit. Fsyncing CLOG per commit would add a second synchronous write to every transaction for no durability gain.\n\n---\n\n## 3. Sequence Diagram: CLOG Commit and Status Lookup\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant TM as TransactionManager (src/tx.cpp)\n    participant CLOG as CLogManager (src/clog.cpp)\n    participant BPM as BufferPoolManager (Shared Buffers)\n\n    Note over TM,BPM: Committing Transaction 5\n    TM->>CLOG: set_status(tx_id=5, COMMITTED)\n    CLOG->>CLOG: page=0, byte=1, shift=2\n    CLOG->>BPM: fetch_page(clog_page_0)\n    CLOG->>CLOG: byte_val = (byte_val & ~(0x03 << 2)) | (0x01 << 2)\n    CLOG->>BPM: unpin_page(clog_page_0, is_dirty=true)\n\n    Note over TM,BPM: Querying Transaction Status\n    TM->>CLOG: get_status(tx_id=5)\n    CLOG->>BPM: fetch_page(clog_page_0)\n    CLOG->>CLOG: status = (byte_val >> 2) & 0x03 -> 0x01 (COMMITTED)\n    CLOG->>BPM: unpin_page(clog_page_0, is_dirty=false)\n    CLOG-->>TM: TransactionStatus::COMMITTED\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| 2 bits per transaction, packed 4 per byte | **Exact** |\n| 32,768 transactions per 8KB page | **Exact** — `CLOG_XACTS_PER_PAGE` |\n| Status codes `00`/`01`/`10`/`11` = in-progress / committed / aborted / sub-committed | **Exact** — `TRANSACTION_STATUS_*` in `clog.h` |\n| Page / byte / shift arithmetic | **Exact** |\n| Read-modify-write of the 2-bit field under a page pin | **Exact in shape** |\n| \"CLOG pages are flushed on commit\" | **Wrong** — durability comes from the WAL commit record; CLOG is an SLRU written at checkpoint |\n| Name \"CLOG\" | **Dated** — the directory is `pg_xact` since PostgreSQL 10 |\n\n### Mechanisms PostgreSQL layers on top\n\n- **Hint bits.** The first reader that resolves a transaction's status through CLOG writes the answer back into the tuple's `t_infomask` (`HEAP_XMIN_COMMITTED`, `HEAP_XMAX_COMMITTED`, …), so subsequent visibility checks skip CLOG entirely. Without them, CLOG would be the hottest structure in the system — which is exactly what happens in this engine.\n- **SLRU segmentation and truncation.** CLOG lives in 256 KB segment files (32 pages each) under a generic simple-LRU cache. VACUUM advances `datfrozenxid`, and old segments are **deleted** — the commit log is not kept forever. Without freezing (Item 5), this engine's CLOG grows without bound.\n- **`SUB_COMMITTED` is real.** PostgreSQL uses `0x03` for a subtransaction that has committed but whose top-level parent has not; `pg_subtrans` records the parent link. This engine reserves the code but has no subtransactions.\n- **Two-phase commit.** `PREPARE TRANSACTION` state lives in `pg_twophase`, outside CLOG.\n"},{"path":"14-disk-resident-btree.md","title":"Item 14: On-Disk B-Tree Index with Dynamic Node Splits","md":"# Item 14: On-Disk B-Tree Index with Dynamic Node Splits\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/disk_btree.h:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/disk_btree.h), [src/disk_btree.cpp:1-400](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/disk_btree.cpp), [tests/test_disk_btree.cpp:1-200](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_disk_btree.cpp)\n\n---\n\n## 1. Disk-Resident B-Tree Architecture\n\n> **Implementation status.** As of 2026-09-05 (Finding 2.3 remediation), `DiskBTree` is now the primary secondary index used by `Engine`, replacing the in-memory multimap. It implements the abstract `Index` interface (`include/pg/index.h`), including `remove_entry()` for three-phase VACUUM index cleanup, `num_entries()`, `num_unique_keys()`, `dump()`, and dedicated buffer pool caching (`bpm_owned_`) with dirty page flushing on checkpoint and clean shutdown. $O(1)$ engine startup opens `<db_prefix>_index.db` directly without heap scanning.\n\n`DiskBTree` stores hierarchical B-Tree nodes on dedicated **8,192-byte disk pages**. Nodes split dynamically when overflowing, promoting median keys up to parent internal nodes.\n\nThis is a textbook B+Tree. PostgreSQL's `nbtree` is a **Lehman & Yao B-link tree**, which differs structurally — see §4.\n\n```mermaid\nflowchart TD\n    subgraph RootNode[\"Root Internal Page (Page 0)\"]\n        R_HDR[\"Header: is_leaf=false, num_keys=1\"]\n        R_E1[\"Key under 500 -> Page 1 | Key 500 and above -> Page 2\"]\n    end\n\n    subgraph LeafLevel[\"Leaf Level (Linked via right_sibling)\"]\n        L1[\"Leaf Page 1\\nKeys: 100 to 400\\nright_sibling -> Page 2\"]\n        L2[\"Leaf Page 2\\nKeys: 500 to 900\\nright_sibling -> 0 (Tail)\"]\n    end\n\n    R_E1 --> L1\n    R_E1 --> L2\n    L1 -.->|Sibling Scan Pointer| L2\n```\n\n---\n\n## 2. Invariants & Binary Page Formats\n\n1. **B-Tree Page Header (12 Bytes — this engine's own format)** (`[include/pg/disk_btree.h:20]`):\n   - `is_leaf` (1 Byte): `true` for leaf pages, `false` for internal routing nodes.\n   - `num_keys` (2 Bytes): Number of active key entries in this node.\n   - `right_sibling` (4 Bytes): `page_id_t` linking to the right sibling page for fast linear range scans.\n   - `parent_page_id` (4 Bytes): `page_id_t` of the parent router node. **PostgreSQL has no parent pointers.** A descending search pushes the blocks it passed through onto a stack, and a split walks that stack back up; this is deliberate, because a parent pointer would have to be rewritten in every child on every split, which cannot be done atomically under concurrency.\n2. **Entry Binary Layouts**:\n   - **Leaf Entry (10 Bytes)** (`[include/pg/disk_btree.h:39-42]`): `key` (4B int32) + `ctid` (6B CTID `{page, slot}`).\n   - **Internal Router Entry (8 Bytes)** (`[include/pg/disk_btree.h:44-48]`): `key` (4B int32) + `child_page_id` (4B `page_id_t`).\n3. **Median Split Algorithm**: When a leaf exceeds capacity ($N \\ge 64$, `BTREE_MAX_LEAF_KEYS`), the median entry at $N/2$ is promoted to the parent node, splitting the keys evenly into a newly allocated 8KB sibling page (`[src/disk_btree.cpp:125]`).\n\n   PostgreSQL splits on **byte occupancy against `fillfactor`** (default 90 for leaves), not on a fixed key count, and it does not use a plain median: `_bt_findsplitloc()` scores candidate split points, and detects **rightmost-page appends** to split 90/10 instead of 50/50 so that monotonically increasing keys (a `serial` primary key) do not leave every page half empty.\n\n---\n\n## 3. Sequence Diagram: Leaf Split & Key Insertion\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as Engine DML\n    participant Tree as DiskBTree (src/disk_btree.cpp)\n    participant BPM as BufferPoolManager\n    participant P0 as Leaf Page 0 (Full)\n    participant P1 as New Leaf Page 1 (Allocated)\n\n    Client->>Tree: insert_entry(key=550, ctid=(0, 20))\n    Tree->>Tree: Traverse to target Leaf Page 0\n    Tree->>P0: check num_keys >= MAX_KEYS (64)\n    Note over Tree,P1: Node Overflow! Trigger Split Pass.\n    Tree->>BPM: allocate_new_page() -> Page 1\n    Tree->>P0: Copy upper 32 keys to Page 1\n    Tree->>P0: Set right_sibling = Page 1\n    Tree->>P1: Set right_sibling = old_sibling\n    Tree->>Tree: Insert median key (500) into Root Parent Page\n    Tree->>P1: Insert new key (550) into Page 1\n    Tree-->>Client: void (Tree balanced!)\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| B+Tree on 8KB pages; keys only in internal nodes, payload in leaves | **Exact in shape** |\n| Leaf pages chained for range scans | **Exact in spirit** — PostgreSQL chains them **doubly** (`btpo_prev` *and* `btpo_next`) |\n| Split allocates a sibling and pushes a separator up | **Exact in shape** |\n| `parent_page_id` stored in each node | **Divergent** — PostgreSQL stores no parent pointers; it uses a descent stack |\n| Split at a fixed 64-key limit, promoting the median | **Divergent** — PostgreSQL splits on `fillfactor` bytes, with a 90/10 rule for rightmost appends |\n| 12-byte custom node header | **Divergent** — PostgreSQL reuses the standard 24-byte page header and puts B-tree state in the *special area* (`BTPageOpaqueData`, 16 bytes) at the page end |\n\n### What PostgreSQL's nbtree adds\n\n- **Metapage at block 0.** Holds the root block number and tree level, so the root can move without any other page changing. The \"fast root\" pointer lets a mostly-empty tree skip levels.\n- **High keys.** Every page stores an upper bound for its own key range as item 1. Combined with the right-link, this is what makes the tree a **B-link tree**: a reader that arrives at a page mid-split notices the searched key exceeds the high key and simply *moves right*, so searches never block on splits.\n- **Page deletion is two-stage.** Emptied pages are marked half-dead, then deleted, then held until no snapshot could still be following a link into them, then recycled via the FSM. Compare: this engine never reclaims a B-tree page.\n- **Deduplication (v13+).** Equal keys are folded into posting-list tuples carrying a sorted TID array.\n- **Suffix truncation.** Separator keys pushed into internal pages are truncated to the shortest distinguishing prefix, so internal pages fan out further.\n- **Concurrency.** Latch coupling on descent, per-page `LWLock`s, and vacuum interlocks — all absent here, where a single engine mutex serialises everything.\n"},{"path":"15-checkpoints-and-fpi.md","title":"Item 15: WAL Checkpoints & Full-Page Images (FPI)","md":"# Item 15: WAL Checkpoints & Full-Page Images (FPI)\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/wal.h:20-60](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/wal.h), [src/wal.cpp:115-180](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/wal.cpp), [tests/test_checkpoint.cpp:1-130](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_checkpoint.cpp)\n\n---\n\n## 1. Checkpoint & Torn-Page Protection\n\n**Checkpoints** truncate the recovery horizon so that crash recovery does not need to scan WAL logs from the beginning of time.\n\n**Full-Page Images (FPI)** prevent catastrophic corruption caused by **torn pages** (when the OS crashes in the middle of writing an 8KB page, leaving a half-written 4KB sector on disk).\n\n```mermaid\nflowchart TD\n    subgraph CheckpointTimeline[\"Checkpoint Recovery Horizon\"]\n        CP[\"CHECKPOINT (LSN: 5000)\\n1. All dirty frames flushed to disk\\n2. Checkpoint record logged\\n3. Truncate WAL scan horizon\"]\n        FIRST_WRITE[\"First Write to Page 0 After Checkpoint\\nLogs entire 8192-byte FPI to WAL!\"]\n        CRASH[\"OS Crash / Power Loss\\n(Torn Page on Disk)\"]\n        HEAL[\"Crash Recovery Replay:\\nFPI overwrites torn page with perfect 8KB baseline!\"]\n    end\n\n    CP --> FIRST_WRITE --> CRASH --> HEAL\n```\n\n---\n\n## 2. Invariants & Mechanics\n\n1. **Dirty Buffer Coalescing**: `log_checkpoint()` invokes `BufferPoolManager::flush_all()`, writing all modified RAM frames to disk before appending the `CHECKPOINT` record (`[src/wal.cpp:135]`).\n\n   **The REDO point is not the checkpoint record's LSN.** PostgreSQL records the current insert position as the *REDO pointer* **before** it starts flushing buffers, flushes over a long window (`checkpoint_completion_target`, default 0.9 of the interval, to avoid an I/O spike), then writes the checkpoint record at the end and stores the REDO pointer in `pg_control`. Recovery restarts from that earlier REDO pointer, not from the checkpoint record — because pages dirtied during the flush window may have been written before their WAL was durable. Collapsing the two, as the diagram below does, is safe here only because `flush_all()` is synchronous and nothing else is running.\n2. **First-Write FPI Invariant**: The first transaction to modify any page following a checkpoint must write a full 8,192-byte snapshot of the page into WAL (`RecordType::FPI = 6`). Subsequent writes to that page only log compact delta records until the next checkpoint (`[src/wal.cpp:150]`).\n\n   **Exactly PostgreSQL's rule**, controlled by the `full_page_writes` GUC (on by default; safe to disable only on storage with atomic 8KB writes, e.g. ZFS). Two differences in mechanism: PostgreSQL attaches the image to the *same* WAL record that performs the modification, as a backup block inside `XLogRecordBlockHeader`, rather than emitting a separate FPI record; and it strips the page's free space (\"hole\" between `pd_lower` and `pd_upper`) before logging, optionally compressing the remainder (`wal_compression`). This is why WAL volume spikes immediately after every checkpoint and then decays — the standard argument for spacing checkpoints further apart.\n3. **Torn-Page Healing**: During recovery, replaying an FPI record unconditionally restores the physical 8KB page byte-for-byte, healing torn sectors before delta REDO logs are applied.\n\n---\n\n## 3. Sequence Diagram: Checkpoint & Torn Page Healing\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Admin as Checkpoint Daemon\n    participant WAL as WALManager\n    participant BPM as BufferPoolManager\n    participant Disk as Physical Disk (*.db)\n\n    Note over Admin,Disk: Checkpoint Execution\n    Admin->>BPM: flush_all() (Write all dirty RAM frames to disk)\n    Admin->>WAL: log_checkpoint() -> Records Checkpoint LSN (e.g. 5000)\n    \n    Note over Admin,Disk: First Post-Checkpoint Mutation\n    Admin->>WAL: log_fpi(page_id=0, raw_8192_bytes)\n    Admin->>WAL: log_insert(tx=10, ctid=(0, 1), data)\n    \n    Note over Admin,Disk: CRASH! Disk sector torn during write!\n    \n    Note over Admin,Disk: ARIES Crash Recovery\n    Admin->>WAL: recover()\n    WAL->>WAL: Replay starts at Checkpoint LSN 5000 (PostgreSQL: at the REDO pointer in pg_control)\n    WAL->>Disk: Replay FPI -> Writes exact 8192 bytes (Torn page healed!)\n    WAL->>Disk: Replay Insert Delta -> Slot 1 restored!\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| Checkpoints bound recovery time by flushing dirty buffers and recording a restart position | **Exact** |\n| First write to a page after a checkpoint carries a full-page image | **Exact** — `full_page_writes` |\n| FPI replay overwrites the page unconditionally, healing torn writes | **Exact** |\n| FPIs are replayed before subsequent delta records for that page | **Exact** |\n| Recovery restarts at the checkpoint record's LSN | **Divergent** — PostgreSQL restarts at the **REDO pointer**, captured before the flush window |\n| Checkpoint = synchronous `flush_all()` | **Simplified** — PostgreSQL spreads writes across `checkpoint_completion_target` via the checkpointer process |\n| Separate `FPI` record type | **Divergent** — PostgreSQL attaches backup blocks to the modifying record itself |\n| Full 8192 bytes logged | **Divergent** — PostgreSQL removes the free-space hole and can compress (`wal_compression`) |\n\n### Not modelled\n\n- **`pg_control`**, the 8 KB file holding the last checkpoint location, the database state (`in production` / `in archive recovery` / …), and the `BLCKSZ`/version fingerprint. Recovery begins by reading it.\n- **Checkpoint triggers**: `checkpoint_timeout`, `max_wal_size`, explicit `CHECKPOINT`, shutdown, and the distinct **restartpoint** used on a standby.\n- **LSN-skip during replay.** PostgreSQL compares `page.pd_lsn` against the record's LSN and skips records already reflected on the page. This engine replays unconditionally.\n- **Recovery targets** — PITR, `recovery_target_time`, timelines.\n\n### Implementation status (2026-08-27)\n\nFull-page images are now actually written. `log_fpi` existed before but had no\ncaller outside a test, so the torn-page protection described here was dead code.\n`HeapFile::maybe_log_fpi` now emits one on the first modification of a page after\neach checkpoint, guarded by `WALManager::needs_fpi`.\n\n`log_checkpoint` also orders its work correctly now: flush every dirty frame,\n`fsync` the relation, and only then append the checkpoint record — so a recovery\nstarting at that record can trust every page before it.\n\nStill simplified: the redo point and the checkpoint record LSN are the same here\n(safe only because the flush is synchronous), and the whole 8KB is logged rather\nthan removing the free-space hole.\n"},{"path":"16-aries-3-phase-recovery.md","title":"Item 16: ARIES 3-Phase Crash Recovery & UNDO Pass","md":"# Item 16: ARIES 3-Phase Crash Recovery & UNDO Pass\n\n> ### ⚠️ Fidelity warning — read this first\n>\n> **PostgreSQL does not do this.** PostgreSQL's crash recovery is **redo-only**. There is no UNDO pass, there are no compensation log records, and no `ATT`-driven rollback of uncommitted work. `cpp-postgres` implements textbook ARIES here as a teaching exercise; this chapter documents *this engine*, and §4 explains what PostgreSQL does instead and why.\n>\n> The claim in earlier revisions of this chapter that \"PostgreSQL employs the ARIES model\" was wrong.\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/wal.h:70-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/wal.h), [src/wal.cpp:160-240](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/wal.cpp), [tests/test_undo.cpp:1-135](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_undo.cpp)\n\n---\n\n## 1. The 3-Phase ARIES Recovery Algorithm\n\n`cpp-postgres` employs the **ARIES (Algorithms for Recovery and Isolation Exploiting Semantics)** model to restore consistency after an unexpected system crash or power outage:\n\n```mermaid\nflowchart TD\n    subgraph ARIES[\"ARIES 3-Phase Recovery Pipeline\"]\n        P1[\"Phase 1: Analysis Pass (Forward Scan)\\n• Scans from Checkpoint to EOF\\n• Identifies Active Transaction Table (ATT)\\n• Finds Loser (Uncommitted) Transactions\"]\n        P2[\"Phase 2: REDO Pass (Repeating History)\\n• Replays all logged operations (both winners & losers)\\n• Restores exact state of database at moment of crash\"]\n        P3[\"Phase 3: UNDO Pass (Backward Scan)\\n• Scans backward rolling back active loser transactions\\n• Restores modified tuples & stamps xmax=0\\n• Writes Compensation Log Records (CLRs)\\n• Marks loser transactions ABORTED in CLOG\"]\n    end\n\n    P1 --> P2 --> P3\n```\n\n---\n\n## 2. Invariants & Compensation Log Records (CLRs)\n\n1. **Repeating History**: REDO is executed unconditionally for all transactions (committed and uncommitted) before UNDO runs. This guarantees that uncommitted mutations, page splits, and allocations are brought into physical memory before being rolled back (`[src/wal.cpp:190]`). *PostgreSQL shares this half — it also repeats history for winners and losers alike — and then simply stops.*\n2. **Compensation Log Record (CLR)**: When an operation is rolled back during the UNDO pass, a `CLR` (`type = 7`) is written to WAL with an `undo_next_lsn` pointer. CLRs are **never undone**, preventing infinite recovery loops if the system crashes during recovery itself (`[src/wal.cpp:215]`).\n3. **CLOG Status Finalization**: Once an uncommitted transaction is rolled back, its status is finalized to `ABORTED` (`0x02`) in CLOG.\n\n---\n\n## 3. Sequence Diagram: ARIES Crash Recovery Walkthrough\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant System as Crash Recovery Engine\n    participant WAL as WAL Log Stream\n    participant ATT as Active Transaction Table (RAM)\n    participant Heap as Heap Storage\n    participant CLOG as Commit Log (CLOG)\n\n    Note over System,CLOG: Phase 1: Analysis Pass\n    System->>WAL: Forward scan from Checkpoint to EOF\n    WAL-->>ATT: Tx 1 = COMMITTED (Winner)<br/>Tx 2 = IN_PROGRESS (Loser)\n\n    Note over System,CLOG: Phase 2: REDO Pass (Repeating History)\n    System->>WAL: Replay Tx 1 Insert -> Applied to Page 0\n    System->>WAL: Replay Tx 2 Update -> Applied to Page 0 (Price 999)\n\n    Note over System,CLOG: Phase 3: UNDO Pass (Rolling Back Losers)\n    System->>WAL: Scan backward for Tx 2 actions\n    System->>Heap: Rollback Update -> Restore Slot 1 price 10 and xmax=0\n    System->>WAL: log_clr(tx_id=2, undone_lsn)\n    System->>CLOG: set_status(tx_id=2, ABORTED)\n    Note over System,CLOG: Database fully consistent!\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check — why PostgreSQL has no UNDO\n\n### 4.1 What PostgreSQL actually does on restart\n\n```mermaid\nflowchart TD\n    S1[\"1. Read pg_control\\nFind last checkpoint's REDO pointer\\nState != 'shut down' -> crash recovery\"]\n    S2[\"2. REDO pass (the only pass)\\nReplay forward from the REDO pointer to the end of valid WAL\\nSkip records whose LSN <= page.pd_lsn\\nApply full-page images unconditionally\"]\n    S3[\"3. End of recovery\\nXIDs with no COMMIT record are simply not committed.\\npg_xact already reads 'in progress' for them; they are\\ntreated as aborted. Nothing is rolled back.\"]\n    S4[\"4. Open for connections\\nThe uncommitted row versions are still on their pages.\\nThey are invisible to every snapshot, and VACUUM\\nwill reclaim them later.\"]\n    S1 --> S2 --> S3 --> S4\n```\n\nThere is no Analysis pass building an Active Transaction Table for rollback purposes, no backward scan, and no CLR record type in `xlogrecord.h`.\n\n### 4.2 Why it can get away with it\n\nBecause **MVCC already provides rollback**. An aborted transaction's row versions were never visible to anyone: `HeapTupleSatisfiesMVCC()` asks CLOG about `xmin`, gets `ABORTED`, and treats the tuple as though it had never existed. Undoing the physical write buys nothing — the only cost is the dead space, which VACUUM reclaims on its own schedule (Item 5).\n\nThis makes `ROLLBACK` an O(1) operation in PostgreSQL, at runtime *and* at recovery: set two bits in `pg_xact`, done. A `ROLLBACK` of a transaction that updated ten million rows costs the same as one that updated none.\n\n### 4.3 What it pays for that\n\nThe trade is the one this whole engine is built around: dead tuples accumulate in the heap and must be vacuumed, and the indexes bloat alongside them. An undo-based engine (Oracle, MySQL/InnoDB) instead keeps the heap clean and pays on rollback and on long-running-read reconstruction. PostgreSQL's `zheap` project prototyped exactly the ARIES-style undo design in this chapter — with an undo log, discard worker, and in-place updates — and it was never merged into core.\n\n### 4.4 Verdict table\n\n| Claim | Verdict |\n|---|---|\n| WAL, LSNs, checkpoints, full-page images, \"repeating history\" in redo | **Exact — PostgreSQL is genuinely ARIES-influenced here** |\n| Redo applies to committed *and* uncommitted transactions | **Exact** |\n| PostgreSQL \"employs the ARIES model\" | **Wrong** — PostgreSQL implements the redo half only |\n| Phase 1 Analysis building an ATT of losers | **Not in PostgreSQL** — no such pass exists |\n| Phase 3 UNDO, backward scan, tuple restoration, `xmax = 0` rewrite | **Not in PostgreSQL** — aborted work is left in place and reclaimed by VACUUM |\n| Compensation Log Records with `undo_next_lsn` | **Not in PostgreSQL** — no CLR record type exists |\n| Aborted transactions end up `ABORTED` in the commit log | **Exact in outcome**, reached without any rollback work |\n| Recovery is idempotent under a crash-during-recovery | **Exact in outcome** — PostgreSQL gets this from LSN comparison against `pd_lsn`, not from CLRs |\n\n### 4.5 Also not modelled\n\n- **`pg_control` state machine** and the `DB_SHUTDOWNED` vs `DB_IN_PRODUCTION` distinction that decides whether recovery runs at all.\n- **`pd_lsn` skip test.** PostgreSQL skips a redo record when `record.lsn <= page.pd_lsn`, which is what makes replay idempotent.\n- **Continuous recovery.** The same code path drives archive recovery, PITR, and hot standby — recovery in PostgreSQL is not a startup-only special case.\n"},{"path":"17-toast-heap-index-integration.md","title":"Item 17: TOAST Heap + Index Full Integration","md":"# Item 17: TOAST Heap + Index Full Integration\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/tuple.h:40-55](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/tuple.h), [src/engine.cpp:180-245](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/engine.cpp), [tests/test_toast_integration.cpp:1-135](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_toast_integration.cpp)\n\n---\n\n## 1. Transparent Inline vs Out-of-Line Routing\n\nItem 17 integrates the TOAST subsystem transparently into the main SQL execution pipeline, B-Tree index scans, and cross-file durability across restarts.\n\n```mermaid\nflowchart TD\n    subgraph QueryLayer[\"INSERT INTO items VALUES (id, price, 'doc...');\"]\n        CHECK{\"Document Byte Size > 2048 B?\\n(PostgreSQL: whole tuple > 2032 B)\"}\n    end\n\n    subgraph InlinePath[\"Inline Storage Path (<= 2KB)\"]\n        INLINE[\"Store payload directly inside main HeapTuple\\ninfomask: Normal (0x0000)\"]\n    end\n\n    subgraph OutOfLinePath[\"TOAST Out-of-Line Path (> 2KB)\"]\n        CHUNK[\"1. Slice into 2KB chunks in ToastRelation (*_toast.db)\\n2. Store 18B ToastPointer in HeapTuple\\n3. Stamp infomask: HEAP_HASEXTERNAL\\n(0x2000 here; PostgreSQL uses 0x0004)\"]\n    end\n\n    subgraph BTreeIndex[\"Secondary Index (Key -> CTID)\"]\n        IDX[\"Index points directly to Heap CTID (0, 1)\\nIndex is 100% unaffected by TOAST!\"]\n    end\n\n    CHECK -->|No| INLINE\n    CHECK -->|Yes| CHUNK\n    INLINE --> BTreeIndex\n    CHUNK --> BTreeIndex\n```\n\n---\n\n## 2. Invariants & Infomask Flags\n\n1. **`HEAP_HASEXTERNAL`**: Stamped on `TupleHeader::infomask`. Signals to sequential scans and index fetchers that the tuple's trailing bytes contain an 18-byte `ToastPointer` rather than inline text (`[include/pg/tuple.h:44]`). This engine uses `0x2000`; **PostgreSQL's `HEAP_HASEXTERNAL` is `0x0004`**, and `0x2000` is `HEAP_UPDATED` (see Item 3). In PostgreSQL the flag is a fast-path hint only — the authoritative marker is the varlena datum's own 1-byte header (`VARATT_IS_EXTERNAL`), which is what `pg_detoast_datum()` actually tests.\n2. **Zero Index Decoupling Impact**: Because the secondary index stores $(\\text{item\\_id} \\rightarrow \\text{CTID})$, the index node size is strictly 10 bytes regardless of whether the indexed row contains a 10-byte string or a 100-megabyte document.\n\n   This holds because the index key here is the small `item_id`. It is **not** a general PostgreSQL property: if you index the *toastable* column itself, the B-tree stores the value inline in the index tuple, detoasted (though it may stay compressed). PostgreSQL caps a B-tree entry at roughly a third of a page and raises `index row size ... exceeds btree version 4 maximum 2704` past that — the reason large-text indexing normally goes through an expression index on a hash, or a GIN full-text index.\n3. **Cross-Relation Durability & Crash Recovery**: On engine startup, `ToastManager` restores in-memory chunk indexes from disk pages via `scan_existing_pages()`. If an unclean shutdown occurred, `WALManager::recover()` replays all committed `TOAST_INSERT` records to restore missing TOAST pages and chunks with byte-for-byte fidelity.\n\n---\n\n## 3. Sequence Diagram: Transparent TOAST Query Execution\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as SQL Client\n    participant Engine as pg::Engine\n    participant Index as BTreeIndex\n    participant Heap as HeapFile\n    participant Toast as ToastManager\n\n    Client->>Engine: SELECT doc FROM items WHERE item_id = 500;\n    Engine->>Index: find_entries(500) -> CTID (0, 2)\n    Engine->>Heap: get((0, 2)) -> HeapTuple\n    Note over Engine: Check tuple.header.infomask and HEAP_HASEXTERNAL\n    alt HEAP_HASEXTERNAL is TRUE\n        Engine->>Toast: fetch_toast_payload(pointer.toast_id, pointer.raw_size)\n        Toast-->>Engine: Reassembled 10000-byte document text\n    else HEAP_HASEXTERNAL is FALSE\n        Engine->>Engine: Read inline string\n    end\n    Engine-->>Client: Return document text to user\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| TOAST is transparent to the executor; detoast happens on attribute access | **Exact** |\n| A flag on the tuple marks the presence of external attributes | **Exact in shape** |\n| Index entries are unaffected when the indexed column is not the toasted one | **Exact** |\n| `HEAP_HASEXTERNAL = 0x2000` | **Wrong for PostgreSQL** — `0x0004`; `0x2000` is `HEAP_UPDATED` |\n| The flag is what drives detoasting | **Simplified** — PostgreSQL dispatches on the varlena header (`VARATT_IS_EXTERNAL`) per datum |\n| \"Index is 100% unaffected by TOAST\" | **True for this schema only** — indexing a toastable column stores the value in the index tuple, subject to the ~2704-byte B-tree limit |\n| Heap and TOAST relations opened together at startup | **Exact in spirit** — PostgreSQL links them via `pg_class.reltoastrelid` |\n\n### Not modelled\n\n- **TOAST relations are real tables.** Chunks carry their own MVCC headers, are vacuumed, and appear in `pg_class` / `pg_toast`. An `UPDATE` that does not touch the toasted column **reuses the existing chunks** — PostgreSQL copies the pointer into the new row version rather than rewriting the value, which is a large part of why wide-column updates are cheap.\n- **Slice access.** `substr()` on an `EXTERNAL`-storage column fetches only the chunks it needs, via the `(chunk_id, chunk_seq)` index. This engine always reassembles the whole value.\n- **Compression state.** PostgreSQL tracks compressed vs raw size in the pointer itself (Item 10).\n"},{"path":"18-embedded-http-rest-server.md","title":"Item 18: Embedded HTTP/REST API Server (Approach A)","md":"# Item 18: Embedded HTTP/REST API Server (Approach A)\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/http_server.h:1-45](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/http_server.h), [src/http_server.cpp:1-210](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/http_server.cpp), [tests/test_http_server.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_http_server.cpp)\n\n---\n\n## 1. 2-Tier Architecture & Web Integration\n\nItem 18 implements **Approach A: Direct Embedded HTTP/REST Server**.\nThe database binary embeds a lightweight, non-blocking Winsock2 HTTP 1.1 server listening on port `8080`, allowing web applications (e.g. React, Vue, cURL) to query the database directly via JSON.\n\n**This has no PostgreSQL counterpart** — PostgreSQL speaks only the frontend/backend protocol on 5432 (Item 19), and HTTP access is provided by external projects (PostgREST, pgHttp, Supabase's API layer) sitting in front of it. Item 18 is a convenience for the desktop demo, not a modelled PostgreSQL subsystem.\n\n> Note that `Access-Control-Allow-Origin: *` on an endpoint that executes arbitrary SQL with no authentication is only acceptable because this daemon is intended to bind loopback on a developer machine. It must not be exposed on a routable interface.\n\n```mermaid\nflowchart LR\n    subgraph Frontend[\"Browser / React Application\"]\n        FETCH[\"fetch('http://localhost:8080/api/sql', {\\n  method: 'POST',\\n  body: 'SELECT * FROM items;'\\n})\"]\n    end\n\n    subgraph ServerDaemon[\"cpp-postgres HttpServer (:8080)\"]\n        CORS[\"CORS Pre-Flight (OPTIONS)\"]\n        STATUS[\"GET /api/status -> JSON Engine Metrics\"]\n        ITEMS[\"GET /api/items -> JSON Row Array\"]\n        SQL[\"POST /api/sql -> JSON {success, output}\"]\n    end\n\n    subgraph CoreEngine[\"pg::Engine\"]\n        CORE[\"Buffer Pool · Heap · WAL · B-Tree\"]\n    end\n\n    FETCH --> CORS\n    FETCH --> STATUS\n    FETCH --> ITEMS\n    FETCH --> SQL\n    SQL -->|Thread-Safe Mutex Lock| CORE\n```\n\n---\n\n## 2. Invariants & REST Endpoints\n\n1. **Full CORS Support**: Automatically handles `OPTIONS` requests and emits headers allowing cross-origin requests from any local frontend port:\n   - `Access-Control-Allow-Origin: *`\n   - `Access-Control-Allow-Methods: GET, POST, OPTIONS, PUT, DELETE`\n   - `Access-Control-Allow-Headers: Content-Type, Authorization`\n2. **JSON Response Contract**:\n   - `POST /api/sql`: Executes arbitrary SQL and returns `{ \"success\": true, \"sql\": \"...\", \"output\": \"...\" }`.\n   - `GET /api/items`: Streams live table rows directly as structured JSON objects:\n     ```json\n     {\n       \"items\": [\n         { \"item_id\": 100, \"price\": 10, \"xmin\": 1, \"xmax\": 0, \"ctid\": \"(0, 1)\" }\n       ]\n     }\n     ```\n3. **Thread Safety**: All incoming HTTP worker threads synchronize access to `pg::Engine` using `std::mutex engine_mutex_`.\n\n---\n\n## 3. Sequence Diagram: React Browser Query via HTTP\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant React as React Frontend (Browser)\n    participant HTTP as HttpServer (src/http_server.cpp)\n    participant Engine as pg::Engine Core\n\n    Note over React,HTTP: CORS Pre-flight Check\n    React->>HTTP: OPTIONS /api/sql\n    HTTP-->>React: HTTP 204 No Content (Access-Control-Allow-Origin: *)\n\n    Note over React,HTTP: SQL Execution Request\n    React->>HTTP: POST /api/sql (INSERT item 100, price 10)\n    HTTP->>HTTP: Parse HTTP Request Line & Content-Length\n    HTTP->>Engine: lock(engine_mutex_) -> execute(sql)\n    Engine-->>HTTP: Output string\n    HTTP->>HTTP: Format JSON response\n    HTTP-->>React: HTTP 200 OK (JSON success and output)\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\nNot applicable — no PostgreSQL analogue. See Item 19 for the subsystem that *is* protocol-accurate.\n"},{"path":"19-pgwire-protocol-server.md","title":"Item 19: PostgreSQL Wire Protocol Server (Approach C)","md":"# Item 19: PostgreSQL Wire Protocol Server (Approach C)\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/pgwire.h:1-55](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/pgwire.h), [src/pgwire.cpp:1-320](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/pgwire.cpp), [tests/test_pgwire.cpp:1-160](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_pgwire.cpp)\n\n---\n\n## 1. Enterprise 3-Tier Integration Architecture\n\nItem 19 implements **Approach C: Native PostgreSQL Frontend/Backend Protocol v3.0**.\nListening on TCP port `5432`, `PgWireServer` transforms `cpp-postgres` into a drop-in PostgreSQL server compatible with standard PostgreSQL CLI tools, GUI clients, drivers, and ORMs.\n\n```mermaid\nflowchart LR\n    subgraph Ecosystem[\"Standard PostgreSQL Ecosystem\"]\n        PSQL[\"psql CLI\"]\n        PGADMIN[\"pgAdmin / DBeaver\"]\n        NODE[\"Node.js ('pg' / Prisma)\"]\n        PYTHON[\"Python ('psycopg2')\"]\n    end\n\n    subgraph PgWire[\"PgWireServer (Port 5432)\"]\n        SSL[\"SSLRequest ('N' Plaintext)\"]\n        AUTH[\"Startup / AuthOk ('R')\"]\n        QUERY[\"Simple Query ('Q') Engine\"]\n        ROWDESC[\"RowDescription ('T')\"]\n        DATAROW[\"DataRow ('D')\"]\n        COMPLETE[\"CommandComplete ('C')\"]\n        READY[\"ReadyForQuery ('Z')\"]\n    end\n\n    subgraph Storage[\"pg::Engine\"]\n        CORE[\"Relational Engine\"]\n    end\n\n    Ecosystem -->|Binary TCP Packets| SSL\n    SSL --> AUTH --> QUERY\n    QUERY --> ROWDESC --> DATAROW --> COMPLETE --> READY\n    QUERY <--> CORE\n```\n\n---\n\n## 2. Invariants & Packet Framing\n\n1. **Big-Endian Integer Serialization**: All 16-bit and 32-bit fields are transmitted in Network Byte Order (`htonl`/`htons`) (`[src/pgwire.cpp:15]`).\n2. **Binary Message Format**:\n   - StartupMessage -> AuthenticationOk (R, len 8, 0) -> ParameterStatus (S) -> ReadyForQuery (Z, I).\n   - A real PostgreSQL backend also sends **BackendKeyData (`K`, PID + secret)** between the last `ParameterStatus` and `ReadyForQuery`; it is what a client needs in order to issue a `CancelRequest` on a second connection. Most drivers tolerate its absence, but `pg_cancel_backend`-style cancellation cannot work without it.\n   - Query (Q) -> RowDescription (T) -> DataRow (D)* -> CommandComplete (C) -> ReadyForQuery (Z).\n3. **Transaction State Synchronization**: The ReadyForQuery (Z) packet transmits I when idle and T when an active transaction block is open. PostgreSQL defines a third state, **`E`** — in a transaction block that has hit an error, where every statement is rejected until `ROLLBACK`. That is the state `psql` reports as `!`.\n\n---\n\n## 3. Sequence Diagram: PostgreSQL Wire Protocol Handshake & Query\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as psql Client Driver\n    participant Server as PgWireServer (src/pgwire.cpp)\n    participant Engine as pg::Engine Core\n\n    Note over Client,Server: Connection Handshake\n    Client->>Server: SSLRequest (len 8, code 80877103)\n    Server-->>Client: Plaintext response N\n    Client->>Server: StartupMessage (Protocol 3.0, user postgres)\n    Server-->>Client: AuthenticationOk (R, len 8, 0)\n    Server-->>Client: ParameterStatus (S, server_version 16.0)\n    Server-->>Client: ReadyForQuery (Z, Idle)\n\n    Note over Client,Server: Query Execution Lifecycle\n    Client->>Server: Query (Q, SELECT star FROM items)\n    Server->>Engine: execute select all items\n    Server-->>Client: RowDescription (T, 5 columns: item_id, price, xmin, xmax, ctid)\n    Server-->>Client: DataRow (D, values: 100, 10, 1, 0, 0:1)\n    Server-->>Client: CommandComplete (C, SELECT 1)\n    Server-->>Client: ReadyForQuery (Z, Idle)\n\n    Note over Client,Server: Graceful Termination\n    Client->>Server: Terminate (X, len 4)\n    Server->>Server: Close Socket\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| Protocol v3.0, `SSLRequest` code 80877103, `N` to decline TLS | **Exact** |\n| Message framing: 1-byte type tag + int32 length (length includes itself, excludes the tag) | **Exact** |\n| Big-endian / network byte order throughout | **Exact** |\n| Simple Query flow `Q -> T -> D* -> C -> Z` | **Exact** |\n| `Z` carries `I` / `T` transaction status | **Incomplete** — `E` (failed transaction block) also exists |\n| Startup: `R` -> `S`* -> `Z` | **Incomplete** — a real backend sends `K` (BackendKeyData) before `Z` |\n\n### Not implemented\n\n- **Extended query protocol** (`P` Parse / `B` Bind / `D` Describe / `E` Execute / `S` Sync) — used by every driver that supports prepared statements or server-side parameter binding, including JDBC and `psycopg` by default.\n- **Authentication beyond `AuthenticationOk`** — no `scram-sha-256`, no `md5`, no TLS. Any client that connects is trusted.\n- **`COPY` sub-protocol** (`G`/`H`/`d`/`c`), **`N` NoticeResponse**, **`A` NotificationResponse** (`LISTEN`/`NOTIFY`), **`CancelRequest`**.\n- **Catalog queries.** `psql` backslash commands (`\\d`, `\\dt`) issue `pg_catalog` queries; without those tables they will fail even though the connection succeeds.\n"},{"path":"20-desktop-gui-and-unified-server.md","title":"Item 20: Native Desktop GUI & Unified Server Daemon","md":"# Item 20: Native Desktop GUI & Unified Server Daemon\n\n**Confidence**: `verified`  \n**Citations**: [src/gui/main_gui.cpp:1-480](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/gui/main_gui.cpp), [src/server_main.cpp:1-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/server_main.cpp), [CMakeLists.txt:100-150](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/CMakeLists.txt)\n\n---\n\n## 1. Unified Applications Overview\n\nItem 20 delivers two standalone executable artifacts:\n1. **`pg_gui.exe` (3.89 MB)**: A self-contained Windows desktop GUI application built with **Dear ImGui + DirectX 11 + Win32**, providing visual memory inspectors for 8KB slotted pages, clock-sweep buffer frames, on-disk B-Tree graphs, and an interactive SQL scratchpad.\n2. **`pg_server.exe`**: A multi-protocol daemon running both **Approach A (HTTP REST :8080)** and **Approach C (pgwire TCP :5432)** concurrently on background threads, wired to a shared `pg::Engine`.\n\n```mermaid\nflowchart TD\n    subgraph StandaloneApps[\"Executable Applications\"]\n        GUI[\"pg_gui.exe (Desktop Explorer)\\n• DirectX 11 + Dear ImGui\\n• Live Slotted Page Memory Bar\\n• Real-Time Clock-Sweep Visualizer\\n• B-Tree Index Key Mapper\"]\n        SRV[\"pg_server.exe (Unified Server Daemon)\\n• Background Thread 1: HTTP :8080\\n• Background Thread 2: pgwire :5432\\n• Signal Handler & Console CLI\"]\n    end\n\n    subgraph CoreEngine[\"Shared Core Library (pg_core)\"]\n        ENG[\"pg::Engine (C++20)\\nShared Buffers · Slotted Pages · WAL + ARIES undo (this engine only, not PostgreSQL - see Item 16) · CLOG · TOAST\"]\n    end\n\n    GUI --> ENG\n    SRV --> ENG\n```\n\n---\n\n## 2. Desktop GUI Feature Breakdown\n\n```text\n┌────────────────────────────────────────────────────────────────────────────────────────┐\n│  🐘 CPP-POSTGRES STORAGE ENGINE DESKTOP EXPLORER                         [ _ □ ✕ ]   │\n├──────────────────────────┬─────────────────────────────────────────────────────────────┤\n│ 📝 SQL QUERY WORKSPACE   │ 🔬 PHYSICAL STORAGE ENGINE VISUALIZERS                      │\n│ ┌──────────────────────┐ │ [📄 8KB Slotted Page] [🧠 Shared Buffers] [🌲 Disk B-Tree]  │\n│ │ SELECT * FROM items; │ │ ─────────────────────────────────────────────────────────── │\n│ └──────────────────────┘ │ Page 0 Header (18B) | pd_lower: 30B | pd_upper: 8120B      │\n│ [▶ Run F5] [BEGIN]      │ [■■■ Line Pointers] [        Free Space        ] [■■ Tuples] │\n│ [COMMIT]   [ROLLBACK]   │ ┌────────┬────────┬────────┬───────────────────────────────┐ │\n│ [STATUS]   [VACUUM]     │ │ Slot # │ Offset │ Length │ Live Tuple Details            │ │\n│                         │ ├────────┼────────┼────────┼───────────────────────────────┤ │\n│ 📋 LIVE TABLE VIEW      │ │ Slot 1 │ 8168   │ 24 B   │ [LIVE] id=100, price=10       │ │\n│ ┌─────┬───────┬────┬───┐│ │ Slot 2 │ 8144   │ 24 B   │ [HOT REDIRECT] -> (0, 3)      │ │\n│ │ id  │ price │xmin│CTI││ │ Slot 3 │ 8120   │ 24 B   │ [HEAP-ONLY TUPLE] id=100, 20  │ │\n│ ├─────┼───────┼────┼───┤│ └────────┴────────┴────────┴───────────────────────────────┘ │\n│ │ 100 │ 20    │ 4  │0,3││                                                             │\n│ │ 200 │ 5     │ 2  │0,2││ 🧠 Shared Buffers Tab: Live Clock-Sweep & Pin Tracking       │\n│ └─────┴───────┴────┴───┘│ 🌲 Disk B-Tree Tab: Key -> Candidate CTID Mapping           │\n│                         │ 🚦 CLOG Tab: 2-bit Transaction Status Bitmaps               │\n│ 📊 OUTPUT LOG CONSOLE   │ 📜 WAL Tab: Crash Recovery & Checkpoints (see Item 16)       │\n│                         │ 🍞 TOAST Tab: 2KB Chunk Auxiliary Table Inspector           │\n└──────────────────────────┴─────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 3. Sequence Diagram: Dual Server Daemon Operation\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Main as Server Main (src/server_main.cpp)\n    participant Engine as Shared pg::Engine\n    participant HTTP as HttpServer (Port 8080)\n    participant PGW as PgWireServer (Port 5432)\n    participant React as React Browser\n    participant PSQL as psql CLI\n\n    Main->>Engine: Initialize Database\n    Main->>HTTP: start_async (Spawns HTTP Worker Thread)\n    Main->>PGW: start_async (Spawns pgwire Worker Thread)\n    \n    par Concurrent Client Queries\n        React->>HTTP: POST /api/sql (insert item)\n        HTTP->>Engine: lock mutex and execute\n        Engine-->>HTTP: JSON output\n        HTTP-->>React: HTTP 200 OK\n    and\n        PSQL->>PGW: Simple Query Q (select items)\n        PGW->>Engine: lock mutex and seq_scan\n        Engine-->>PGW: Tuples\n        PGW-->>PSQL: RowDescription T and DataRow D\n    end\n\n    Note over Main: User types quit or sends SIGINT\n    Main->>HTTP: stop (Closes socket)\n    Main->>PGW: stop (Closes socket)\n    Main-->>Main: Database cleanly persisted to disk\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\nBoth binaries are original to this project; PostgreSQL ships `postgres`/`postmaster` plus `psql`, and its GUIs (pgAdmin, DBeaver) are separate projects speaking the wire protocol.\n\nTwo labels in the diagrams above are worth reading precisely:\n\n- **\"ARIES undo\"** describes *this engine*. PostgreSQL's WAL is ARIES-influenced but redo-only — no undo pass, no CLRs (Item 16).\n- **\"Page 0 Header (18B)\"** in the GUI mock is this engine's header. PostgreSQL's is 24 bytes (Item 2).\n\nThe `pg_server.exe` process model — one process, two listener threads, one shared `pg::Engine` behind a mutex — is also structurally unlike PostgreSQL, which forks a dedicated backend process per connection and coordinates through shared memory and lightweight locks. The single global mutex here means exactly one statement runs at a time, so none of the MVCC concurrency documented in Item 4 is actually exercised in parallel.\n"},{"path":"21-free-space-map.md","title":"Item 21: Free Space Map (FSM) Binary Max-Heap Tree","md":"# Item 21: Free Space Map (FSM) Binary Max-Heap Tree\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/fsm.h:1-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/fsm.h), [src/fsm.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/fsm.cpp), [src/heap.cpp:55-120](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/heap.cpp), [tests/test_fsm.cpp:1-180](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_fsm.cpp)\n\n---\n\n## 1. Free Space Map Architecture\n\nIn a production RDBMS, tuple insertion cannot afford to sequentially probe table pages looking for room, nor can it simply append to the end of the file and leave holes reclaimed by VACUUM permanently stranded.\n\nPostgreSQL solves this with the **Free Space Map (FSM)** companion fork (`<relfilenode>_fsm`). The FSM organizes the free space of every heap page into a binary max-heap tree stored inside dedicated 8KB disk pages (`storage/freespace/fsm_storage.c`).\n\n```mermaid\nflowchart TD\n    subgraph FsmTree[\"8KB FSM Page Complete Binary Max-Heap\"]\n        ROOT[\"Root Node 0: Max Category 218\"]\n        L1[\"Left Node 1: Pages 0-2047 Max 218\"]\n        R1[\"Right Node 2: Pages 2048-4095 Max 32\"]\n        LEAF0[\"Leaf 4095 Heap Page 0: Category 218\"]\n        LEAF1[\"Leaf 4096 Heap Page 1: Category 2\"]\n    end\n\n    ROOT --> L1\n    ROOT --> R1\n    L1 -.-> LEAF0\n    L1 -.-> LEAF1\n\n    INSERT[\"Insert Tuple 28 Bytes: Needed Category 1\"]\n    INSERT -->|Binary Search| ROOT\n    ROOT -->|Descent| LEAF0\n    LEAF0 -->|Allocate Tuple| HEAP0[\"Target Heap Page 0\"]\n```\n\n---\n\n## 2. Invariants & Binary Tree Layout\n\n1. **Exact 8KB Page Mathematical Fit** (`[include/pg/fsm.h:12-28]`):\n   - In an 8,192-byte block, setting binary tree depth $D = 12$ yields:\n     - $L = 2^{12} = 4,096$ leaf nodes (each representing one heap page).\n     - $I = 2^{12} - 1 = 4,095$ internal router nodes.\n     - Total tree nodes: $4,096 + 4,095 = 8,191$ bytes.\n     - Adding 1 byte of padding/reserved space produces an exact 8,192-byte struct:\n       ```cpp\n       #pragma pack(push, 1)\n       struct FsmPage {\n           uint8_t nodes[8191]; // Complete binary tree: 0=root, 4095..8190=leaves\n           uint8_t reserved{0}; // Pad to exactly PAGE_SIZE (8192 bytes)\n       };\n       #pragma pack(pop)\n       static_assert(sizeof(FsmPage) == 8192);\n       ```\n2. **1-Byte Categorical Discretization** (`[include/pg/fsm.h:42-56]`):\n   - Rather than storing multi-byte integer byte counts, free space is categorized in **32-byte chunks** from category $0$ to $255$:\n     $$\\text{category} = \\min\\left(255, \\left\\lfloor \\frac{\\text{free\\_bytes}}{32} \\right\\rfloor\\right)$$\n   - Category 0 represents $0 \\dots 31$ bytes free space (full).\n   - Category 255 represents $\\ge 8,160$ bytes free space (empty).\n3. **$O(\\log M)$ Tree Traversal**:\n   - `search_page(needed_bytes)`: Evaluates `nodes[0] >= target_cat`. If false, returns `INVALID_PAGE_ID` in $O(1)$. If true, descends checking left child first in at most 12 comparisons ($< 20$ nanoseconds).\n   - `update_page(pid, free_space)`: Assigns `nodes[4095 + slot] = category` and bubbles up the new maximum to the root in at most 12 parent comparisons.\n4. **VACUUM Recycling**:\n   - During Phase 3 page compaction (`[src/vacuum.cpp:168]`), VACUUM updates the FSM with the compacted page's free space. Subsequent inserts immediately route to the newly available space.\n\n---\n\n## 3. Sequence Diagram: Space Allocation & Dynamic Recycling\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Engine as Engine DML\n    participant Heap as HeapFile\n    participant FSM as FreeSpaceMap\n    participant BPM as BufferPoolManager\n    participant Page0 as Heap Page 0\n    participant VAC as Vacuum\n\n    Note over Engine,Page0: 1. Initial State: Page 0 is full\n    Engine->>Heap: insert record\n    Heap->>FSM: search_page needed=28B\n    FSM-->>Heap: No page with room in Page 0 range\n    Heap->>BPM: new_page\n    Heap->>FSM: update_page pid=1, free=8128\n\n    Note over VAC,Page0: 2. Tuples deleted on Page 0, VACUUM runs\n    VAC->>Page0: defragment\n    VAC->>FSM: update_page pid=0, free=6976\n    Note over FSM: Category 218 bubbled up to root of FSM Page 0\n\n    Note over Engine,Page0: 3. Next INSERT instantly reuses Page 0\n    Engine->>Heap: insert record\n    Heap->>FSM: search_page needed=28B\n    FSM-->>Heap: Target Heap Page 0\n    Heap->>Page0: insert_tuple slot=1\n    Heap->>FSM: update_page pid=0, free=6944\n    Heap-->>Engine: CTID 0-1 reused\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| FSM is stored in a companion fork (`<relfilenode>_fsm`) | **Exact** |\n| 8KB page structured as complete binary tree with 4,096 leaves | **Exact** (`fsm_storage.c`) |\n| Categorical discretization in 32-byte units ($0 \\dots 255$) | **Exact** (`FSM_CATEGORIES = 256`) |\n| Binary search descends choosing leftmost child with sufficient category | **Exact** |\n| VACUUM updates FSM after defragmentation | **Exact** |\n| Multi-level FSM for gigabyte-scale tables | **Simplified** — PostgreSQL uses a 3-level tree where upper pages index lower FSM pages. This engine uses a linear array of FSM pages where each page indexes 4,096 heap pages (32MB data per FSM page). |\n| Unlogged FSM updates | **Exact** — FSM is an unlogged cache of heap space; corrupted/stale FSM blocks do not cause data loss. |\n"},{"path":"22-clog-slru-cache.md","title":"Item 22: CLOG SLRU Shared Memory Buffer Cache","md":"# Item 22: CLOG SLRU Shared Memory Buffer Cache\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/clog.h:1-85](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/clog.h), [src/clog.cpp:1-175](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/clog.cpp), [src/engine.cpp:30-70,410-435](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/engine.cpp), [tests/test_clog.cpp:1-210](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_clog.cpp)\n\n---\n\n## 1. The Commit Scalability Bottleneck\n\nIn relational database systems, transaction status recording is on the ultra-critical path of every `COMMIT` and `ABORT` operation. In an initial naive implementation (Audit Finding 2.8), every status change issued an 8KB disk read and an 8KB disk write straight through the `Pager`. For high-concurrency workloads, this forced 16KB of synchronous disk I/O per transaction, collapsing transaction throughput.\n\nPostgreSQL never writes commit statuses directly to disk synchronously. The fundamental durability contract of ACID is satisfied solely by the **Write-Ahead Log (WAL)**: once `WALRecordType::COMMIT` is forced to durable media via `File::sync()` / `fdatasync()`, the transaction is permanently durable.\n\nThe **Commit Log (`pg_xact`, historically `pg_clog`)** is managed via an **SLRU (Simple Least Recently Used)** shared memory buffer pool. Status transitions mutate shared memory frames in nanoseconds, and dirty frames are lazily written to disk during background checkpoints, page evictions, or engine shutdown.\n\n```mermaid\nflowchart TD\n    subgraph ClientTx[\"Client Transaction\"]\n        TX[\"Transaction Commit (XID: 42000)\"]\n    end\n\n    subgraph DurabilityBarrier[\"Synchronous Durability Barrier\"]\n        WAL[\"WALManager::log_commit(42000)\\nWAL Buffer Append\"]\n        FSYNC[\"File::sync() on WAL File\\n(ACID Durability Secured)\"]\n    end\n\n    subgraph ClogSlru[\"CLOG SLRU Buffer Pool (Shared Memory - 256 KB)\"]\n        FRAME[\"Frame 1: Page 1 (XIDs 32768..65535)\\n2-bit Flip: 0b01 COMMITTED\\ndirty = true, O(1) in-memory\"]\n    end\n\n    subgraph Storage[\"Persistent Disk Media\"]\n        WAL_DISK[(\"wal.log (Disk)\")]\n        CLOG_DISK[(\"clog.db (Disk)\")]\n    end\n\n    TX --> WAL\n    WAL --> FSYNC\n    FSYNC --> WAL_DISK\n    FSYNC -->|Immediate Return| TX\n    TX -.->|In-Memory Bit Flip| FRAME\n    FRAME -.->|Deferred Checkpoint / Eviction| CLOG_DISK\n```\n\n---\n\n## 2. Invariants & Mathematical Layout\n\n1. **2-Bit Status Layout & Bit Arithmetic** (`[include/pg/clog.h:14-23]`):\n   - Each byte holds 4 transaction statuses ($\\frac{8 \\text{ bits}}{2 \\text{ bits/status}} = 4$).\n   - An 8,192-byte page stores $8,192 \\times 4 = 32,768$ transactions.\n   - For a given transaction $T$:\n     $$\\text{page\\_id} = \\left\\lfloor \\frac{T}{32768} \\right\\rfloor$$\n     $$\\text{byte\\_offset} = \\left\\lfloor \\frac{T \\pmod{32768}}{4} \\right\\rfloor$$\n     $$\\text{bit\\_shift} = 2 \\times (T \\pmod 4)$$\n   - Masking and bit manipulation execute in constant time:\n     ```cpp\n     uint8_t current = frame.data[byte_offset];\n     current &= ~(CLOG_STATUS_MASK << bit_shift);\n     current |= (static_cast<uint8_t>(status) & CLOG_STATUS_MASK) << bit_shift;\n     frame.data[byte_offset] = current;\n     frame.dirty = true;\n     ```\n\n2. **SLRU Buffer Pool Sizing & Capacity** (`[include/pg/clog.h:24-35]`):\n   - Configured with `CLOG_SLRU_BUFFERS = 32` frames.\n   - Total RAM footprint: $32 \\times 8,192 \\text{ bytes} = 256 \\text{ KB}$.\n   - Resident transaction capacity: $32 \\times 32,768 = 1,048,576$ active transactions resident in RAM.\n   - For working sets under 1 million active transactions, CLOG cache hit ratio is $> 99.9\\%$.\n\n3. **Zero I/O on `begin_transaction`**:\n   - Status `0b00` is defined as `IN_PROGRESS`.\n   - Because freshly allocated CLOG pages are initialized to all zeroes (`0x00`), new transactions implicitly start as `IN_PROGRESS` without modifying CLOG or generating dirty pages.\n\n4. **Monotonic LRU Replacement & Deferred Writeback** (`[src/clog.cpp:68-105]`):\n   - Each frame maintains a 64-bit `lru_counter`.\n   - Every lookup or mutation advances a global monotonic clock `lru_clock_` and stamps the frame.\n   - When a page miss occurs and all 32 frames are occupied, `victim_frame()` selects the frame with the minimum `lru_counter`.\n   - If the victim is dirty, `write_frame()` writes the 8KB page back to the pager before reusing the slot.\n\n5. **Checkpoint & Clean Shutdown Flush** (`[src/engine.cpp:410-435]`):\n   - `CLogManager::flush()` iterates through all frames, writes out dirty pages, clears the dirty flags, and issues `File::sync()` on the underlying pager.\n   - Invoked during `Engine::checkpoint()` and `Engine::~Engine()`.\n\n---\n\n## 3. Sequence Diagram: SLRU Cache Access & Eviction Lifecycle\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as Session\n    participant CLOG as CLogManager\n    participant Frames as SlruFrames\n    participant Disk as Pager\n\n    Note over Client,Disk: 1. In-Memory Cache Hit\n    Client->>CLOG: set_status tx=1005, COMMITTED\n    CLOG->>Frames: find_or_load_frame page_id=0\n    Frames-->>CLOG: Frame 0 found Hit\n    CLOG->>Frames: Update 2 bits in Frame 0, dirty = true\n    CLOG-->>Client: Return Zero Disk IO\n\n    Note over Client,Disk: 2. Cache Miss and LRU Eviction\n    Client->>CLOG: set_status tx=1050000, COMMITTED\n    CLOG->>Frames: find_or_load_frame page_id=32\n    Frames-->>CLOG: Miss! All 32 frames full\n    CLOG->>Frames: victim_frame Frame 3 selected\n    Note over CLOG,Frames: Frame 3 is dirty, must write back\n    CLOG->>Disk: write_page pid=victim, frame_3_data\n    CLOG->>Disk: read_page page_id=32, frame_3_data\n    CLOG->>Frames: Frame 3 re-assigned to page 32\n    CLOG->>Frames: Update 2 bits in Frame 3, dirty = true\n    CLOG-->>Client: Return\n\n    Note over Client,Disk: 3. Checkpoint Coordinated Flush\n    Client->>CLOG: flush\n    loop Every resident frame\n        CLOG->>Disk: write_page frame.page_id, frame.data\n        CLOG->>Frames: frame.dirty = false\n    end\n    CLOG->>Disk: sync Durable Fsync\n    CLOG-->>Client: All CLOG state synchronized\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict | Implementation Details |\n|---|---|---|\n| 2-bit commit status bitmap | **Exact** | 4 transactions per byte (`0b00` = In-Progress, `0b01` = Committed, `0b10` = Aborted, `0b11` = Sub-Committed). Matches `access/transam/clog.c`. |\n| Shared memory SLRU buffer cache | **Exact** | Dedicated 32-frame SLRU buffer pool (`SlruFrame`), avoiding general buffer pool thrashing by high-frequency sequential transaction status updates. |\n| Asynchronous commit status logging | **Exact** | Durability is provided exclusively by WAL (`WALRecordType::COMMIT`). CLOG writes are purely in-memory until eviction or checkpoint. |\n| Zero I/O on transaction start | **Exact** | `begin_transaction` no longer touches CLOG; fresh pages initialize with `0b00` (`IN_PROGRESS`). |\n| Multi-page automatic scaling | **Exact** | Supports arbitrary transaction counts, dynamically creating new 8KB pages as XIDs cross 32,768 boundaries. |\n| Checkpoint flush integration | **Exact** | `Engine::checkpoint()` flushes dirty SLRU frames and syncs the pager. |\n"},{"path":"23-volcano-query-executor.md","title":"Item 23: Volcano Iterator Query Execution Engine","md":"# Item 23: Volcano Iterator Query Execution Engine\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/executor.h:1-170](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/executor.h), [src/executor.cpp:1-260](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/executor.cpp), [src/engine.cpp:320-375,640-715](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/engine.cpp), [tests/test_executor.cpp:1-220](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_executor.cpp)\n\n---\n\n## 1. Batch Materialization vs. Volcano Demand-Driven Iterators\n\nIn traditional relational engines, executing queries by loading all rows into a contiguous array (batch materialization) violates basic resource bounds. In an early implementation (Audit Finding 2.5), `HeapFile::seq_scan()` materialized every tuple across every disk page into an unbounded `std::vector<std::pair<CTID, HeapTuple>>`.\n\nOn a table with millions of rows, batch materialization produces three severe pathological failure modes:\n1. **$O(N)$ Memory Consumption**: Memory footprint scales with relation size, causing buffer pool thrashing and memory exhaustion.\n2. **Exhaustive I/O for Pipelined Queries**: A query like `SELECT * FROM items LIMIT 1` forced the engine to scan every single 8KB disk block and deserialize every tuple in the relation before returning the first result.\n3. **Monolithic Query Path**: Lack of composable operators prevented query planning and runtime profiling.\n\nPostgreSQL solves this using the **Volcano Demand-Driven Iterator Model** (Graefe, 1994), implemented across `src/backend/executor/`. Query plans form a tree of `PlanState` nodes where parent nodes pull tuples from child nodes one at a time via `ExecProcNode()`.\n\n```mermaid\nflowchart TD\n    subgraph PlanTree[\"Volcano Execution Plan Tree\"]\n        LIMIT[\"LimitNode (limit=5, offset=0)\"]\n        FILTER[\"FilterNode (price > 50)\"]\n        SCAN[\"SeqScanNode (items relation)\"]\n    end\n\n    subgraph SharedBuffers[\"Shared Buffer Pool (RAM)\"]\n        FRAME[\"Frame P: Heap Page P (Pinned: pin_count=1)\"]\n    end\n\n    LIMIT -->|next slot| FILTER\n    FILTER -->|next slot| SCAN\n    SCAN -.->|pin exactly 1 page| FRAME\n```\n\n---\n\n## 2. Invariants & Mathematical Guarantees\n\n1. **Standardized Currency (`TupleTableSlot`)** (`[include/pg/executor.h:18-38]`):\n   - Rather than exchanging physical byte pointers or allocating new structs per operator, operators communicate through a standardized `TupleTableSlot` (`include/executor/tuptable.h`).\n   - A slot encapsulates:\n     - Physical `CTID` (`page_id`, `slot_id`)\n     - `HeapTuple` data payload and MVCC transaction headers (`xmin`, `xmax`, `infomask`)\n     - State boolean (`is_empty`)\n   - Reused across successive `next()` invocations, ensuring zero allocation overhead during tuple streaming.\n\n2. **Single-Buffer Pinning Invariant ($O(1)$ Buffer Pool Pins)** (`[src/executor.cpp:25-65]`):\n   - During sequential table scans across an arbitrary number of 8KB disk pages $P \\in [1, \\infty)$:\n     $$\\text{pinned\\_frames} \\le 1$$\n   - When `SeqScanNode` finishes inspecting the line pointers of Page $k$, it releases the pin on Page $k$ via `curr_page_.release()` before pinning Page $k + 1$.\n   - This prevents sequential scans from exhausting shared buffer pool frames or starving concurrent writers.\n\n3. **Pipelined Early Termination Complexity** (`[src/executor.cpp:180-220]`):\n   - For a relation with $P$ pages and $N$ tuples, a query requesting `LIMIT K` terminates as soon as $K$ matching tuples are produced:\n     $$\\text{Pages Scanned} = \\min\\left(P, \\left\\lceil \\frac{K}{\\text{tuples\\_per\\_page}} \\right\\rceil\\right)$$\n   - For `SELECT * FROM items LIMIT 1`, `Pages Scanned = 1 \\ll P`. Subsequent pages are never read from disk or cached in memory.\n\n4. **HOT Chain Resolution in Index Scans** (`[src/executor.cpp:90-135]`):\n   - `IndexScanNode` looks up candidate CTIDs from `DiskBTree`.\n   - For each candidate CTID, it executes `heap_.hot_search()`, traversing `t_ctid` pointers to find the version visible to the caller's snapshot.\n   - Visited CTIDs are tracked to prevent duplicate emissions if multiple index entries reference the same row.\n\n---\n\n## 3. Sequence Diagram: Pipelined Pull Lifecycle\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as Client Application\n    participant Limit as LimitNode\n    participant Filter as FilterNode\n    participant Scan as SeqScanNode\n    participant BPM as BufferPoolManager\n\n    Note over Client,BPM: 1. Execution Initialization\n    Client->>Limit: init\n    Limit->>Filter: init\n    Filter->>Scan: init\n\n    Note over Client,BPM: 2. Demand-Driven Tuple Pull (Row 1)\n    Client->>Limit: next slot\n    Limit->>Filter: next slot\n    Filter->>Scan: next slot\n    Scan->>BPM: fetch_page pid=0 (pin=1)\n    Scan-->>Filter: slot CTID 0-1, price=10\n    Note over Filter: Predicate price > 50 fails (10 <= 50)\n    Filter->>Scan: next slot\n    Scan-->>Filter: slot CTID 0-6, price=60\n    Note over Filter: Predicate price > 50 passes (60 > 50)\n    Filter-->>Limit: slot CTID 0-6, price=60\n    Limit-->>Client: slot CTID 0-6, price=60 (Count: 1 of 1)\n\n    Note over Client,BPM: 3. Early Termination (LIMIT Reached)\n    Client->>Limit: next slot\n    Note over Limit: limit count reached! Immediate EOF\n    Limit-->>Client: false (EOF)\n    Client->>Limit: end\n    Limit->>Scan: end\n    Scan->>BPM: unpin_page pid=0 (pin=0)\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict | Implementation Details |\n|---|---|---|\n| Demand-Driven Volcano Iterator Model | **Exact** | Reconstructs `ExecInitNode`, `ExecProcNode`, and `ExecEndNode` through `PlanNode::init()`, `PlanNode::next()`, and `PlanNode::end()`. Matches `src/backend/executor/execProcnode.c`. |\n| Standardized Tuple Slot | **Exact** | `TupleTableSlot` encapsulates `CTID` and `HeapTuple` without allocating dynamic memory per tuple. Matches `include/executor/tuptable.h`. |\n| Single Buffer Pin Invariant | **Exact** | `SeqScanNode` holds at most ONE `PinnedPage` at any time, releasing pins when advancing across 8KB page boundaries. |\n| Pipelined Early Termination | **Exact** | `LimitNode` stops pulling immediately upon satisfying the count, avoiding disk I/O on remaining relation pages. |\n| B-Tree Index Scan HOT Traversal | **Exact** | `IndexScanNode` traverses `HEAP_HOT_UPDATED` chains in shared buffers, honoring MVCC snapshots and deduplicating physical CTIDs. |\n| Runtime Profiling (`EXPLAIN ANALYZE`) | **Exact** | `ExecutionEngine::explain` provides plan tree visualization with microseconds runtime and actual row counts, matching PostgreSQL's `EXPLAIN (ANALYZE)`. |\n"},{"path":"24-volcano-relational-joins.md","title":"Item 24: Volcano Relational Joins (Nested-Loop & Hash Join)","md":"# Item 24: Volcano Relational Joins (Nested-Loop & Hash Join)\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/executor.h:20-40,185-265](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/executor.h), [src/executor.cpp:260-445](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/executor.cpp), [src/engine.cpp:515-545,730-795](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/engine.cpp), [tests/test_joins.cpp:1-245](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_joins.cpp)\n\n---\n\n## 1. Multi-Relation Pipelining in the Volcano Model\n\nIn relational database systems, query workloads routinely require combining rows across multiple relations or self-joining relations on matching keys. Building upon the Volcano demand-driven execution engine (Item 23), relational joins must uphold two critical properties:\n\n1. **Demand-Driven Pull Protocol**: Joins must produce qualifying combined tuples on demand via `next(slot)`, yielding execution control to parent nodes (e.g., `LimitNode`, `FilterNode`) without pre-computing the entire join product into memory.\n2. **Standardized Currency Compatibility**: Operators must communicate through the standardized `TupleTableSlot`, cleanly representing both unary relation scans and composite join pairs (`outer` + `inner` tuples with their respective `CTID` physical locations).\n\n```mermaid\nflowchart TD\n    subgraph ExecutionPlan[\"Relational Join Plan Tree\"]\n        LIMIT[\"LimitNode (LIMIT 10)\"]\n        JOIN[\"HashJoinNode / NestedLoopJoinNode\"]\n        OUTER[\"SeqScanNode (Outer Relation 'a')\"]\n        INNER[\"SeqScanNode (Inner Relation 'b')\"]\n    end\n\n    LIMIT -->|next slot| JOIN\n    JOIN -->|pull outer| OUTER\n    JOIN -->|probe / rewind| INNER\n```\n\n---\n\n## 2. Join Algorithms & Complexity Guarantees\n\n```\n+---------------------+-------------------+---------------------+-------------------------+\n| Join Operator       | Time Complexity   | Space Complexity    | Supported Predicates    |\n+---------------------+-------------------+---------------------+-------------------------+\n| NestedLoopJoinNode  | O(|R| * |S|)      | O(1) Memory         | Arbitrary Predicates,   |\n|                     |                   |                     | Cross-Joins (Cartesian) |\n+---------------------+-------------------+---------------------+-------------------------+\n| HashJoinNode        | O(|R| + |S|)      | O(|S|) Inner State  | Equi-Joins (=)          |\n+---------------------+-------------------+---------------------+-------------------------+\n```\n\n### 1. Demand-Driven Nested-Loop Join (`NestedLoopJoinNode`)\n- **Outer Streaming & Inner Rewind**: The outer child relation $R$ is read tuple-by-tuple. For each outer tuple, the inner relation $S$ is rewound by invoking `inner_->init()` and scanned to completion.\n- **Zero Memory Overhead**: Operates entirely in $O(1)$ auxiliary RAM. No hash tables or temporary files are allocated.\n- **General Predicate Evaluation**: Supports arbitrary non-equi predicates (e.g., inequalities, ranges) and full Cartesian cross-joins when no join filter is specified.\n\n### 2. Two-Phase Classical In-Memory Hash Join (`HashJoinNode`)\n- **Phase 1: Build Phase (`init()`)**: The inner child relation $S$ is scanned to exhaustion and materialized into an in-memory hash table (`std::unordered_multimap<int32_t, std::pair<CTID, HeapTuple>>`), keyed on the extracted join attribute. The inner scan cursor is closed immediately upon build completion.\n- **Phase 2: Probe Phase (`next()`)**: The outer child relation $R$ is streamed tuple-by-tuple. For each outer tuple, its join key probes the hash table in $O(1)$ amortized time. Matching inner tuples are emitted sequentially.\n- **Multimap Duplicate Handling**: Duplicate keys across the inner relation are supported seamlessly via `unordered_multimap::equal_range()`.\n\n---\n\n## 3. Sequence Diagram: Hash Join Lifecycle & Pipelined Early Termination\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as Query Client\n    participant Limit as LimitNode (LIMIT 2)\n    participant HashJoin as HashJoinNode\n    participant Outer as SeqScanNode (Outer 'a')\n    participant Inner as SeqScanNode (Inner 'b')\n\n    Note over Client,Inner: 1. Build Phase (in init())\n    Client->>Limit: init()\n    Limit->>HashJoin: init()\n    HashJoin->>Inner: init()\n    loop Materialize Inner Hash Table\n        HashJoin->>Inner: next(slot)\n        Inner-->>HashJoin: tuple (price=100)\n    end\n    Inner-->>HashJoin: false (EOF)\n    HashJoin->>Inner: end()\n\n    Note over Client,Inner: 2. Probe Phase (in next())\n    HashJoin->>Outer: init()\n    Client->>Limit: next(slot)\n    Limit->>HashJoin: next(slot)\n    HashJoin->>Outer: next(slot)\n    Outer-->>HashJoin: outer tuple (price=100)\n    Note over HashJoin: Probe hash table for price=100 -> match!\n    HashJoin-->>Limit: composite slot (a.id=1, b.id=1)\n    Limit-->>Client: composite slot (Row 1 of 2)\n\n    Client->>Limit: next(slot)\n    Limit->>HashJoin: next(slot)\n    Note over HashJoin: Yield second match from hash range\n    HashJoin-->>Limit: composite slot (a.id=1, b.id=3)\n    Limit-->>Client: composite slot (Row 2 of 2)\n\n    Note over Client,Inner: 3. Pipelined Early Termination\n    Client->>Limit: next(slot)\n    Note over Limit: Quota reached (2 >= 2) -> immediate EOF!\n    Limit-->>Client: false (EOF)\n    Client->>Limit: end()\n    Limit->>HashJoin: end()\n    HashJoin->>Outer: end()\n```\n\n---\n\n## 4. SQL REPL & EXPLAIN Plan Inspection\n\nThe SQL parser dynamically detects relational joins, routing queries to the appropriate join strategy:\n\n```sql\n-- Nested Loop Join with Join Predicate\nEXPLAIN SELECT * FROM items a JOIN items b ON a.price = b.price;\n\n-- Output:\nQUERY PLAN:\n->  Nested Loop (Join Filter: (a.price = b.price)) (produced_tuples=0)\n    ->  Seq Scan on items (scanned_pages=0, produced_tuples=0)\n    ->  Seq Scan on items (scanned_pages=0, produced_tuples=0)\n\n-- Hash Join with Execution Profiling\nEXPLAIN ANALYZE SELECT * FROM items a HASH JOIN items b ON a.price = b.price;\n\n-- Output:\nQUERY PLAN (ANALYZE: actual time=0.005 ms, rows=9):\n->  Hash Join (Hash Con
