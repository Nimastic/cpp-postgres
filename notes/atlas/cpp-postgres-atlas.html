const DOCS = [{"path":"00-orientation.md","title":"PostgreSQL Storage Engine Architecture & Orientation","md":"# PostgreSQL Storage Engine Architecture & Orientation\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/engine.h:1-85](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/engine.h), [src/engine.cpp:1-250](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/engine.cpp), [CMakeLists.txt:1-150](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/CMakeLists.txt)\n\n---\n\n## 1. Executive Overview\n\n`cpp-postgres` is a production-accurate, zero-external-dependency relational storage engine implemented in C++20. It faithfully reproduces the exact internal disk formats, concurrency mechanisms, memory structures, and crash recovery algorithms utilized by PostgreSQL.\n\nThe architecture is partitioned into strict, decoupled layers:\n\n```mermaid\nflowchart TD\n    subgraph Clients[\"Access Layer (Items 11, 18, 19, 20)\"]\n        CLI[\"CLI REPL\\n(pg_cli.exe)\"]\n        GUI[\"Desktop GUI\\n(pg_gui.exe)\"]\n        HTTP[\"HTTP REST :8080\\n(Approach A)\"]\n        PGW[\"pgwire TCP :5432\\n(Approach C)\"]\n    end\n\n    subgraph EngineCore[\"Engine Coordinator (pg::Engine)\"]\n        TM[\"Transaction Manager\\n(MVCC & Snapshots)\"]\n        EXEC[\"SQL Executor & Parser\"]\n    end\n\n    subgraph Memory[\"RAM Subsystems (Item 8, 12)\"]\n        BPM[\"Shared Buffers (BufferPoolManager)\\n16 Frames · Clock-Sweep Eviction\"]\n    end\n\n    subgraph Storage[\"Disk Subsystems (Items 1-7, 9, 10, 13-17)\"]\n        HEAP[\"Heap Relation (.db)\\n8KB Slotted Pages\"]\n        BTREE[\"Disk B-Tree (.db)\\nRoot/Internal/Leaf\"]\n        WAL[\"Write-Ahead Log (.log)\\nCRC32 · FPI · CLRs\"]\n        CLOG[\"Commit Log (.db)\\n2-bit Bitmap Pages\"]\n        TOAST[\"TOAST Relation (.db)\\n2KB Data Chunks\"]\n    end\n\n    Clients --> EngineCore\n    EngineCore --> Memory\n    Memory <--> HEAP\n    Memory <--> BTREE\n    Memory <--> CLOG\n    Memory <--> TOAST\n    EngineCore --> WAL\n    WAL -.->|REDO / UNDO Recovery| HEAP\n```\n\n---\n\n## 2. Global Subsystem Invariants\n\nThe entire storage engine enforces seven architectural invariants:\n\n1. **8KB Page Uniformity**: All disk structures (Heap, B-Tree, CLOG, TOAST) operate on fixed 8,192-byte page boundaries aligned to the OS block layer (`[include/pg/page.h:12]`).\n2. **Buffer Pool Single Gateway**: Application subsystems never execute direct file I/O; all page accesses pin frames inside `BufferPoolManager` (`[src/heap.cpp:45]`).\n3. **Write-Ahead Logging (WAL)**: A dirty page in RAM is never written to disk until its corresponding WAL log record has been flushed (`page.pd_lsn <= wal.flushed_lsn`) (`[src/wal.cpp:110]`).\n4. **Append-Only MVCC**: Updates never mutate live data in place; they stamp `xmax` on the old tuple version and append a new version with `xmin` (`[src/heap.cpp:88]`).\n5. **Secondary Index Decoupling**: B-Tree secondary indexes map `Key -> CTID` physical addresses without embedding tuple columns or MVCC headers (`[src/btree.cpp:15]`).\n6. **Zero Index-Bloat HOT Updates**: Unindexed column updates residing on the same 8KB page construct line-pointer chains with zero index writes (`[src/heap.cpp:142]`).\n7. **2-Bit CLOG Density**: Transaction commit states are packed into 2-bit bitmaps on disk, scaling to 32,768 transactions per 8KB page (`[src/clog.cpp:30]`).\n\n---\n\n## 3. Subsystem Dependency Matrix\n\n```mermaid\nclassDiagram\n    class Engine {\n        +execute(sql)\n        +begin_transaction()\n        +commit_transaction()\n        +rollback_transaction()\n        +vacuum()\n        +checkpoint()\n        +recover()\n    }\n    class HeapFile {\n        +insert(record, xmin)\n        +update(old_ctid, record, tx_id)\n        +hot_update(old_ctid, record, tx_id)\n        +seq_scan()\n        +get(ctid)\n    }\n    class BufferPoolManager {\n        +fetch_page(page_id)\n        +unpin_page(page_id, is_dirty)\n        +flush_page(page_id)\n        +flush_all()\n    }\n    class WALManager {\n        +log_insert(tx_id, ctid, record)\n        +log_update(tx_id, old_ctid, new_ctid, record)\n        +log_checkpoint()\n        +log_fpi(page_id, page_data)\n        +recover_3phase()\n    }\n    class DiskBTree {\n        +insert_entry(key, ctid)\n        +find_entries(key)\n        +range_scan(min, max)\n    }\n    class CLogManager {\n        +set_status(tx_id, status)\n        +get_status(tx_id)\n    }\n    class ToastManager {\n        +store_toast_payload(toast_id, data)\n        +fetch_toast_payload(toast_id, raw_size)\n    }\n\n    Engine *-- HeapFile\n    Engine *-- BufferPoolManager\n    Engine *-- WALManager\n    Engine *-- DiskBTree\n    Engine *-- CLogManager\n    Engine *-- ToastManager\n    HeapFile --> BufferPoolManager\n    DiskBTree --> BufferPoolManager\n    WALManager --> BufferPoolManager\n```\n"},{"path":"01-pager-and-io.md","title":"Item 1: Pager & 8KB Fixed Page Disk I/O","md":"# Item 1: Pager & 8KB Fixed Page Disk I/O\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/pager.h:1-62](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/pager.h), [src/pager.cpp:1-85](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/pager.cpp), [tests/test_pager.cpp:1-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_pager.cpp)\n\n---\n\n## 1. Architectural Role\n\nThe **Pager** is the lowest-level storage primitive in the database engine. It abstracts the host operating system's filesystem into a linear sequence of fixed-size **8,192-byte (8KB)** disk pages indexed by a 32-bit `page_id_t`.\n\n```mermaid\nflowchart LR\n    subgraph DiskFile[\"Physical Database File (*.db)\"]\n        P0[\"Page 0\\n[0 .. 8191 B]\"]\n        P1[\"Page 1\\n[8192 .. 16383 B]\"]\n        P2[\"Page 2\\n[16384 .. 24575 B]\"]\n        PN[\"Page N\\n[N*8192 .. (N+1)*8192-1 B]\"]\n    end\n\n    subgraph PagerSubsystem[\"Pager (src/pager.cpp)\"]\n        CALC[\"Offset Calculation:\\noffset = page_id * 8192\"]\n        SEEK[\"seekg() / seekp()\"]\n        IO[\"read() / write()\"]\n    end\n\n    CALC --> SEEK --> IO <--> DiskFile\n```\n\n---\n\n## 2. Invariants & Formulas\n\n1. **Exact Page Boundary Alignment**:\n   $$\\text{file\\_offset} = \\text{page\\_id} \\times 8192$$\n   Every disk read and write transfers exactly $8,192\\text{ bytes}$. No partial page I/O is ever permitted.\n2. **Deterministic File Growth**:\n   When `write_page(page_id, ...)` is called on an unallocated `page_id \\ge \\text{num\\_pages()}`, the file automatically grows in discrete 8KB increments padded with zeros (`[src/pager.cpp:52]`).\n3. **C++ Stream Flag Integrity**:\n   Because reading past EOF in `std::fstream` sets `eofbit` and `failbit`, subsequent seek operations silently fail unless `stream.clear()` is invoked prior to any seek or write (`[src/pager.cpp:25]`).\n\n---\n\n## 3. Sequence Diagram: Reading & Writing Pages\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as Subsystem (Heap/BTree/CLOG)\n    participant Pager as Pager (src/pager.cpp)\n    participant OS as OS File System (*.db)\n\n    Note over Client,OS: Reading an 8KB Page\n    Client->>Pager: read_page(page_id, dest_buffer)\n    Pager->>Pager: stream.clear()\n    Pager->>Pager: offset = page_id * 8192\n    Pager->>OS: seekg(offset, ios::beg)\n    Pager->>OS: read(dest_buffer, 8192)\n    Pager-->>Client: void (dest_buffer populated)\n\n    Note over Client,OS: Writing an 8KB Page\n    Client->>Pager: write_page(page_id, src_data)\n    Pager->>Pager: stream.clear()\n    Pager->>Pager: offset = page_id * 8192\n    Pager->>OS: seekp(offset, ios::beg)\n    Pager->>OS: write(src_data, 8192)\n    Pager->>OS: flush() (push to OS disk buffer)\n    Pager-->>Client: void (page persisted)\n```\n"},{"path":"02-slotted-page-architecture.md","title":"Item 2: Slotted Page Architecture","md":"# Item 2: Slotted Page Architecture\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/page.h:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/page.h), [src/page.cpp:1-170](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/page.cpp), [tests/test_page.cpp:1-110](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_page.cpp)\n\n---\n\n## 1. Physical Memory Layout\n\nThe **Slotted Page** architecture solves variable-length record management and in-place defragmentation. Within each 8,192-byte page, memory grows inward from both ends:\n\n```text\n┌────────────────────────────────────────────────────────────────────────────────────────┐\n│ 8192-Byte Slotted Page Physical Memory Layout                                         │\n├───────────────┬──────────────┬──────────────┬──────────────┬─────────────┬─────────────┤\n│ PageHeader    │ Line Pointer │ Line Pointer │ Free Space   │ Tuple Data  │ Tuple Data  │\n│ (18 Bytes)    │ Slot 1 (4B)  │ Slot 2 (4B)  │ (Contiguous) │ Version 2   │ Version 1   │\n│ [0 .. 17]     │ [18 .. 21]   │ [22 .. 25]   │              │             │             │\n└───────────────┴──────────────┴──────────────┴──────────────┴─────────────┴─────────────┘\n0              18             22             pd_lower       pd_upper      8168          8192\n▲                                            ▲              ▲                           ▲\n└─────────── Growing Downward ───────────────┘              └───── Growing Upward ──────┘\n```\n\n---\n\n## 2. Invariants & Mathematical Formulas\n\n1. **Page Header Structure (18 Bytes)**:\n   - `pd_lsn` (8 Bytes): LSN of the last WAL record that modified this page (`[include/pg/page.h:20]`).\n   - `pd_flags` (2 Bytes): Page status flags (e.g. `PD_ALL_VISIBLE = 0x0004`).\n   - `pd_lower` (2 Bytes): Byte offset marking the end of the line pointers array (initially 18).\n   - `pd_upper` (2 Bytes): Byte offset marking the start of the youngest tuple data (initially 8192).\n   - `pd_special` (2 Bytes): Reserved for index-specific metadata (8192 for heap pages).\n   - `pd_prune_xid` (2 Bytes): Oldest unpruned XID.\n\n2. **Line Pointer Bitfield Packing (4 Bytes)**:\n   $$\\text{Line Pointer (uint32\\_t)} = (\\text{offset} \\ \\& \\ \\text{0x7FFF}) \\ | \\ ((\\text{flags} \\ \\& \\ \\text{0x03}) \\ll 15) \\ | \\ ((\\text{length} \\ \\& \\ \\text{0x7FFF}) \\ll 17)$$\n   - `lp_offset` (15 bits): Byte offset to tuple data.\n   - `lp_flags` (2 bits): `00` = `UNUSED`, `01` = `NORMAL` (Live), `10` = `REDIRECT` (HOT chain), `11` = `DEAD`.\n   - `lp_len` (15 bits): Byte length of tuple.\n\n3. **Free Space Allocation Formula**:\n   $$\\text{Free Space Available} = \\text{pd\\_upper} - \\text{pd\\_lower} - 4$$\n   Every tuple insertion requires both tuple payload memory ($\\ge \\text{len}$) and a new 4-byte line pointer in the header array.\n\n---\n\n## 3. Tuple Insertion State Machine\n\n```mermaid\nstateDiagram-v2\n    [*] --> CheckSpace: insert_tuple(data, len)\n    CheckSpace --> Reject: (len + 4) > (pd_upper - pd_lower)\n    CheckSpace --> Allocate: (len + 4) <= (pd_upper - pd_lower)\n    Allocate --> DecrementUpper: pd_upper = pd_upper - len\n    DecrementUpper --> CopyData: memcpy(page_buf + pd_upper, data, len)\n    CopyData --> IncrementLower: slot_id = (pd_lower - 18)/4 + 1\\npd_lower = pd_lower + 4\n    IncrementLower --> WriteLinePointer: line_pointer[slot] = {offset: pd_upper, flags: NORMAL, len: len}\n    WriteLinePointer --> [*]: Return slot_id\n```\n"},{"path":"03-heap-tuples-and-ctid.md","title":"Item 3: Tuples & Heap CTID Physical Addressing","md":"# Item 3: Tuples & Heap CTID Physical Addressing\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/tuple.h:1-90](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/tuple.h), [include/pg/heap.h:1-82](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/heap.h), [src/heap.cpp:1-210](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/heap.cpp), [tests/test_heap.cpp:1-120](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_heap.cpp)\n\n---\n\n## 1. Physical CTID Tuple Addressing\n\nEvery row version in the database is uniquely addressed by its **CTID (Current Tuple ID)**:\n\n$$\\text{CTID} = (\\text{page\\_id}, \\text{slot\\_id})$$\n\n```mermaid\nflowchart TD\n    subgraph HeapRelation[\"HeapFile (.db)\"]\n        subgraph Page0[\"Page 0\"]\n            LP1[\"Slot 1 Line Pointer\"] --> T1[\"Tuple (0, 1)\\n[xmin=1, xmax=0]\"]\n            LP2[\"Slot 2 Line Pointer\"] --> T2[\"Tuple (0, 2)\\n[xmin=2, xmax=0]\"]\n        end\n        subgraph Page1[\"Page 1\"]\n            LP3[\"Slot 1 Line Pointer\"] --> T3[\"Tuple (1, 1)\\n[xmin=3, xmax=0]\"]\n        end\n    end\n\n    CTID_A[\"CTID (0, 1)\"] --> LP1\n    CTID_B[\"CTID (1, 1)\"] --> LP3\n```\n\n---\n\n## 2. Invariants & Binary Layout\n\n1. **TupleHeader Structure (18 Bytes)** (`[include/pg/tuple.h:18]`):\n   - `xmin` (4 Bytes): Transaction ID that inserted this row version.\n   - `xmax` (4 Bytes): Transaction ID that deleted or updated this row version (`0` if currently live).\n   - `t_cid` (2 Bytes): Command ID within the transaction.\n   - `t_ctid` (4 Bytes): Forward pointer to the newest row version (or self-reference `(page, slot)` if newest).\n   - `infomask2` (2 Bytes): Attribute count and HOT flags (`HEAP_KEYS_UPDATED = 0x2000`, `HEAP_HOT_UPDATED = 0x4000`, `HEAP_ONLY_TUPLE = 0x8000`).\n   - `infomask` (2 Bytes): Status flags (`HEAP_HASNULL = 0x0001`, `HEAP_HASEXTERNAL = 0x2000`, `HEAP_XMIN_COMMITTED = 0x0100`).\n\n2. **Physical Tuple Capacity Derivation**:\n   For an 8KB page with 18-byte page header and 24-byte serialized heap tuples (18B header + 6B data `item_id + price`), the maximum row capacity per page is:\n   $$\\text{Max Tuples Per Page} = \\left\\lfloor \\frac{8192 - 18}{24 + 4} \\right\\rfloor = \\left\\lfloor \\frac{8174}{28} \\right\\rfloor = 291 \\text{ tuples}$$\n\n---\n\n## 3. Class Diagram: HeapFile & Pager Relationship\n\n```mermaid\nclassDiagram\n    class HeapFile {\n        -unique_ptr~Pager~ pager_\n        -BufferPoolManager* bpm_\n        +insert(record, xmin) CTID\n        +update(old_ctid, record, tx_id) CTID\n        +delete_tuple(target_ctid, tx_id) bool\n        +get(ctid) optional~HeapTuple~\n        +seq_scan() vector~pair~CTID, HeapTuple~~\n        +num_pages() size_t\n    }\n    class Pager {\n        -fstream file_\n        -size_t num_pages_\n        +read_page(page_id, buffer)\n        +write_page(page_id, buffer)\n    }\n    class Page {\n        -uint8_t* data_\n        +header() PageHeader&\n        +insert_tuple(data, len) slot_id_t\n        +get_tuple_ptr(slot_id, out_len) uint8_t*\n    }\n\n    HeapFile *-- Pager\n    HeapFile ..> Page : instantiates\n```\n"},{"path":"04-mvcc-and-snapshots.md","title":"Item 4: MVCC & Transaction Snapshot Visibility","md":"# Item 4: MVCC & Transaction Snapshot Visibility\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/tx.h:1-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/tx.h), [include/pg/mvcc.h:1-45](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/mvcc.h), [src/tx.cpp:1-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/tx.cpp), [src/mvcc.cpp:1-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/mvcc.cpp), [tests/test_mvcc.cpp:1-135](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_mvcc.cpp)\n\n---\n\n## 1. Multi-Version Concurrency Control (MVCC) Overview\n\nPostgreSQL implements **Snapshot Isolation** using row-version header stamps (`xmin` and `xmax`). Readers never block writers, and writers never block readers.\n\n```mermaid\nflowchart TD\n    subgraph TransactionTimeline[\"Transaction Horizon\"]\n        XMIN[\"xmin (Lowest Active Tx ID)\\nAll Tx < xmin are COMMITTED\"]\n        ACTIVE[\"Active In-Flight Transactions\\n(active_txs set)\"]\n        XMAX[\"xmax (Next Tx ID Counter)\\nAll Tx >= xmax are in the FUTURE\"]\n    end\n\n    V1[\"Tuple A\\n[xmin=5, xmax=0]\"] -->|xmin < Snapshot.xmax & committed| VISIBLE[\"VISIBLE to Reader\"]\n    V2[\"Tuple B\\n[xmin=15, xmax=0]\"] -->|xmin in active_txs or >= xmax| INVISIBLE[\"INVISIBLE to Reader\"]\n```\n\n---\n\n## 2. Invariants & Visibility State Machine\n\nA tuple version is visible to a `Snapshot` if and only if **both** of the following conditions hold (`[src/mvcc.cpp:25]`):\n\n1. **Creation Visibility (`xmin`)**:\n   - `xmin == snapshot.current_tx_id` (created by current tx), OR\n   - (`xmin < snapshot.xmax` AND `xmin` is NOT in `snapshot.active_txs` AND `status(xmin) == COMMITTED`).\n2. **Deletion Invisibility (`xmax`)**:\n   - `xmax == 0` (never deleted/updated), OR\n   - `xmax == snapshot.current_tx_id` AND NOT yet committed, OR\n   - `xmax >= snapshot.xmax` (deleted in future), OR\n   - `xmax` IS in `snapshot.active_txs` (deleted by active concurrent tx), OR\n   - `status(xmax) == ABORTED` (deletion was rolled back).\n\n---\n\n## 3. Sequence Diagram: Concurrent MVCC Reads and Writes\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Tx1 as Tx 1 (Writer)\n    participant Tx2 as Tx 2 (Reader)\n    participant Heap as Heap Storage\n    participant TM as Transaction Manager\n\n    Tx1->>TM: begin_transaction() -> TxID: 10\n    Tx2->>TM: begin_transaction() -> TxID: 11\n    Tx2->>TM: take_snapshot(11) -> {xmin: 10, xmax: 12, active: [10]}\n\n    Tx1->>Heap: insert(Item 100, xmin=10) -> Stored at (0, 1)\n    Tx2->>Heap: seq_scan(snapshot_11)\n    Note over Tx2,Heap: Reads (0, 1) [xmin=10].<br/>10 is in active_txs -> INVISIBLE!\n    Heap-->>Tx2: 0 rows returned\n\n    Tx1->>TM: commit(10)\n    Note over Tx1,TM: Tx 1 marked COMMITTED in CLOG.\n\n    participant Tx3 as Tx 3 (New Reader)\n    Tx3->>TM: take_snapshot(12) -> {xmin: 12, xmax: 13, active: []}\n    Tx3->>Heap: seq_scan(snapshot_12)\n    Note over Tx3,Heap: Reads (0, 1) [xmin=10].<br/>10 < xmin (12) & COMMITTED -> VISIBLE!\n    Heap-->>Tx3: 1 row returned (Item 100)\n```\n"},{"path":"05-vacuum-engine.md","title":"Item 5: VACUUM Engine & In-Place Page Defragmentation","md":"# Item 5: VACUUM Engine & In-Place Page Defragmentation\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/vacuum.h:1-35](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/vacuum.h), [src/vacuum.cpp:1-120](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/vacuum.cpp), [tests/test_vacuum.cpp:1-115](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_vacuum.cpp)\n\n---\n\n## 1. Dead Tuple Reclamation Mechanics\n\nWhen rows are updated or deleted under MVCC, old tuple versions become **dead** once their `xmax` falls below the oldest active transaction in the entire cluster:\n\n$$\\text{Dead Condition: } \\text{xmax} > 0 \\ \\land \\ \\text{status}(\\text{xmax}) == \\text{COMMITTED} \\ \\land \\ \\text{xmax} < \\text{oldest\\_active\\_xmin}$$\n\n```mermaid\nflowchart TD\n    subgraph SlottedPageDefrag[\"In-Place Page Compaction\"]\n        BEFORE[\"Before VACUUM:\\n[Slot 1: LIVE @ 8168]\\n[Slot 2: DEAD @ 8144]\\n[Slot 3: LIVE @ 8120]\\npd_upper = 8120 (Fragmented)\"]\n        PROCESS[\"VACUUM Pass:\\n1. Mark Slot 2 UNUSED (offset=0, len=0)\\n2. Shift Slot 3 data up to 8144\\n3. Update Slot 3 LinePointer offset\\n4. Set pd_upper = 8144 (Reclaimed 24B)\"]\n        AFTER[\"After VACUUM:\\n[Slot 1: LIVE @ 8168]\\n[Slot 2: UNUSED]\\n[Slot 3: LIVE @ 8144]\\npd_upper = 8144 (Contiguous Free Space)\"]\n    end\n\n    BEFORE --> PROCESS --> AFTER\n```\n\n---\n\n## 2. Invariants & CTID Stability\n\n1. **CTID Slot Stability**: VACUUM never shifts or renumbers existing `slot_id` line pointer indexes. Slot 3 remains `(page, 3)`, guaranteeing that foreign references and secondary index entries are not corrupted (`[src/page.cpp:125]`).\n2. **Compact Contiguous Allocation**: Surviving tuple payloads are slid upward towards the end of the 8KB page (`PAGE_SIZE = 8192`), coalescing all freed memory into a single contiguous block between `pd_lower` and `pd_upper`.\n\n---\n\n## 3. Sequence Diagram: Vacuum Page Lifecycle\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Admin as Maintenance Coordinator\n    participant Vac as VacuumEngine (src/vacuum.cpp)\n    participant TM as TransactionManager\n    participant Heap as Heap Storage\n    participant Page as Slotted Page (RAM)\n\n    Admin->>Vac: vacuum(heap, tm)\n    Vac->>TM: oldest_active_xmin() -> Cutoff XID (e.g. 50)\n    loop For each page_id in 0 .. num_pages-1\n        Vac->>Heap: read_page(page_id, page_buf)\n        loop For each slot_id in 1 .. num_slots\n            Vac->>Page: check tuple header (xmin, xmax)\n            alt xmax != 0 and xmax < cutoff and committed\n                Vac->>Page: mark line_pointer[slot_id] = UNUSED\n            end\n        end\n        Vac->>Page: compact_and_defragment()\n        Vac->>Heap: write_page(page_id, page_buf)\n    end\n    Vac-->>Admin: VacuumResult {reclaimed_tuples, reclaimed_bytes, pages_vacuumed}\n```\n"},{"path":"06-secondary-btree-index.md","title":"Item 6: Secondary B-Tree Index Subsystem","md":"# Item 6: Secondary B-Tree Index Subsystem\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/btree.h:1-69](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/btree.h), [src/btree.cpp:1-85](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/btree.cpp), [tests/test_index.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_index.cpp)\n\n---\n\n## 1. Index Decoupling & Multi-Version Addressing\n\nIn PostgreSQL, secondary indexes store **only** $(\\text{Key} \\rightarrow \\text{CTID})$ mappings.\nThe index does **not** store row columns, null bitmaps, or MVCC transaction headers (`xmin`/`xmax`).\n\n```mermaid\nflowchart LR\n    subgraph SecondaryIndex[\"B-Tree Index Map\"]\n        K100[\"Key 100\"] --> CTID_1[\"CTID (0, 1)\"]\n        K100 --> CTID_2[\"CTID (0, 2)\"]\n        K200[\"Key 200\"] --> CTID_3[\"CTID (0, 3)\"]\n    end\n\n    subgraph HeapTable[\"Physical Heap Pages\"]\n        H1[\"Tuple (0, 1)\\n[xmin=1, xmax=2] (DEAD)\"]\n        H2[\"Tuple (0, 2)\\n[xmin=2, xmax=0] (LIVE)\"]\n        H3[\"Tuple (0, 3)\\n[xmin=3, xmax=0] (LIVE)\"]\n    end\n\n    CTID_1 --> H1\n    CTID_2 --> H2\n    CTID_3 --> H3\n```\n\n---\n\n## 2. Invariants & Lookup Pipeline\n\n1. **Multi-Version Key Duplication**: Because updates create new row versions at new physical CTIDs without deleting the old version, a single index key can map to multiple candidate CTIDs simultaneously (`[src/btree.cpp:22]`).\n2. **Mandatory Heap MVCC Dereference**: The index lookup returns candidate CTIDs. The database must dereference each CTID against the physical Heap and evaluate snapshot visibility rules before returning tuples to the query caller (`[src/engine.cpp:140]`).\n\n---\n\n## 3. Sequence Diagram: Index Point Scan\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant SQL as SQL Query Engine\n    participant Idx as B-Tree Index (src/btree.cpp)\n    participant Heap as Heap Storage (src/heap.cpp)\n    participant MVCC as MVCC Evaluator (src/mvcc.cpp)\n\n    SQL->>Idx: find_entries(item_id = 100)\n    Idx-->>SQL: [ (0, 1), (0, 2) ] (Candidate CTIDs)\n\n    loop For each candidate CTID\n        SQL->>Heap: get(CTID)\n        Heap-->>SQL: HeapTuple {header, data}\n        SQL->>MVCC: is_visible(tuple.header, snapshot)\n        alt Visible\n            MVCC-->>SQL: true (Return tuple to client)\n        else Invisible (Dead or Future version)\n            MVCC-->>SQL: false (Skip candidate)\n        end\n    end\n```\n"},{"path":"07-heap-only-tuples.md","title":"Item 7: Heap-Only Tuples (HOT) & Update Chains","md":"# Item 7: Heap-Only Tuples (HOT) & Update Chains\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/heap.h:40-50](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/heap.h), [src/heap.cpp:115-180](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/heap.cpp), [tests/test_hot.cpp:1-130](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_hot.cpp)\n\n---\n\n## 1. The Write-Amplification Problem & HOT Solution\n\nIn standard MVCC, updating an unindexed column (e.g. `UPDATE items SET price = 20 WHERE item_id = 100;`) forces a new entry into every secondary index on the table, leading to severe **index bloat**.\n\n**Heap-Only Tuples (HOT)** eliminates all secondary index writes when:\n1. No indexed columns are modified by the update.\n2. The new tuple version fits onto the **same 8KB page** as the old version.\n\n```mermaid\nflowchart LR\n    subgraph BTree[\"Secondary Index (Root Entry)\"]\n        IDX[\"Key 100\\nPoints to -> (Page 0, Slot 1) ONLY\"]\n    end\n\n    subgraph Page0[\"Same 8KB Slotted Page (Page 0)\"]\n        LP1[\"Slot 1 Line Pointer\\nFlags: NORMAL\"] --> T1[\"Tuple (0, 1)\\n[infomask: HEAP_HOT_UPDATED]\\n[t_ctid -> (0, 2)]\"]\n        LP2[\"Slot 2 Line Pointer\\nFlags: NORMAL\"] --> T2[\"Tuple (0, 2)\\n[infomask: HEAP_ONLY_TUPLE]\\n[price: $20, t_ctid -> (0, 2)]\"]\n    end\n\n    IDX --> LP1\n    T1 -.->|HOT Chain Pointer| LP2\n```\n\n---\n\n## 2. Invariants & Infomask Flags\n\n1. **`HEAP_HOT_UPDATED` (`0x4000`)**: Stamped on the old tuple version's `infomask2`. Indicates that the next version in the update chain resides on this exact same page (`[include/pg/tuple.h:42]`).\n2. **`HEAP_ONLY_TUPLE` (`0x8000`)**: Stamped on the newly created tuple version's `infomask2`. Tells the engine that no index pointer references this tuple directly; it can only be reached by following the HOT chain starting at the root index pointer (`[include/pg/tuple.h:43]`).\n3. **`ItemFlags::REDIRECT`**: When VACUUM or pruning removes the dead root tuple data, it changes Slot 1's line pointer into a redirect pointer (`lp_flags = REDIRECT, lp_offset = slot_2`), preserving index stability with zero tuple bytes.\n\n---\n\n## 3. Sequence Diagram: HOT Chain Traversal\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as Query Engine\n    participant BTree as B-Tree Index\n    participant Page as Page 0 (Shared Buffers)\n\n    Client->>BTree: find_entries(100) -> Root CTID: (0, 1)\n    Client->>Page: fetch_tuple((0, 1))\n    Page-->>Client: Tuple 1 [xmin=1, xmax=2, flags: HEAP_HOT_UPDATED, t_ctid: (0, 2)]\n    Note over Client: Tuple 1 is DEAD under current snapshot.<br/>Has HEAP_HOT_UPDATED -> Follow t_ctid!\n    Client->>Page: fetch_tuple((0, 2))\n    Page-->>Client: Tuple 2 [xmin=2, xmax=0, flags: HEAP_ONLY_TUPLE, price: $20]\n    Note over Client: Tuple 2 is LIVE -> Return price $20!\n```\n"},{"path":"08-shared-buffers-and-clock-sweep.md","title":"Item 8: Shared Buffers & Clock-Sweep Replacement","md":"# Item 8: Shared Buffers & Clock-Sweep Replacement\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/buffer_pool.h:1-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/buffer_pool.h), [src/buffer_pool.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/buffer_pool.cpp), [tests/test_buffer_pool.cpp:1-120](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_buffer_pool.cpp)\n\n---\n\n## 1. Buffer Pool Manager (Shared Buffers) Architecture\n\n`BufferPoolManager` maintains a fixed pool of **16 in-memory frames** (each exactly 8,192 bytes) acting as an LRU-approximation cache between the execution engine and physical disk files.\n\n```mermaid\nflowchart TD\n    subgraph RAM[\"RAM: Buffer Pool Manager (16 Frames)\"]\n        F0[\"Frame 0\\n[Page 0, pin=1, dirty=1, use=3]\"]\n        F1[\"Frame 1\\n[Page 5, pin=0, dirty=0, use=0]\"]\n        F2[\"Frame 2\\n[Page 2, pin=0, dirty=1, use=2]\"]\n        FN[\"Frame 15\\n[Page 9, pin=2, dirty=0, use=1]\"]\n    end\n\n    subgraph ClockSweep[\"PostgreSQL Clock-Sweep Hand\"]\n        HAND[\"Clock Hand (frame_id)\"] -->|Checks pin & usage| F1\n    end\n\n    subgraph Disk[\"Physical Disk File\"]\n        DISK_P[\"Heap / B-Tree Pages (.db)\"]\n    end\n\n    F1 -->|If dirty, flush before reuse| DISK_P\n```\n\n---\n\n## 2. Invariants & Clock-Sweep State Machine\n\n1. **Pin Count Protection (`pin_count > 0`)**: Any frame currently pinned by an active query worker is immediately skipped by the clock-sweep hand; it can **never** be evicted while in use (`[src/buffer_pool.cpp:85]`).\n2. **Second-Chance Algorithm (`usage_count`)**:\n   - If `pin_count == 0` and `usage_count > 0`, the clock hand decrements `usage_count--` and advances to the next frame.\n   - If `pin_count == 0` and `usage_count == 0`, the frame is selected as the eviction victim.\n3. **Dirty Writeback Before Eviction**: If the victim frame has `is_dirty == true`, it is written to disk via `Pager::write_page()` before being repurposed for the new page.\n\n---\n\n## 3. Sequence Diagram: Page Fetch & Eviction Lifecycle\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Subsystem as Engine / Heap / Index\n    participant BPM as BufferPoolManager (src/buffer_pool.cpp)\n    participant Disk as Physical Disk (Pager)\n\n    Subsystem->>BPM: fetch_page(page_id = 42)\n    alt Page 42 already resident in RAM (Cache Hit)\n        BPM->>BPM: frame.pin_count++<br/>frame.usage_count++\n        BPM-->>Subsystem: uint8_t* (Memory pointer to 8KB frame)\n    else Cache Miss (All 16 frames occupied)\n        loop Clock-Sweep Eviction Search\n            BPM->>BPM: Check frame at clock_hand_\n            alt pin_count > 0\n                BPM->>BPM: Skip frame (in use)\n            else pin_count == 0 and usage_count > 0\n                BPM->>BPM: usage_count-- (Second chance granted)\n            else pin_count == 0 and usage_count == 0\n                BPM->>BPM: VICTIM IDENTIFIED!\n            end\n            BPM->>BPM: clock_hand_ = (clock_hand_ + 1) % 16\n        end\n        alt Victim frame is dirty\n            BPM->>Disk: write_page(old_page_id, frame.data)\n        end\n        BPM->>Disk: read_page(42, frame.data)\n        BPM->>BPM: Update page_table_[42] = victim_frame<br/>frame.pin_count = 1<br/>frame.usage_count = 1\n        BPM-->>Subsystem: uint8_t* (Pointer to frame)\n    end\n```\n"},{"path":"09-write-ahead-logging.md","title":"Item 9: Write-Ahead Logging (WAL) & REDO Durability","md":"# Item 9: Write-Ahead Logging (WAL) & REDO Durability\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/wal.h:1-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/wal.h), [src/wal.cpp:1-180](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/wal.cpp), [tests/test_wal.cpp:1-135](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_wal.cpp)\n\n---\n\n## 1. Write-Ahead Logging (WAL) Architecture\n\nTo guarantee **ACID Durability** and high write throughput, PostgreSQL converts random 8KB page writes into sequential, append-only log records in the Write-Ahead Log (`*.log`).\n\n```mermaid\nflowchart LR\n    subgraph TransactionWorker[\"Transaction Commit Flow\"]\n        DML[\"1. DML Execution\\n(Mutates RAM Buffer Frame)\"]\n        LOG[\"2. Append WAL Record\\n[LSN, Type, XID, Data, CRC32]\"]\n        FLUSH[\"3. Flush WAL to Disk (fsync)\"]\n        COMMIT[\"4. Commit Complete to Client\"]\n        DIRTY[\"5. Dirty Page Flush\\n(Delayed / Checkpoint)\"]\n    end\n\n    DML --> LOG --> FLUSH --> COMMIT\n    FLUSH -.->|Must precede| DIRTY\n```\n\n---\n\n## 2. Invariants & Record Binary Layout\n\n1. **The WAL Invariant**:\n   $$\\text{page.pd\\_lsn} \\le \\text{wal.flushed\\_lsn}$$\n   A dirty page in RAM is never written to disk before all WAL records up to the page's `pd_lsn` have been flushed to disk (`[src/wal.cpp:110]`).\n2. **Log Record Structure (Header + Payload + CRC32)**:\n   - `lsn` (8 Bytes): Monotonically increasing Log Sequence Number.\n   - `prev_lsn` (8 Bytes): Backward pointer for UNDO / transaction rollback chains.\n   - `tx_id` (4 Bytes): Transaction ID.\n   - `type` (1 Byte): `1`=INSERT, `2`=UPDATE, `3`=COMMIT, `4`=ABORT, `5`=CHECKPOINT, `6`=FPI, `7`=CLR.\n   - `page_id` (4 Bytes), `slot_id` (2 Bytes).\n   - `payload_len` (2 Bytes) + `payload` data.\n   - `crc32` (4 Bytes): IEEE 802.3 polynomial checksum verifying data integrity against partial writes and disk corruptions.\n\n---\n\n## 3. Sequence Diagram: REDO Crash Recovery Pass\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Engine as Database Engine (Startup)\n    participant WAL as WALManager (src/wal.cpp)\n    participant Heap as Heap Storage (RAM & Disk)\n\n    Engine->>WAL: recover(heap)\n    Note over WAL: Scan log file from byte 0 to EOF\n    loop For each WAL record in log\n        WAL->>WAL: verify_crc32(record)\n        alt CRC32 Mismatch\n            Note over WAL: Corrupted record / torn tail -> Stop scan!\n        else CRC32 Valid\n            alt Record is COMMIT / ABORT\n                WAL->>WAL: Track committed_txs set\n            else Record is INSERT / UPDATE\n                WAL->>WAL: Add to redo_records list\n            end\n        end\n    end\n    loop For each committed record in redo_records\n        WAL->>Heap: replay_record(record)\n        Note over Heap: Reapplies physical insert/update.<br/>Updates page.pd_lsn = record.lsn.\n    end\n    WAL-->>Engine: Replay complete (Survives power failure!)\n```\n"},{"path":"10-toast-oversized-attributes.md","title":"Item 10: TOAST Oversized-Attribute Storage","md":"# Item 10: TOAST Oversized-Attribute Storage\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/toast.h:1-65](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/toast.h), [src/toast.cpp:1-120](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/toast.cpp), [tests/test_toast.cpp:1-115](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_toast.cpp)\n\n---\n\n## 1. The TOAST Architecture\n\n**TOAST (The Oversized-Attribute Storage Technique)** prevents large text, JSON, and binary attributes from degrading the row density of 8KB slotted heap pages.\n\nWhen an attribute payload exceeds **2,048 bytes (2KB)**, the storage engine slices the payload into discrete 2,048-byte chunks stored in a dedicated auxiliary TOAST relation, replacing the inline data with a compact **18-byte `ToastPointer`**.\n\n```mermaid\nflowchart LR\n    subgraph MainHeap[\"Main Heap Page (8KB)\"]\n        TUPLE[\"Heap Tuple\\n[item_id: 100, price: $10]\\n[ToastPointer: 18 Bytes]\"]\n    end\n\n    subgraph ToastRelation[\"Auxiliary TOAST Relation (*_toast.db)\"]\n        C0[\"Chunk 0 (seq=0, 2048 B)\\n[toast_id=1]\"]\n        C1[\"Chunk 1 (seq=1, 2048 B)\\n[toast_id=1]\"]\n        C2[\"Chunk 2 (seq=2, 1800 B)\\n[toast_id=1]\"]\n    end\n\n    TUPLE -.->|ToastPointer {id: 1, size: 5896, chunks: 3}| C0\n    C0 --- C1 --- C2\n```\n\n---\n\n## 2. Invariants & Binary Layout\n\n1. **ToastPointer Structure (18 Bytes)** (`[include/pg/toast.h:18]`):\n   - `toast_id` (8 Bytes): Unique 64-bit identifier linking to the auxiliary relation.\n   - `raw_size` (4 Bytes): Original uncompressed byte size of the attribute.\n   - `chunk_count` (2 Bytes): Total number of auxiliary chunks ($\\lceil \\text{raw\\_size} / 2048 \\rceil$).\n   - `ext_flags` (4 Bytes): Compression and storage strategy flags.\n2. **ToastChunk Structure (2,066 Bytes per chunk)**:\n   - `toast_id` (8 Bytes), `chunk_seq` (4 Bytes), `chunk_size` (2 Bytes).\n   - `chunk_data` (2,048 Bytes).\n3. **Sequential Scan Preservation**: Sequential scans over normal columns (e.g. `SELECT price FROM items;`) never read or load TOAST pages into shared buffers, avoiding massive I/O pollution (`[src/toast.cpp:65]`).\n\n---\n\n## 3. Sequence Diagram: Storing and Reassembling TOAST Data\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant SQL as SQL Executor\n    participant Heap as HeapFile (src/heap.cpp)\n    participant Toast as ToastManager (src/toast.cpp)\n    participant ToastDisk as Toast Relation (*_toast.db)\n\n    Note over SQL,ToastDisk: Insertion of 10,000 Byte Document\n    SQL->>Heap: insert_with_doc(id=200, price=20, doc=10KB)\n    Heap->>Toast: store_toast_payload(toast_id=1, data=10KB)\n    loop For each 2048-byte chunk (5 chunks total)\n        Toast->>ToastDisk: write_chunk(toast_id=1, seq_num=i, chunk_data)\n    end\n    Toast-->>Heap: ToastPointer {toast_id: 1, raw_size: 10000, chunk_count: 5}\n    Heap->>Heap: Store 18-byte ToastPointer inline inside HeapTuple\n    Heap-->>SQL: CTID (0, 2)\n\n    Note over SQL,ToastDisk: Selection / Reassembly of Document\n    SQL->>Heap: select_doc_by_id(200)\n    Heap->>Heap: Extract ToastPointer from tuple\n    Heap->>Toast: fetch_toast_payload(toast_id=1, raw_size=10000)\n    loop For chunk_seq in 0 .. 4\n        Toast->>ToastDisk: read_chunk(toast_id=1, seq=chunk_seq)\n        Toast->>Toast: Append 2048 bytes to result_buffer\n    end\n    Toast-->>Heap: std::string (Full 10,000-byte document reassembled)\n    Heap-->>SQL: Display document\n```\n"},{"path":"11-sql-repl-and-engine.md","title":"Item 11: SQL REPL CLI & End-to-End Engine Capstone","md":"# Item 11: SQL REPL CLI & End-to-End Engine Capstone\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/engine.h:1-85](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/engine.h), [src/engine.cpp:1-250](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/engine.cpp), [src/main.cpp:1-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/main.cpp), [tests/test_repl.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_repl.cpp)\n\n---\n\n## 1. Engine Coordination Architecture\n\nThe `pg::Engine` class provides a unified facade coordinating transactions, memory buffers, slotted heap tables, secondary indexes, WAL logging, and TOAST auxiliary relations.\n\n```mermaid\nflowchart TD\n    subgraph Frontend[\"Frontend Client Interface\"]\n        REPL[\"pg_cli.exe (Terminal REPL)\"]\n        SQL_STR[\"SQL String Input:\\ne.g. 'INSERT INTO items VALUES (100, 10);'\"]\n    end\n\n    subgraph EngineCoord[\"Engine (src/engine.cpp)\"]\n        PARSE[\"Lexer / Command Dispatcher\"]\n        TX_AUTO[\"Auto-Transaction Wrapper\\n(ensure_transaction)\"]\n    end\n\n    subgraph Subsystems[\"Coordinated Subsystems\"]\n        TM[\"TransactionManager\"]\n        BPM[\"BufferPoolManager\"]\n        HEAP[\"HeapFile\"]\n        IDX[\"BTreeIndex\"]\n        WAL[\"WALManager\"]\n    end\n\n    REPL --> SQL_STR --> PARSE --> TX_AUTO\n    TX_AUTO --> TM\n    TX_AUTO --> BPM\n    TX_AUTO --> HEAP\n    TX_AUTO --> IDX\n    TX_AUTO --> WAL\n```\n\n---\n\n## 2. Invariants & Execution Rules\n\n1. **Auto-Transaction Invariant**: Every standalone DML statement executed outside of an explicit `BEGIN ... COMMIT` block automatically receives an implicit transaction ID, snapshot, and immediate WAL commit flush (`[src/engine.cpp:38]`).\n2. **Tabular ASCII Formatting**: Query outputs render PostgreSQL-standard tabular ASCII grids displaying `item_id`, `price`, `xmin`, `xmax`, and physical `CTID`.\n3. **Physical Diagnostic Commands**:\n   - `DUMP PAGE <id>;`: Outputs exact byte offsets, `pd_lower`, `pd_upper`, line pointer flag states, and hex dumps.\n   - `STATUS;`: Outputs active buffer pool residency, cache hit rates, WAL flushed LSN, and transaction horizons.\n\n---\n\n## 3. Sequence Diagram: End-to-End Insert Pipeline\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant CLI as CLI REPL (pg_cli.exe)\n    participant Eng as Engine (src/engine.cpp)\n    participant TM as TransactionManager\n    participant WAL as WALManager\n    participant Heap as HeapFile\n    participant BPM as BufferPoolManager\n    participant Idx as BTreeIndex\n\n    CLI->>Eng: execute(\"INSERT INTO items VALUES (100, 10);\")\n    Eng->>TM: begin_transaction() -> TxID: 1\n    Eng->>Heap: insert(Item {100, $10}, xmin=1)\n    Heap->>BPM: fetch_page(0)\n    Heap->>Heap: insert_tuple() -> Landed at CTID (0, 1)\n    Heap->>BPM: unpin_page(0, is_dirty=true)\n    Eng->>WAL: log_insert(tx_id=1, ctid=(0, 1), Item {100, 10})\n    Eng->>Idx: insert_entry(key=100, ctid=(0, 1))\n    Eng->>WAL: log_commit(tx_id=1) -> Flushes WAL to disk\n    Eng->>TM: commit(tx_id=1)\n    Eng-->>CLI: \"[Tx 1] INSERT: Landed at CTID (0, 1)... Transaction committed.\"\n```\n"},{"path":"12-buffer-pool-gateway.md","title":"Item 12: Buffer Pool Single Gateway Invariant","md":"# Item 12: Buffer Pool Single Gateway Invariant\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/heap.h:65-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/heap.h), [src/heap.cpp:25-65](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/heap.cpp), [tests/test_buffer_integration.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_buffer_integration.cpp)\n\n---\n\n## 1. The Single Gateway Principle\n\nIn a production database engine, **no subsystem is ever permitted to bypass shared buffers**.\nItem 12 eliminates all direct `Pager::read_page()` and `Pager::write_page()` calls from `HeapFile` and `Engine`.\n\n```mermaid\nflowchart TD\n    subgraph ExecutionSubsystems[\"Execution Subsystems\"]\n        HEAP[\"HeapFile (CRUD / Scans)\"]\n        VAC[\"Vacuum Engine\"]\n        REPL[\"SQL Execution / Page Dumps\"]\n    end\n\n    subgraph Gateway[\"Buffer Pool Gateway (BufferPoolManager)\"]\n        PIN[\"fetch_page(page_id) -> Pin Frame\"]\n        UNPIN[\"unpin_page(page_id, is_dirty) -> Release Frame\"]\n        FLUSH[\"flush_page(page_id) / flush_all()\"]\n    end\n\n    subgraph PhysicalStorage[\"Physical Disk Files\"]\n        PAGER[\"Pager (OS File System *.db)\"]\n    end\n\n    HEAP -->|ONLY through BPM| PIN\n    VAC -->|ONLY through BPM| PIN\n    REPL -->|ONLY through BPM| PIN\n    PIN --- UNPIN\n    UNPIN --> FLUSH\n    FLUSH --> PAGER\n```\n\n---\n\n## 2. Invariants & Pin/Unpin Lifecycle State Machine\n\n1. **Mandatory Symmetrical Unpinning**: Every `fetch_page()` call **must** have an exactly matching `unpin_page()` invocation in the same call stack (`[src/heap.cpp:55]`).\n2. **Dirty Flag Propagation**: If any tuple bytes, line pointers, or page header offsets are modified in RAM, `unpin_page(page_id, is_dirty=true)` must be passed to ensure the buffer pool schedules disk writeback.\n\n```mermaid\nstateDiagram-v2\n    [*] --> Unloaded: Page on Disk\n    Unloaded --> PinnedClean: fetch_page(page_id) (Read from Disk)\n    PinnedClean --> PinnedDirty: In-Memory Modification (Insert/Update)\n    PinnedClean --> UnpinnedClean: unpin_page(page_id, is_dirty=false)\n    PinnedDirty --> UnpinnedDirty: unpin_page(page_id, is_dirty=true)\n    UnpinnedClean --> PinnedClean: fetch_page(page_id) (RAM Cache Hit)\n    UnpinnedDirty --> PinnedDirty: fetch_page(page_id) (RAM Cache Hit)\n    UnpinnedDirty --> UnpinnedClean: Eviction / Flush (Write to Disk)\n    UnpinnedClean --> Unloaded: Frame Evicted by Clock-Sweep\n```\n"},{"path":"13-clog-commit-status-bitmaps.md","title":"Item 13: CLOG Commit Status 2-Bit Bitmap Pages","md":"# Item 13: CLOG Commit Status 2-Bit Bitmap Pages\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/clog.h:1-55](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/clog.h), [src/clog.cpp:1-110](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/clog.cpp), [tests/test_clog.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_clog.cpp)\n\n---\n\n## 1. The Commit Log (CLOG) Architecture\n\nPostgreSQL avoids in-place tuple updates upon transaction commit by persisting transaction states into dedicated 8KB **CLOG (Commit Log)** bitmap pages.\n\nEach transaction is encoded using exactly **2 bits**:\n\n$$\\text{00} = \\text{IN\\_PROGRESS} \\qquad \\text{01} = \\text{COMMITTED} \\qquad \\text{10} = \\text{ABORTED} \\qquad \\text{11} = \\text{SUB\\_COMMITTED}$$\n\n```mermaid\nflowchart TD\n    subgraph CLOGBitPacking[\"8KB CLOG Page (32,768 Transactions)\"]\n        BYTE0[\"Byte 0: [Tx3 (bits 7-6) | Tx2 (bits 5-4) | Tx1 (bits 3-2) | Tx0 (bits 1-0)]\"]\n        BYTE1[\"Byte 1: [Tx7 (bits 7-6) | Tx6 (bits 5-4) | Tx5 (bits 3-2) | Tx4 (bits 1-0)]\"]\n        BYTEN[\"Byte 8191: [Tx32767 .. Tx32764]\"]\n    end\n\n    XID[\"Transaction ID: 5\"] --> CALC[\"Page: 5 / 32768 = 0\\nByte: (5 % 32768) / 4 = 1\\nShift: (5 % 4) * 2 = 2 bits\"]\n    CALC --> BYTE1\n```\n\n---\n\n## 2. Invariants & Mathematical Mapping Formulas\n\n1. **Transaction Density Derivation**:\n   $$\\text{Transactions Per Page} = 8192 \\text{ bytes} \\times 4 \\text{ tx/byte} = 32,768 \\text{ transactions}$$\n2. **Exact Bit Offset Formula**:\n   $$\\text{clog\\_page\\_id} = \\lfloor \\text{tx\\_id} / 32768 \\rfloor$$\n   $$\\text{byte\\_offset} = \\lfloor (\\text{tx\\_id} \\pmod{32768}) / 4 \\rfloor$$\n   $$\\text{bit\\_shift} = (\\text{tx\\_id} \\pmod 4) \\times 2$$\n3. **Instant Visibility on Restart**: CLOG pages are flushed on commit and loaded on startup, enabling instantaneous MVCC snapshot visibility checks without requiring full WAL log replay (`[src/clog.cpp:45]`).\n\n---\n\n## 3. Sequence Diagram: CLOG Commit and Status Lookup\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant TM as TransactionManager (src/tx.cpp)\n    participant CLOG as CLogManager (src/clog.cpp)\n    participant BPM as BufferPoolManager (Shared Buffers)\n\n    Note over TM,BPM: Committing Transaction 5\n    TM->>CLOG: set_status(tx_id=5, COMMITTED)\n    CLOG->>CLOG: page=0, byte=1, shift=2\n    CLOG->>BPM: fetch_page(clog_page_0)\n    CLOG->>CLOG: byte_val = (byte_val & ~(0x03 << 2)) | (0x01 << 2)\n    CLOG->>BPM: unpin_page(clog_page_0, is_dirty=true)\n\n    Note over TM,BPM: Querying Transaction Status\n    TM->>CLOG: get_status(tx_id=5)\n    CLOG->>BPM: fetch_page(clog_page_0)\n    CLOG->>CLOG: status = (byte_val >> 2) & 0x03 -> 0x01 (COMMITTED)\n    CLOG->>BPM: unpin_page(clog_page_0, is_dirty=false)\n    CLOG-->>TM: TransactionStatus::COMMITTED\n```\n"},{"path":"14-disk-resident-btree.md","title":"Item 14: On-Disk B-Tree Index with Dynamic Node Splits","md":"# Item 14: On-Disk B-Tree Index with Dynamic Node Splits\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/disk_btree.h:1-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/disk_btree.h), [src/disk_btree.cpp:1-240](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/disk_btree.cpp), [tests/test_disk_btree.cpp:1-140](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_disk_btree.cpp)\n\n---\n\n## 1. Disk-Resident B-Tree Architecture\n\n`DiskBTree` stores hierarchical B-Tree nodes on dedicated **8,192-byte disk pages**. Nodes split dynamically when overflowing, promoting median keys up to parent internal nodes.\n\n```mermaid\nflowchart TD\n    subgraph RootNode[\"Root Internal Page (Page 0)\"]\n        R_HDR[\"Header: is_leaf=false, num_keys=1\"]\n        R_E1[\"Key < 500 -> Page 1 | Key >= 500 -> Page 2\"]\n    end\n\n    subgraph LeafLevel[\"Leaf Level (Linked via right_sibling)\"]\n        L1[\"Leaf Page 1\\nKeys: [100..400]\\nright_sibling -> Page 2\"]\n        L2[\"Leaf Page 2\\nKeys: [500..900]\\nright_sibling -> 0 (Tail)\"]\n    end\n\n    R_E1 --> L1\n    R_E1 --> L2\n    L1 -.->|Sibling Scan Pointer| L2\n```\n\n---\n\n## 2. Invariants & Binary Page Formats\n\n1. **B-Tree Page Header (12 Bytes)** (`[include/pg/disk_btree.h:20]`):\n   - `is_leaf` (1 Byte): `true` for leaf pages, `false` for internal routing nodes.\n   - `num_keys` (2 Bytes): Number of active key entries in this node.\n   - `right_sibling` (4 Bytes): `page_id_t` linking to the right sibling page for fast linear range scans.\n   - `parent_page_id` (4 Bytes): `page_id_t` of the parent router node.\n2. **Entry Binary Layouts**:\n   - **Leaf Entry (10 Bytes)**: `key` (4B int32) + `ctid` (4B CTID `{page, slot}`) + `flags` (2B).\n   - **Internal Router Entry (8 Bytes)**: `key` (4B int32) + `child_page_id` (4B `page_id_t`).\n3. **Median Split Algorithm**: When a leaf exceeds capacity ($N \\ge 800$), the median entry at $N/2$ is promoted to the parent node, splitting the keys evenly into a newly allocated 8KB sibling page (`[src/disk_btree.cpp:125]`).\n\n---\n\n## 3. Sequence Diagram: Leaf Split & Key Insertion\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as Engine DML\n    participant Tree as DiskBTree (src/disk_btree.cpp)\n    participant BPM as BufferPoolManager\n    participant P0 as Leaf Page 0 (Full)\n    participant P1 as New Leaf Page 1 (Allocated)\n\n    Client->>Tree: insert_entry(key=550, ctid=(0, 20))\n    Tree->>Tree: Traverse to target Leaf Page 0\n    Tree->>P0: check num_keys >= MAX_KEYS (800)\n    Note over Tree,P1: Node Overflow! Trigger Split Pass.\n    Tree->>BPM: allocate_new_page() -> Page 1\n    Tree->>P0: Copy upper 400 keys to Page 1\n    Tree->>P0: Set right_sibling = Page 1\n    Tree->>P1: Set right_sibling = old_sibling\n    Tree->>Tree: Insert median key (500) into Root Parent Page\n    Tree->>P1: Insert new key (550) into Page 1\n    Tree-->>Client: void (Tree balanced!)\n```\n"},{"path":"15-checkpoints-and-fpi.md","title":"Item 15: WAL Checkpoints & Full-Page Images (FPI)","md":"# Item 15: WAL Checkpoints & Full-Page Images (FPI)\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/wal.h:20-60](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/wal.h), [src/wal.cpp:115-180](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/wal.cpp), [tests/test_checkpoint.cpp:1-130](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_checkpoint.cpp)\n\n---\n\n## 1. Checkpoint & Torn-Page Protection\n\n**Checkpoints** truncate the recovery horizon so that crash recovery does not need to scan WAL logs from the beginning of time.\n\n**Full-Page Images (FPI)** prevent catastrophic corruption caused by **torn pages** (when the OS crashes in the middle of writing an 8KB page, leaving a half-written 4KB sector on disk).\n\n```mermaid\nflowchart TD\n    subgraph CheckpointTimeline[\"Checkpoint Recovery Horizon\"]\n        CP[\"CHECKPOINT (LSN: 5000)\\n1. All dirty frames flushed to disk\\n2. Checkpoint record logged\\n3. Truncate WAL scan horizon\"]\n        FIRST_WRITE[\"First Write to Page 0 After Checkpoint\\nLogs entire 8192-byte FPI to WAL!\"]\n        CRASH[\"OS Crash / Power Loss\\n(Torn Page on Disk)\"]\n        HEAL[\"Crash Recovery Replay:\\nFPI overwrites torn page with perfect 8KB baseline!\"]\n    end\n\n    CP --> FIRST_WRITE --> CRASH --> HEAL\n```\n\n---\n\n## 2. Invariants & Mechanics\n\n1. **Dirty Buffer Coalescing**: `log_checkpoint()` invokes `BufferPoolManager::flush_all()`, writing all modified RAM frames to disk before appending the `CHECKPOINT` record (`[src/wal.cpp:135]`).\n2. **First-Write FPI Invariant**: The first transaction to modify any page following a checkpoint must write a full 8,192-byte snapshot of the page into WAL (`RecordType::FPI = 6`). Subsequent writes to that page only log compact delta records until the next checkpoint (`[src/wal.cpp:150]`).\n3. **Torn-Page Healing**: During recovery, replaying an FPI record unconditionally restores the physical 8KB page byte-for-byte, healing torn sectors before delta REDO logs are applied.\n\n---\n\n## 3. Sequence Diagram: Checkpoint & Torn Page Healing\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Admin as Checkpoint Daemon\n    participant WAL as WALManager\n    participant BPM as BufferPoolManager\n    participant Disk as Physical Disk (*.db)\n\n    Note over Admin,Disk: Checkpoint Execution\n    Admin->>BPM: flush_all() (Write all dirty RAM frames to disk)\n    Admin->>WAL: log_checkpoint() -> Records Checkpoint LSN (e.g. 5000)\n    \n    Note over Admin,Disk: First Post-Checkpoint Mutation\n    Admin->>WAL: log_fpi(page_id=0, raw_8192_bytes)\n    Admin->>WAL: log_insert(tx=10, ctid=(0, 1), data)\n    \n    Note over Admin,Disk: CRASH! Disk sector torn during write!\n    \n    Note over Admin,Disk: ARIES Crash Recovery\n    Admin->>WAL: recover()\n    WAL->>WAL: Replay starts at Checkpoint LSN 5000 (Skips old history!)\n    WAL->>Disk: Replay FPI -> Writes exact 8192 bytes (Torn page healed!)\n    WAL->>Disk: Replay Insert Delta -> Slot 1 restored!\n```\n"},{"path":"16-aries-3-phase-recovery.md","title":"Item 16: ARIES 3-Phase Crash Recovery & UNDO Pass","md":"# Item 16: ARIES 3-Phase Crash Recovery & UNDO Pass\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/wal.h:70-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/wal.h), [src/wal.cpp:160-240](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/wal.cpp), [tests/test_undo.cpp:1-135](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_undo.cpp)\n\n---\n\n## 1. The 3-Phase ARIES Recovery Algorithm\n\nPostgreSQL employs the **ARIES (Algorithms for Recovery and Isolation Exploiting Semantics)** model to restore consistency after an unexpected system crash or power outage:\n\n```mermaid\nflowchart TD\n    subgraph ARIES[\"ARIES 3-Phase Recovery Pipeline\"]\n        P1[\"Phase 1: Analysis Pass (Forward Scan)\\n• Scans from Checkpoint to EOF\\n• Identifies Active Transaction Table (ATT)\\n• Finds Loser (Uncommitted) Transactions\"]\n        P2[\"Phase 2: REDO Pass (Repeating History)\\n• Replays all logged operations (both winners & losers)\\n• Restores exact state of database at moment of crash\"]\n        P3[\"Phase 3: UNDO Pass (Backward Scan)\\n• Scans backward rolling back active loser transactions\\n• Restores modified tuples & stamps xmax=0\\n• Writes Compensation Log Records (CLRs)\\n• Marks loser transactions ABORTED in CLOG\"]\n    end\n\n    P1 --> P2 --> P3\n```\n\n---\n\n## 2. Invariants & Compensation Log Records (CLRs)\n\n1. **Repeating History**: REDO is executed unconditionally for all transactions (committed and uncommitted) before UNDO runs. This guarantees that uncommitted mutations, page splits, and allocations are brought into physical memory before being rolled back (`[src/wal.cpp:190]`).\n2. **Compensation Log Record (CLR)**: When an operation is rolled back during the UNDO pass, a `CLR` (`type = 7`) is written to WAL with an `undo_next_lsn` pointer. CLRs are **never undone**, preventing infinite recovery loops if the system crashes during recovery itself (`[src/wal.cpp:215]`).\n3. **CLOG Status Finalization**: Once an uncommitted transaction is rolled back, its status is finalized to `ABORTED` (`0x02`) in CLOG.\n\n---\n\n## 3. Sequence Diagram: ARIES Crash Recovery Walkthrough\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant System as Crash Recovery Engine\n    participant WAL as WAL Log Stream\n    participant ATT as Active Transaction Table (RAM)\n    participant Heap as Heap Storage\n    participant CLOG as Commit Log (CLOG)\n\n    Note over System,CLOG: Phase 1: Analysis Pass\n    System->>WAL: Forward scan from Checkpoint to EOF\n    WAL-->>ATT: Tx 1 = COMMITTED (Winner)<br/>Tx 2 = IN_PROGRESS (Loser)\n\n    Note over System,CLOG: Phase 2: REDO Pass (Repeating History)\n    System->>WAL: Replay Tx 1 Insert -> Applied to Page 0\n    System->>WAL: Replay Tx 2 Update -> Applied to Page 0 (Price $999)\n\n    Note over System,CLOG: Phase 3: UNDO Pass (Rolling Back Losers)\n    System->>WAL: Scan backward for Tx 2 actions\n    System->>Heap: Rollback Update -> Restore Slot 1 price ($10) & xmax=0\n    System->>WAL: log_clr(tx_id=2, undone_lsn)\n    System->>CLOG: set_status(tx_id=2, ABORTED)\n    Note over System,CLOG: Database fully consistent!\n```\n"},{"path":"17-toast-heap-index-integration.md","title":"Item 17: TOAST Heap + Index Full Integration","md":"# Item 17: TOAST Heap + Index Full Integration\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/tuple.h:40-55](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/tuple.h), [src/engine.cpp:180-245](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/engine.cpp), [tests/test_toast_integration.cpp:1-135](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_toast_integration.cpp)\n\n---\n\n## 1. Transparent Inline vs Out-of-Line Routing\n\nItem 17 integrates the TOAST subsystem transparently into the main SQL execution pipeline, B-Tree index scans, and cross-file durability across restarts.\n\n```mermaid\nflowchart TD\n    subgraph QueryLayer[\"INSERT INTO items VALUES (id, price, 'doc...');\"]\n        CHECK{\"Document Byte Size > 2048 B?\"}\n    end\n\n    subgraph InlinePath[\"Inline Storage Path (<= 2KB)\"]\n        INLINE[\"Store payload directly inside main HeapTuple\\ninfomask: Normal (0x0000)\"]\n    end\n\n    subgraph OutOfLinePath[\"TOAST Out-of-Line Path (> 2KB)\"]\n        CHUNK[\"1. Slice into 2KB chunks in ToastRelation (*_toast.db)\\n2. Store 18B ToastPointer in HeapTuple\\n3. Stamp infomask: HEAP_HASEXTERNAL (0x2000)\"]\n    end\n\n    subgraph BTreeIndex[\"Secondary Index (Key -> CTID)\"]\n        IDX[\"Index points directly to Heap CTID (0, 1)\\nIndex is 100% unaffected by TOAST!\"]\n    end\n\n    CHECK -->|No| INLINE\n    CHECK -->|Yes| CHUNK\n    INLINE --> BTreeIndex\n    CHUNK --> BTreeIndex\n```\n\n---\n\n## 2. Invariants & Infomask Flags\n\n1. **`HEAP_HASEXTERNAL` (`0x2000`)**: Stamped on `TupleHeader::infomask`. Signals to sequential scans and index fetchers that the tuple's trailing bytes contain an 18-byte `ToastPointer` rather than inline text (`[include/pg/tuple.h:44]`).\n2. **Zero Index Decoupling Impact**: Because the secondary index stores $(\\text{item\\_id} \\rightarrow \\text{CTID})$, the index node size is strictly 10 bytes regardless of whether the indexed row contains a 10-byte string or a 100-megabyte document.\n3. **Cross-Relation Durability**: On engine restart, the main heap relation (`*_heap.db`) and auxiliary TOAST relation (`*_toast.db`) are reopened simultaneously, ensuring data consistency.\n\n---\n\n## 3. Sequence Diagram: Transparent TOAST Query Execution\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as SQL Client\n    participant Engine as pg::Engine\n    participant Index as BTreeIndex\n    participant Heap as HeapFile\n    participant Toast as ToastManager\n\n    Client->>Engine: SELECT doc FROM items WHERE item_id = 500;\n    Engine->>Index: find_entries(500) -> CTID (0, 2)\n    Engine->>Heap: get((0, 2)) -> HeapTuple\n    Note over Engine: Check tuple.header.infomask & HEAP_HASEXTERNAL\n    alt HEAP_HASEXTERNAL is TRUE\n        Engine->>Toast: fetch_toast_payload(pointer.toast_id, pointer.raw_size)\n        Toast-->>Engine: Reassembled 10,000-byte document text\n    else HEAP_HASEXTERNAL is FALSE\n        Engine->>Engine: Read inline string\n    end\n    Engine-->>Client: Return document text to user\n```\n"},{"path":"18-embedded-http-rest-server.md","title":"Item 18: Embedded HTTP/REST API Server (Approach A)","md":"# Item 18: Embedded HTTP/REST API Server (Approach A)\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/http_server.h:1-45](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/http_server.h), [src/http_server.cpp:1-210](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/http_server.cpp), [tests/test_http_server.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_http_server.cpp)\n\n---\n\n## 1. 2-Tier Architecture & Web Integration\n\nItem 18 implements **Approach A: Direct Embedded HTTP/REST Server**.\nThe database binary embeds a lightweight, non-blocking Winsock2 HTTP 1.1 server listening on port `8080`, allowing web applications (e.g. React, Vue, cURL) to query the database directly via JSON.\n\n```mermaid\nflowchart LR\n    subgraph Frontend[\"Browser / React Application\"]\n        FETCH[\"fetch('http://localhost:8080/api/sql', {\\n  method: 'POST',\\n  body: 'SELECT * FROM items;'\\n})\"]\n    end\n\n    subgraph ServerDaemon[\"cpp-postgres HttpServer (:8080)\"]\n        CORS[\"CORS Pre-Flight (OPTIONS)\"]\n        STATUS[\"GET /api/status -> JSON Engine Metrics\"]\n        ITEMS[\"GET /api/items -> JSON Row Array\"]\n        SQL[\"POST /api/sql -> JSON {success, output}\"]\n    end\n\n    subgraph CoreEngine[\"pg::Engine\"]\n        CORE[\"Buffer Pool · Heap · WAL · B-Tree\"]\n    end\n\n    FETCH --> CORS\n    FETCH --> STATUS\n    FETCH --> ITEMS\n    FETCH --> SQL\n    SQL -->|Thread-Safe Mutex Lock| CORE\n```\n\n---\n\n## 2. Invariants & REST Endpoints\n\n1. **Full CORS Support**: Automatically handles `OPTIONS` requests and emits headers allowing cross-origin requests from any local frontend port:\n   - `Access-Control-Allow-Origin: *`\n   - `Access-Control-Allow-Methods: GET, POST, OPTIONS, PUT, DELETE`\n   - `Access-Control-Allow-Headers: Content-Type, Authorization`\n2. **JSON Response Contract**:\n   - `POST /api/sql`: Executes arbitrary SQL and returns `{ \"success\": true, \"sql\": \"...\", \"output\": \"...\" }`.\n   - `GET /api/items`: Streams live table rows directly as structured JSON objects:\n     ```json\n     {\n       \"items\": [\n         { \"item_id\": 100, \"price\": 10, \"xmin\": 1, \"xmax\": 0, \"ctid\": \"(0, 1)\" }\n       ]\n     }\n     ```\n3. **Thread Safety**: All incoming HTTP worker threads synchronize access to `pg::Engine` using `std::mutex engine_mutex_`.\n\n---\n\n## 3. Sequence Diagram: React Browser Query via HTTP\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant React as React Frontend (Browser)\n    participant HTTP as HttpServer (src/http_server.cpp)\n    participant Engine as pg::Engine Core\n\n    Note over React,HTTP: CORS Pre-flight Check\n    React->>HTTP: OPTIONS /api/sql\n    HTTP-->>React: HTTP 204 No Content (Access-Control-Allow-Origin: *)\n\n    Note over React,HTTP: SQL Execution Request\n    React->>HTTP: POST /api/sql (Body: \"INSERT INTO items VALUES (100, 10);\")\n    HTTP->>HTTP: Parse HTTP Request Line & Content-Length\n    HTTP->>Engine: lock(engine_mutex_) -> execute(sql)\n    Engine-->>HTTP: Output string\n    HTTP->>HTTP: Format JSON response\n    HTTP-->>React: HTTP 200 OK { \"success\": true, \"output\": \"...\" }\n```\n"},{"path":"19-pgwire-protocol-server.md","title":"Item 19: PostgreSQL Wire Protocol Server (Approach C)","md":"# Item 19: PostgreSQL Wire Protocol Server (Approach C)\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/pgwire.h:1-55](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/pgwire.h), [src/pgwire.cpp:1-320](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/pgwire.cpp), [tests/test_pgwire.cpp:1-160](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_pgwire.cpp)\n\n---\n\n## 1. Enterprise 3-Tier Integration Architecture\n\nItem 19 implements **Approach C: Native PostgreSQL Frontend/Backend Protocol v3.0**.\nListening on TCP port `5432`, `PgWireServer` transforms `cpp-postgres` into a drop-in PostgreSQL server compatible with standard PostgreSQL CLI tools, GUI clients, drivers, and ORMs.\n\n```mermaid\nflowchart LR\n    subgraph Ecosystem[\"Standard PostgreSQL Ecosystem\"]\n        PSQL[\"psql CLI\"]\n        PGADMIN[\"pgAdmin / DBeaver\"]\n        NODE[\"Node.js ('pg' / Prisma)\"]\n        PYTHON[\"Python ('psycopg2')\"]\n    end\n\n    subgraph PgWire[\"PgWireServer (Port 5432)\"]\n        SSL[\"SSLRequest ('N' Plaintext)\"]\n        AUTH[\"Startup / AuthOk ('R')\"]\n        QUERY[\"Simple Query ('Q') Engine\"]\n        ROWDESC[\"RowDescription ('T')\"]\n        DATAROW[\"DataRow ('D')\"]\n        COMPLETE[\"CommandComplete ('C')\"]\n        READY[\"ReadyForQuery ('Z')\"]\n    end\n\n    subgraph Storage[\"pg::Engine\"]\n        CORE[\"Relational Engine\"]\n    end\n\n    Ecosystem -->|Binary TCP Packets| SSL\n    SSL --> AUTH --> QUERY\n    QUERY --> ROWDESC --> DATAROW --> COMPLETE --> READY\n    QUERY <--> CORE\n```\n\n---\n\n## 2. Invariants & Packet Framing\n\n1. **Big-Endian Integer Serialization**: All 16-bit and 32-bit fields are transmitted in Network Byte Order (`htonl`/`htons`) (`[src/pgwire.cpp:15]`).\n2. **Binary Message Format**:\n   - `StartupMessage` $\\rightarrow$ `AuthenticationOk ('R', len=8, 0)` $\\rightarrow$ `ParameterStatus ('S')` $\\rightarrow$ `ReadyForQuery ('Z', 'I')`.\n   - `Query ('Q')` $\\rightarrow$ `RowDescription ('T')` $\\rightarrow$ `DataRow ('D')*` $\\rightarrow$ `CommandComplete ('C')` $\\rightarrow$ `ReadyForQuery ('Z')`.\n3. **Transaction State Synchronization**: The `ReadyForQuery ('Z')` packet transmits `'I'` when idle and `'T'` when an active transaction block is open.\n\n---\n\n## 3. Sequence Diagram: PostgreSQL Wire Protocol Handshake & Query\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as psql / Driver (Client Socket)\n    participant Server as PgWireServer (src/pgwire.cpp)\n    participant Engine as pg::Engine\n\n    Note over Client,Server: Connection Handshake\n    Client->>Server: SSLRequest (len=8, code=80877103)\n    Server-->>Client: 'N' (No SSL, fallback to plaintext)\n    Client->>Server: StartupMessage (Protocol 3.0, user=\"postgres\")\n    Server-->>Client: AuthenticationOk ('R', len=8, 0)\n    Server-->>Client: ParameterStatus ('S', server_version=\"16.0\")\n    Server-->>Client: ReadyForQuery ('Z', 'I')\n\n    Note over Client,Server: Query Execution Lifecycle\n    Client->>Server: Query ('Q', \"SELECT * FROM items;\")\n    Server->>Engine: execute(\"SELECT * FROM items;\")\n    Server-->>Client: RowDescription ('T', 5 columns: item_id, price, xmin, xmax, ctid)\n    Server-->>Client: DataRow ('D', values: \"100\", \"$10\", \"1\", \"0\", \"(0, 1)\")\n    Server-->>Client: CommandComplete ('C', \"SELECT 1\")\n    Server-->>Client: ReadyForQuery ('Z', 'I')\n\n    Note over Client,Server: Graceful Termination\n    Client->>Server: Terminate ('X', len=4)\n    Server->>Server: Close Socket\n```\n"},{"path":"20-desktop-gui-and-unified-server.md","title":"Item 20: Native Desktop GUI & Unified Server Daemon","md":"# Item 20: Native Desktop GUI & Unified Server Daemon\n\n**Confidence**: `verified`  \n**Citations**: [src/gui/main_gui.cpp:1-480](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/gui/main_gui.cpp), [src/server_main.cpp:1-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/server_main.cpp), [CMakeLists.txt:100-150](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/CMakeLists.txt)\n\n---\n\n## 1. Unified Applications Overview\n\nItem 20 delivers two standalone executable artifacts:\n1. **`pg_gui.exe` (3.89 MB)**: A self-contained Windows desktop GUI application built with **Dear ImGui + DirectX 11 + Win32**, providing visual memory inspectors for 8KB slotted pages, clock-sweep buffer frames, on-disk B-Tree graphs, and an interactive SQL scratchpad.\n2. **`pg_server.exe`**: A multi-protocol daemon running both **Approach A (HTTP REST :8080)** and **Approach C (pgwire TCP :5432)** concurrently on background threads, wired to a shared `pg::Engine`.\n\n```mermaid\nflowchart TD\n    subgraph StandaloneApps[\"Executable Applications\"]\n        GUI[\"pg_gui.exe (Desktop Explorer)\\n• DirectX 11 + Dear ImGui\\n• Live Slotted Page Memory Bar\\n• Real-Time Clock-Sweep Visualizer\\n• B-Tree Index Key Mapper\"]\n        SRV[\"pg_server.exe (Unified Server Daemon)\\n• Background Thread 1: HTTP :8080\\n• Background Thread 2: pgwire :5432\\n• Signal Handler & Console CLI\"]\n    end\n\n    subgraph CoreEngine[\"Shared Core Library (libpg_core.a)\"]\n        ENG[\"pg::Engine (C++20)\\nShared Buffers · Slotted Pages · ARIES WAL · CLOG · TOAST\"]\n    end\n\n    GUI --> ENG\n    SRV --> ENG\n```\n\n---\n\n## 2. Desktop GUI Feature Breakdown\n\n```text\n┌────────────────────────────────────────────────────────────────────────────────────────┐\n│  🐘 CPP-POSTGRES STORAGE ENGINE DESKTOP EXPLORER                         [ _ □ ✕ ]   │\n├──────────────────────────┬─────────────────────────────────────────────────────────────┤\n│ 📝 SQL QUERY WORKSPACE   │ 🔬 PHYSICAL STORAGE ENGINE VISUALIZERS                      │\n│ ┌──────────────────────┐ │ [📄 8KB Slotted Page] [🧠 Shared Buffers] [🌲 Disk B-Tree]  │\n│ │ SELECT * FROM items; │ │ ─────────────────────────────────────────────────────────── │\n│ └──────────────────────┘ │ Page 0 Header (18B) | pd_lower: 30B | pd_upper: 8120B      │\n│ [▶ Run F5] [BEGIN]      │ [■■■ Line Pointers] [        Free Space        ] [■■ Tuples] │\n│ [COMMIT]   [ROLLBACK]   │ ┌────────┬────────┬────────┬───────────────────────────────┐ │\n│ [STATUS]   [VACUUM]     │ │ Slot # │ Offset │ Length │ Live Tuple Details            │ │\n│                         │ ├────────┼────────┼────────┼───────────────────────────────┤ │\n│ 📋 LIVE TABLE VIEW      │ │ Slot 1 │ 8168   │ 24 B   │ [LIVE] id=100, price=$10      │ │\n│ ┌─────┬───────┬────┬───┐│ │ Slot 2 │ 8144   │ 24 B   │ [HOT REDIRECT] -> (0, 3)      │ │\n│ │ id  │ price │xmin│CTI││ │ Slot 3 │ 8120   │ 24 B   │ [HEAP-ONLY TUPLE] id=100, $20 │ │\n│ ├─────┼───────┼────┼───┤│ └────────┴────────┴────────┴───────────────────────────────┘ │\n│ │ 100 │ $20   │ 4  │0,3││                                                             │\n│ │ 200 │ $5    │ 2  │0,2││ 🧠 Shared Buffers Tab: Live Clock-Sweep & Pin Tracking       │\n│ └─────┴───────┴────┴───┘│ 🌲 Disk B-Tree Tab: Key -> Candidate CTID Mapping           │\n│                         │ 🚦 CLOG Tab: 2-bit Transaction Status Bitmaps               │\n│ 📊 OUTPUT LOG CONSOLE   │ 📜 WAL Tab: ARIES Crash Recovery & Checkpoint Stream         │\n│                         │ 🍞 TOAST Tab: 2KB Chunk Auxiliary Table Inspector           │\n└──────────────────────────┴─────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 3. Sequence Diagram: Dual Server Daemon Operation\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Main as Server Main (src/server_main.cpp)\n    participant Engine as Shared pg::Engine\n    participant HTTP as HttpServer (:8080)\n    participant PGW as PgWireServer (:5432)\n    participant React as React Browser\n    participant PSQL as psql CLI\n\n    Main->>Engine: Initialize Database (\"pg_server_data\")\n    Main->>HTTP: start_async() (Spawns HTTP Worker Thread)\n    Main->>PGW: start_async() (Spawns pgwire Worker Thread)\n    \n    par Concurrent Client Queries\n        React->>HTTP: POST /api/sql { \"sql\": \"INSERT INTO items...\" }\n        HTTP->>Engine: lock(mutex) -> execute()\n        Engine-->>HTTP: JSON output\n        HTTP-->>React: HTTP 200 OK\n    and\n        PSQL->>PGW: Simple Query ('Q', \"SELECT * FROM items;\")\n        PGW->>Engine: lock(mutex) -> seq_scan()\n        Engine-->>PGW: Tuples\n        PGW-->>PSQL: RowDescription ('T') + DataRow ('D')\n    end\n\n    Note over Main: User types 'quit' or sends SIGINT\n    Main->>HTTP: stop() (Closes socket)\n    Main->>PGW: stop() (Closes socket)\n    Main-->>Main: Database cleanly persisted to disk!\n```\n"}];

const slug = (s, i) => 'ch' + i + '-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);

// Pull mermaid blocks out before markdown parsing so the fence content survives verbatim.
const blocks = [];
const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  if (lang === 'mermaid') { blocks.push(code); return `<div class="mermaid" data-i="${blocks.length - 1}"></div>`; }
  return `<pre><code class="language-${lang || ''}">${code.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</code></pre>`;
};
marked.setOptions({ renderer, gfm: true, breaks: false });

const book = document.getElementById('book');
const toc = document.getElementById('toc');

DOCS.forEach((doc, i) => {
  const sec = document.createElement('section');
  sec.className = 'chapter';
  // Drop the leading H1 — the chapter heading is emitted with a stable anchor instead.
  const body = doc.md.replace(/^#\s+.+$/m, '').trim();
  const id = slug(doc.title, i);
  sec.innerHTML = `<h1 id="${id}">${i + 1}. ${doc.title}</h1>` + marked.parse(body);
  book.appendChild(sec);

  const li = document.createElement('li');
  li.innerHTML = `<a href="#${id}"><span class="num">${i + 1}</span>${doc.title}</a>`;
  const subs = [...sec.querySelectorAll('h2')];
  if (subs.length) {
    const ol = document.createElement('ol');
    subs.forEach((h, j) => {
      const sid = id + '-s' + j;
      h.id = sid;
      const sli = document.createElement('li');
      sli.innerHTML = `<a href="#${sid}">${h.textContent}</a>`;
      ol.appendChild(sli);
    });
    li.appendChild(ol);
  }
  toc.appendChild(li);
});

// LaTeX. Walk text nodes rather than elements: a paragraph containing an inline <code>
// still has math outside it, so skipping whole elements loses real formulae.
const mathWalker = document.createTreeWalker(book, NodeFilter.SHOW_TEXT, {
  acceptNode: (n) => (!n.parentElement.closest('code, pre, .mermaid') && n.nodeValue.includes('$'))
    ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
});
const mathNodes = [];
while (mathWalker.nextNode()) mathNodes.push(mathWalker.currentNode);

for (const node of mathNodes) {
  const parts = node.nodeValue.split(/(\$\$[^$]+?\$\$|\$[^$\n]+?\$)/g);
  if (parts.length < 2) continue;
  const frag = document.createDocumentFragment();
  for (const part of parts) {
    const display = /^\$\$[\s\S]+\$\$$/.test(part);
    const inline = !display && /^\$[^$\n]+\$$/.test(part);
    if (!display && !inline) { if (part) frag.appendChild(document.createTextNode(part)); continue; }
    const tex = display ? part.slice(2, -2) : part.slice(1, -1);
    const span = document.createElement('span');
    try { span.innerHTML = katex.renderToString(tex, { displayMode: display, throwOnError: false }); }
    catch { span.textContent = part; }
    frag.appendChild(span);
  }
  node.replaceWith(frag);
}

let mermaidFailures = 0;
try {
  mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose',
                       flowchart: { htmlLabels: false }, fontFamily: 'inherit' });
  for (const el of document.querySelectorAll('.mermaid')) {
    const src = blocks[+el.dataset.i];
    try {
      const { svg } = await mermaid.render('m' + el.dataset.i + '-' + Math.random().toString(36).slice(2), src);
      el.innerHTML = svg;
    } catch (e) {
      mermaidFailures++;
      el.className = 'mermaid-failed';
      el.innerHTML = '<b>diagram failed to render</b><pre>' + src.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) + '</pre>';
    }
  }
} catch (e) { mermaidFailures = -1; }

window.__diag = { chapters: DOCS.length, diagrams: blocks.length, mermaidFailures };
document.title = "PostgreSQL Storage Engine Architecture Atlas" + ' · ok:' + blocks.length + ':' + mermaidFailures;
