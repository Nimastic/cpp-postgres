const DOCS = [{"path":"00-orientation.md","title":"PostgreSQL Storage Engine Architecture & Orientation","md":"# PostgreSQL Storage Engine Architecture & Orientation\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/engine.h:1-85](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/engine.h), [src/engine.cpp:1-250](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/engine.cpp), [CMakeLists.txt:1-150](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/CMakeLists.txt)\n\n---\n\n## 1. Executive Overview\n\n`cpp-postgres` is a zero-external-dependency relational storage engine implemented in C++20, written to teach PostgreSQL storage internals. It reproduces PostgreSQL's **mechanisms** — slotted pages, MVCC visibility rules, HOT chains, clock-sweep buffer replacement, WAL with full-page images, 2-bit CLOG bitmaps, and TOAST chunking — using deliberately narrowed struct layouts.\n\n> **Implementation status.** The behavioural audit in\n> `notes/2026-08-27-architecture-audit.md` found that several mechanisms\n> documented here existed as code but were not wired into the running\n> system, and that write-ahead durability and the single-gateway rule were\n> not upheld. Those are fixed as of 2026-08-27; each chapter carries an\n> *Implementation status* section where its behaviour changed, and the audit\n> holds the per-finding status table.\n>\n> **Fidelity disclaimer.** This engine is *not* byte-compatible with a real PostgreSQL data directory, and several documented structures are smaller than PostgreSQL's. The single largest algorithmic divergence is crash recovery: `cpp-postgres` implements textbook **ARIES with an UNDO pass and CLRs**, whereas **PostgreSQL is redo-only and has no UNDO pass and no compensation log records at all** (see Item 16). Section 4 below is the authoritative fidelity ledger; every chapter ends with its own *PostgreSQL Fidelity Check*.\n\nThe architecture is partitioned into strict, decoupled layers:\n\n```mermaid\nflowchart TD\n    subgraph Clients[\"Access Layer (Items 11, 18, 19, 20)\"]\n        CLI[\"CLI REPL\\n(pg_cli.exe)\"]\n        GUI[\"Desktop GUI\\n(pg_gui.exe)\"]\n        HTTP[\"HTTP REST :8080\\n(Approach A)\"]\n        PGW[\"pgwire TCP :5432\\n(Approach C)\"]\n    end\n\n    subgraph EngineCore[\"Engine Coordinator (pg::Engine)\"]\n        TM[\"Transaction Manager\\n(MVCC & Snapshots)\"]\n        EXEC[\"SQL Executor & Parser\"]\n    end\n\n    subgraph Memory[\"RAM Subsystems (Item 8, 12)\"]\n        BPM[\"Shared Buffers (BufferPoolManager)\\n16 Frames · Clock-Sweep Eviction\"]\n    end\n\n    subgraph Storage[\"Disk Subsystems (Items 1-7, 9, 10, 13-17)\"]\n        HEAP[\"Heap Relation (.db)\\n8KB Slotted Pages\"]\n        BTREE[\"Disk B-Tree (.db)\\nRoot/Internal/Leaf\"]\n        WAL[\"Write-Ahead Log (.log)\\nCRC32 · FPI · CLRs\"]\n        CLOG[\"Commit Log (.db)\\n2-bit Bitmap Pages\"]\n        TOAST[\"TOAST Relation (.db)\\n2KB Data Chunks\"]\n    end\n\n    Clients --> EngineCore\n    EngineCore --> Memory\n    Memory <--> HEAP\n    Memory <--> BTREE\n    Memory <--> CLOG\n    Memory <--> TOAST\n    EngineCore --> WAL\n    WAL -.->|REDO / UNDO Recovery| HEAP\n```\n\n---\n\n## 2. Global Subsystem Invariants\n\nThe entire storage engine enforces seven architectural invariants:\n\n1. **8KB Page Uniformity**: All disk structures (Heap, B-Tree, CLOG, TOAST) operate on fixed 8,192-byte page boundaries aligned to the OS block layer (`[include/pg/constants.h:9]`). *PostgreSQL parity*: `BLCKSZ` defaults to 8192 but is a compile-time option (1 KB – 32 KB); `cpp-postgres` hard-codes 8192.\n2. **Buffer Pool Single Gateway**: Application subsystems never execute direct file I/O; all page accesses pin frames inside `BufferPoolManager` (`[src/heap.cpp:45]`).\n3. **Write-Ahead Logging (WAL)**: A dirty page in RAM is never written to disk until its corresponding WAL log record has been flushed (`page.pd_lsn <= wal.flushed_lsn`) (`[src/wal.cpp:110]`).\n4. **Append-Only MVCC**: Updates never rewrite a tuple's *payload* in place; they append a new version stamped with `xmin` and mark the old version by writing `xmax` into its header. Note that the header write **is** an in-place page mutation — which is precisely why the delete/update must be WAL-logged (`[src/heap.cpp:88]`).\n5. **Secondary Index Decoupling**: B-Tree secondary indexes map `Key -> CTID` physical addresses without embedding tuple columns or MVCC headers (`[src/btree.cpp:15]`).\n6. **Zero Index-Bloat HOT Updates**: Unindexed column updates residing on the same 8KB page construct line-pointer chains with zero index writes (`[src/heap.cpp:142]`).\n7. **2-Bit CLOG Density**: Transaction commit states are packed into 2-bit bitmaps on disk, scaling to 32,768 transactions per 8KB page (`[src/clog.cpp:30]`). *PostgreSQL parity*: exact — `CLOG_XACTS_PER_PAGE` is also 32,768, and the four status codes match bit-for-bit.\n\n---\n\n## 3. Subsystem Dependency Matrix\n\n```mermaid\nclassDiagram\n    class Engine {\n        +execute(sql)\n        +begin_transaction()\n        +commit_transaction()\n        +rollback_transaction()\n        +vacuum()\n        +checkpoint()\n        +recover()\n    }\n    class HeapFile {\n        +insert(record, xmin)\n        +update(old_ctid, record, tx_id)\n        +hot_update(old_ctid, record, tx_id)\n        +seq_scan()\n        +get(ctid)\n    }\n    class BufferPoolManager {\n        +fetch_page(page_id)\n        +unpin_page(page_id, is_dirty)\n        +flush_page(page_id)\n        +flush_all()\n    }\n    class WALManager {\n        +log_insert(tx_id, ctid, record)\n        +log_update(tx_id, old_ctid, new_ctid, record)\n        +log_checkpoint()\n        +log_fpi(page_id, page_data)\n        +recover_3phase()\n    }\n    class DiskBTree {\n        +insert_entry(key, ctid)\n        +find_entries(key)\n        +range_scan(min, max)\n    }\n    class CLogManager {\n        +set_status(tx_id, status)\n        +get_status(tx_id)\n    }\n    class ToastManager {\n        +store_toast_payload(toast_id, data)\n        +fetch_toast_payload(toast_id, raw_size)\n    }\n\n    Engine *-- HeapFile\n    Engine *-- BufferPoolManager\n    Engine *-- WALManager\n    Engine *-- DiskBTree\n    Engine *-- CLogManager\n    Engine *-- ToastManager\n    HeapFile --> BufferPoolManager\n    DiskBTree --> BufferPoolManager\n    WALManager --> BufferPoolManager\n```\n\n---\n\n## 4. PostgreSQL Fidelity Ledger\n\nVerified against PostgreSQL `master` headers (`bufpage.h`, `itemid.h`, `htup_details.h`, `heaptoast.h`, `clog.h`, `xlogrecord.h`, `nbtree.h`).\n\n### 4.1 Structures that match PostgreSQL exactly\n\n| Structure | Value | PostgreSQL source |\n|---|---|---|\n| Line pointer size | 4 bytes | `ItemIdData` |\n| Line-pointer state codes | `UNUSED=0, NORMAL=1, REDIRECT=2, DEAD=3` | `LP_UNUSED/LP_NORMAL/LP_REDIRECT/LP_DEAD` |\n| `t_ctid` size | 6 bytes | `ItemPointerData` |\n| `PD_ALL_VISIBLE` | `0x0004` | `bufpage.h` |\n| CLOG transactions per page | 32,768 | `CLOG_XACTS_PER_PAGE` |\n| CLOG status codes | `00/01/10/11` = in-progress/committed/aborted/sub-committed | `clog.h` |\n| `HEAP_HOT_UPDATED` / `HEAP_ONLY_TUPLE` | `0x4000` / `0x8000` | `htup_details.h` (but in `t_infomask2`, not `t_infomask`) |\n| Max heap tuples per 8KB page | 291 | `MaxHeapTuplesPerPage` — same number, reached by different arithmetic |\n| pgwire protocol | v3.0, `SSLRequest` code 80877103 | `pqcomm.h` |\n\n### 4.2 Structures that are narrower than PostgreSQL's\n\n| Structure | cpp-postgres | PostgreSQL | Missing |\n|---|---|---|---|\n| Page header | 18 B | **24 B** (`SizeOfPageHeaderData`) | `pd_pagesize_version` (2 B), `pd_prune_xid` (4 B) |\n| Line-pointer bit split | 16 / 14 / 2 (offset / len / flags) | **15 / 2 / 15** (`lp_off` / `lp_flags` / `lp_len`) | — |\n| Tuple header | 16 B | **23 B** (`SizeofHeapTupleHeader`, MAXALIGNed to 24) | `t_cid` union (4 B), `t_infomask2` (2 B), `t_hoff` (1 B), `t_bits` null bitmap |\n| Infomask | one 16-bit `infomask` | two words: `t_infomask` + `t_infomask2` | 16 visibility/lock flags incl. all hint bits |\n| `HEAP_HASEXTERNAL` | `0x2000` | **`0x0004`** (`0x2000` is `HEAP_UPDATED`) | — |\n| WAL record header | 35 B, custom | 24 B `XLogRecord` + rmgr block headers | resource managers, block references |\n| WAL checksum | CRC-32 (IEEE 802.3) | **CRC-32C (Castagnoli)** | — |\n| TOAST threshold | 2048 B per attribute | **2032 B per whole tuple** (`TOAST_TUPLE_THRESHOLD`) | — |\n| TOAST chunk size | 2048 B | **1996 B** (`TOAST_MAX_CHUNK_SIZE`) | — |\n| Buffer pool | 16 frames | 16,384 frames (128 MB `shared_buffers` default) | freelist, strategy rings, usage-count cap of 5 |\n| B-tree node | parent pointer + right sibling | Lehman & Yao: metapage, high key, `btpo_prev`/`btpo_next`, **no parent pointers** | deduplication, fillfactor splits |\n\n### 4.3 PostgreSQL mechanisms this engine does not model at all\n\n- **Transaction ID wraparound and freezing** (`FrozenTransactionId`, `vacuum_freeze_min_age`, anti-wraparound autovacuum). `tx_id_t` here is a plain monotonic `uint32_t` that is never frozen.\n- **Hint bits** (`HEAP_XMIN_COMMITTED`, `HEAP_XMAX_COMMITTED`, …) — PostgreSQL caches CLOG lookups in the tuple header; this engine hits CLOG on every visibility test.\n- **Visibility map / free space map**, and therefore **index-only scans**.\n- **MultiXactIds** and row-level locking (`SELECT … FOR UPDATE` also writes `xmax` in PostgreSQL).\n- **Sub-transactions / savepoints**, despite CLOG reserving the `SUB_COMMITTED` code.\n- **Autovacuum, the checkpointer, the WAL writer, and the background writer** as separate processes.\n- **Streaming replication, logical decoding, replication slots.**\n- **Isolation levels.** PostgreSQL defaults to Read Committed (new snapshot per statement) and offers Repeatable Read and Serializable (SSI); this engine implements one snapshot-per-transaction model only.\n- **The query planner and executor** — no cost model, no join methods, no statistics.\n"},{"path":"01-pager-and-io.md","title":"Item 1: Pager & 8KB Fixed Page Disk I/O","md":"# Item 1: Pager & 8KB Fixed Page Disk I/O\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/pager.h:1-62](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/pager.h), [src/pager.cpp:1-85](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/pager.cpp), [tests/test_pager.cpp:1-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_pager.cpp)\n\n---\n\n## 1. Architectural Role\n\nThe **Pager** is the lowest-level storage primitive in the database engine. It abstracts the host operating system's filesystem into a linear sequence of fixed-size **8,192-byte (8KB)** disk pages indexed by a 32-bit `page_id_t`.\n\n```mermaid\nflowchart LR\n    subgraph DiskFile[\"Physical Database File (*.db)\"]\n        P0[\"Page 0\\n[0 .. 8191 B]\"]\n        P1[\"Page 1\\n[8192 .. 16383 B]\"]\n        P2[\"Page 2\\n[16384 .. 24575 B]\"]\n        PN[\"Page N\\n[N*8192 .. (N+1)*8192-1 B]\"]\n    end\n\n    subgraph PagerSubsystem[\"Pager (src/pager.cpp)\"]\n        CALC[\"Offset Calculation:\\noffset = page_id * 8192\"]\n        SEEK[\"seekg() / seekp()\"]\n        IO[\"read() / write()\"]\n    end\n\n    CALC --> SEEK --> IO <--> DiskFile\n```\n\n---\n\n## 2. Invariants & Formulas\n\n1. **Exact Page Boundary Alignment**:\n   $$\\text{file\\_offset} = \\text{page\\_id} \\times 8192$$\n   Every disk read and write transfers exactly $8,192\\text{ bytes}$. No partial page I/O is ever permitted.\n2. **Deterministic File Growth**:\n   When `write_page(page_id, ...)` is called on an unallocated `page_id \\ge \\text{num\\_pages()}`, the file automatically grows in discrete 8KB increments padded with zeros (`[src/pager.cpp:52]`).\n3. **C++ Stream Flag Integrity**:\n   Because reading past EOF in `std::fstream` sets `eofbit` and `failbit`, subsequent seek operations silently fail unless `stream.clear()` is invoked prior to any seek or write (`[src/pager.cpp:25]`).\n\n---\n\n## 3. Sequence Diagram: Reading & Writing Pages\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as Subsystem (Heap/BTree/CLOG)\n    participant Pager as Pager (src/pager.cpp)\n    participant OS as OS File System (*.db)\n\n    Note over Client,OS: Reading an 8KB Page\n    Client->>Pager: read_page(page_id, dest_buffer)\n    Pager->>Pager: stream.clear()\n    Pager->>Pager: offset = page_id * 8192\n    Pager->>OS: seekg(offset, ios::beg)\n    Pager->>OS: read(dest_buffer, 8192)\n    Pager-->>Client: void (dest_buffer populated)\n\n    Note over Client,OS: Writing an 8KB Page\n    Client->>Pager: write_page(page_id, src_data)\n    Pager->>Pager: stream.clear()\n    Pager->>Pager: offset = page_id * 8192\n    Pager->>OS: seekp(offset, ios::beg)\n    Pager->>OS: write(src_data, 8192)\n    Pager->>OS: flush() (push to OS disk buffer)\n    Pager-->>Client: void (page persisted)\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\nPostgreSQL's counterpart to the Pager is the **storage manager** (`smgr`), whose only implementation is `md.c` (\"magnetic disk\").\n\n| Claim | Verdict |\n|---|---|\n| Relation file addressed as a linear array of fixed 8KB blocks | **Exact** |\n| `offset = block_number * BLCKSZ`, whole blocks only, never partial I/O | **Exact** |\n| Writing past the end extends the file in whole-block increments | **Exact in shape** — PostgreSQL's `mdextend()` zero-fills |\n| `stream.clear()` before seek after EOF | **C++-specific** — an artifact of `std::fstream`, no PostgreSQL analogue |\n| `flush()` after every write | **Divergent** — see below |\n\n### What PostgreSQL layers on top\n\n- **Segmentation.** A relation larger than 1 GB is split into `<relfilenode>`, `<relfilenode>.1`, `<relfilenode>.2`, … Block 200,000 lives in segment 1 at an offset computed modulo `RELSEG_SIZE`. This engine uses one unbounded file.\n- **Forks.** Each relation has a *main* fork plus `_fsm` (free space map), `_vm` (visibility map) and, for unlogged tables, `_init`. Only the main fork exists here.\n- **fsync is deferred, not per-write.** PostgreSQL writes with buffered `pwrite()` and hands the fsync obligation to the checkpointer through a shared request queue (`register_dirty_segment`), so durability is paid once per checkpoint rather than once per page. Flushing on every `write_page()`, as here, is far more conservative — and far slower — than PostgreSQL.\n- **`relfilenode` vs OID.** Filenames are `relfilenode` numbers, which *change* under `VACUUM FULL`, `TRUNCATE` and `REINDEX`; they are not the table's OID.\n- **Direct I/O and readahead.** `io_method` / `debug_io_direct`, and from v17 a streaming read interface that batches sequential block requests.\n\n### Implementation status (2026-08-27)\n\nThe Pager no longer uses `std::fstream`. It sits on a raw descriptor (`pg::File`)\nwith positioned reads and writes, which gives it two things a stream cannot:\n\n- **A real durability barrier.** `Pager::sync()` calls `fdatasync` (`_commit` on\n  Windows). `std::fstream::flush()` only drains the userspace buffer into the OS\n  page cache, so before this the WAL was not durable at all.\n- **No sticky stream state.** Positioned I/O has no shared cursor, so a read that\n  hits end-of-file cannot silently suppress a later write. That failure mode had\n  been quietly discarding the WAL records written during crash recovery.\n\nStill simplified: one file per relation with no 1GB segmentation, no forks, and\n`fsync` at checkpoint rather than through a checkpointer's request queue.\n"},{"path":"02-slotted-page-architecture.md","title":"Item 2: Slotted Page Architecture","md":"# Item 2: Slotted Page Architecture\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/page.h:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/page.h), [src/page.cpp:1-170](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/page.cpp), [tests/test_page.cpp:1-110](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_page.cpp)\n\n---\n\n## 1. Physical Memory Layout\n\nThe **Slotted Page** architecture solves variable-length record management and in-place defragmentation. Within each 8,192-byte page, memory grows inward from both ends:\n\n```text\n┌────────────────────────────────────────────────────────────────────────────────────────┐\n│ 8192-Byte Slotted Page Physical Memory Layout                                         │\n├───────────────┬──────────────┬──────────────┬──────────────┬─────────────┬─────────────┤\n│ PageHeader    │ Line Pointer │ Line Pointer │ Free Space   │ Tuple Data  │ Tuple Data  │\n│ (18 Bytes)    │ Slot 1 (4B)  │ Slot 2 (4B)  │ (Contiguous) │ Version 2   │ Version 1   │\n│ [0 .. 17]     │ [18 .. 21]   │ [22 .. 25]   │              │             │             │\n└───────────────┴──────────────┴──────────────┴──────────────┴─────────────┴─────────────┘\n0              18             22             pd_lower       pd_upper      8168          8192\n▲                                            ▲              ▲                           ▲\n└─────────── Growing Downward ───────────────┘              └───── Growing Upward ──────┘\n```\n\n---\n\n## 2. Invariants & Mathematical Formulas\n\n1. **Page Header Structure (18 Bytes — PostgreSQL uses 24)** (`[include/pg/page.h:41-48]`):\n   - `pd_lsn` (8 Bytes): LSN of the last WAL record that modified this page (`[include/pg/page.h:42]`).\n   - `pd_checksum` (2 Bytes): Page checksum (`[include/pg/page.h:43]`).\n   - `pd_flags` (2 Bytes): Page status flags (e.g. `PD_ALL_VISIBLE = 0x0004`).\n   - `pd_lower` (2 Bytes): Byte offset marking the end of the line pointers array (initially 18).\n   - `pd_upper` (2 Bytes): Byte offset marking the start of the youngest tuple data (initially 8192).\n   - `pd_special` (2 Bytes): Reserved for index-specific metadata (8192 for heap pages — same convention as PostgreSQL, where a heap page has no special area).\n\n   PostgreSQL's `PageHeaderData` is **24 bytes** (`SizeOfPageHeaderData`). The first six fields are identical in order and width; PostgreSQL then adds two fields this engine omits:\n   - `pd_pagesize_version` (2 Bytes): page size in the high byte, layout version in the low byte — the check that refuses to mount a data directory built with a different `BLCKSZ`.\n   - `pd_prune_xid` (4 Bytes): hint holding the oldest XID on the page that might be prunable. This is what lets an ordinary `SELECT` decide cheaply whether HOT pruning is worth attempting (Item 7).\n\n   `pd_flags` values match PostgreSQL exactly: `PD_HAS_FREE_LINES = 0x0001`, `PD_PAGE_FULL = 0x0002`, `PD_ALL_VISIBLE = 0x0004`.\n\n2. **Line Pointer Layout (4 Bytes)** (`[include/pg/page.h:22-38]`):\n   - `lp_offset` (uint16_t, 16 bits): Byte offset from start of page where tuple data begins.\n   - `lp_len_flags` (uint16_t, 16 bits):\n     - Lower 14 bits (`0x3FFF`): Byte length of tuple.\n     - Upper 2 bits (`>> 14`): `ItemFlags` (`00` = `UNUSED`, `01` = `NORMAL` (Live), `10` = `REDIRECT` (HOT chain), `11` = `DEAD`).\n\n   The **size (4 bytes) and the four state codes are identical to PostgreSQL**, but the bit split is not. PostgreSQL's `ItemIdData` is a single 32-bit bitfield triple:\n   ```c\n   unsigned lp_off:15,    /* offset to tuple from start of page */\n            lp_flags:2,   /* LP_UNUSED / LP_NORMAL / LP_REDIRECT / LP_DEAD */\n            lp_len:15;    /* byte length of tuple */\n   ```\n   15 bits is exactly enough to address any byte in a 32 KB page, which is why PostgreSQL caps `BLCKSZ` at 32 KB. This engine's 16/14/2 split gives the same practical range at 8 KB but is a different physical encoding.\n\n   PostgreSQL also attaches meaning to the flag states that this engine does not yet enforce: `LP_REDIRECT` and `LP_UNUSED` must have `lp_len == 0`, and `LP_DEAD` is set by index scans (the `kill_prior_tuple` optimisation) as well as by pruning.\n\n3. **Free Space Allocation Formula**:\n   $$\\text{Free Space Available} = \\text{pd\\_upper} - \\text{pd\\_lower} - 4$$\n   Every tuple insertion requires both tuple payload memory ($\\ge \\text{len}$) and a new 4-byte line pointer in the header array.\n\n   PostgreSQL's `PageGetFreeSpace()` computes the same difference, but two extra rules apply that this engine does not implement:\n   - Every item is **MAXALIGNed** (8 bytes on 64-bit), so the true cost of a tuple is `MAXALIGN(len) + 4`, not `len + 4`.\n   - `PageGetHeapFreeSpace()` additionally reports zero once the page already holds `MaxHeapTuplesPerPage` (291) line pointers, because no further line pointer can be addressed.\n\n---\n\n## 3. Tuple Insertion Algorithm\n\n```mermaid\nflowchart TD\n    START([insert_tuple data, len]) --> CHECK{len + 4 <= pd_upper - pd_lower}\n    CHECK -->|No| REJECT[Reject: Page Full]\n    CHECK -->|Yes| DEC[pd_upper = pd_upper - len]\n    DEC --> COPY[Copy payload into page at pd_upper]\n    COPY --> INC[Compute slot_id = pd_lower - 18 / 4 + 1<br/>Advance pd_lower = pd_lower + 4]\n    INC --> PTR[Write LinePointer for slot_id<br/>offset = pd_upper, flags = NORMAL, len = len]\n    PTR --> DONE([Return slot_id])\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| Slotted layout, header + line pointers growing up, tuples growing down | **Exact** |\n| `pd_lsn`, `pd_checksum`, `pd_flags`, `pd_lower`, `pd_upper`, `pd_special` order and widths | **Exact** |\n| `PD_ALL_VISIBLE = 0x0004` | **Exact** |\n| Line pointer = 4 bytes; states `UNUSED/NORMAL/REDIRECT/DEAD` = 0/1/2/3 | **Exact** |\n| Page header is 18 bytes | **Simplified** — PostgreSQL is 24 (`pd_pagesize_version`, `pd_prune_xid` omitted) |\n| Line-pointer bit split 16/14/2 | **Divergent** — PostgreSQL is 15/2/15 |\n| `free = pd_upper - pd_lower - 4` | **Simplified** — PostgreSQL MAXALIGNs items and caps line pointers at 291 |\n| Page checksum | **Not implemented** — `pd_checksum` is stored but never computed; PostgreSQL uses an FNV-1a-based 16-bit page checksum |\n\n### Implementation status (2026-08-27)\n\n`Page` is now a **view** over 8192 bytes it does not own, so callers work\ndirectly inside a pinned buffer frame the way `BufferGetPage()` does. `PageBuffer`\nowns storage where a page genuinely needs its own (recovery scratch, fresh pages,\ntests).\n\n`insert_tuple` no longer recycles `LP_DEAD` line pointers — only `LP_UNUSED`.\nA DEAD pointer may still be the target of an index entry VACUUM has not cleaned\nyet, and handing that slot to a new tuple makes the stale entry resolve to an\nunrelated row. `Page::insert_tuple_at` was added for WAL redo, which must restore\na tuple to the exact slot the record names rather than letting the page choose.\n"},{"path":"03-heap-tuples-and-ctid.md","title":"Item 3: Tuples & Heap CTID Physical Addressing","md":"# Item 3: Tuples & Heap CTID Physical Addressing\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/tuple.h:1-90](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/tuple.h), [include/pg/heap.h:1-82](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/heap.h), [src/heap.cpp:1-210](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/heap.cpp), [tests/test_heap.cpp:1-120](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_heap.cpp)\n\n---\n\n## 1. Physical CTID Tuple Addressing\n\nEvery row version in the database is uniquely addressed by its **CTID** — in PostgreSQL an `ItemPointerData`, surfaced to SQL as the system column `ctid`:\n\n$$\\text{CTID} = (\\text{page\\_id}, \\text{slot\\_id})$$\n\n```mermaid\nflowchart TD\n    subgraph HeapRelation[\"HeapFile (.db)\"]\n        subgraph Page0[\"Page 0\"]\n            LP1[\"Slot 1 Line Pointer\"] --> T1[\"Tuple (0, 1)\\n[xmin=1, xmax=0]\"]\n            LP2[\"Slot 2 Line Pointer\"] --> T2[\"Tuple (0, 2)\\n[xmin=2, xmax=0]\"]\n        end\n        subgraph Page1[\"Page 1\"]\n            LP3[\"Slot 1 Line Pointer\"] --> T3[\"Tuple (1, 1)\\n[xmin=3, xmax=0]\"]\n        end\n    end\n\n    CTID_A[\"CTID (0, 1)\"] --> LP1\n    CTID_B[\"CTID (1, 1)\"] --> LP3\n```\n\n---\n\n## 2. Invariants & Binary Layout\n\n1. **TupleHeader Structure (16 Bytes — PostgreSQL uses 23)** (`[include/pg/tuple.h:42-47]`):\n   - `xmin` (4 Bytes): Transaction ID that inserted this row version.\n   - `xmax` (4 Bytes): Transaction ID that deleted or updated this row version (`0` if currently live).\n   - `t_ctid` (6 Bytes): Forward pointer `CTID {page, slot}` to the newest row version (or self-reference `(page, slot)` if newest). **Exact match** for PostgreSQL's `ItemPointerData` (4-byte block id + 2-byte offset).\n   - `infomask` (2 Bytes): Status flags — see the correction in invariant 2.\n\n   PostgreSQL's `HeapTupleHeaderData` is **23 bytes** before the null bitmap, MAXALIGNed to 24 in practice:\n\n   | Field | Size | Present here? |\n   |---|---|---|\n   | `t_choice` union — `t_xmin`, `t_xmax`, then `t_cid`/`t_xvac` | 12 B | partly (no `t_cid`) |\n   | `t_ctid` | 6 B | yes |\n   | `t_infomask2` | 2 B | **no** |\n   | `t_infomask` | 2 B | merged into one 16-bit word |\n   | `t_hoff` | 1 B | **no** |\n   | `t_bits[]` null bitmap | variable | **no** |\n\n   `t_cid` carries correctness this engine does not reach: it is the *command id*, which is what stops a statement from seeing rows it inserted itself within the same transaction.\n\n2. **Infomask correction.** This engine packs three flags into one `infomask` word. In PostgreSQL those flags live in two different words, and one of the three values is not PostgreSQL's:\n\n   | Flag | cpp-postgres | PostgreSQL | PostgreSQL field |\n   |---|---|---|---|\n   | `HEAP_HASEXTERNAL` | `0x2000` | **`0x0004`** | `t_infomask` |\n   | `HEAP_HOT_UPDATED` | `0x4000` | `0x4000` ✅ | **`t_infomask2`** |\n   | `HEAP_ONLY_TUPLE` | `0x8000` | `0x8000` ✅ | **`t_infomask2`** |\n\n   `0x2000` in PostgreSQL's `t_infomask` is `HEAP_UPDATED` (\"this tuple is the product of an UPDATE\"), an unrelated flag. The values chosen here are internally consistent but are not PostgreSQL's bit assignments.\n\n   PostgreSQL additionally uses `t_infomask` for the **hint bits** `HEAP_XMIN_COMMITTED (0x0100)`, `HEAP_XMIN_INVALID (0x0200)`, `HEAP_XMAX_COMMITTED (0x0400)`, `HEAP_XMAX_INVALID (0x0800)` — a per-tuple cache of the CLOG answer, so a repeated visibility test costs zero CLOG page reads. This engine has no hint bits and consults CLOG every time (Item 13).\n\n3. **Physical Tuple Capacity Derivation**:\n   For an 8KB page with 18-byte page header and 24-byte serialized heap tuples (16B header + 8B data `item_id + price`), the maximum row capacity per page is:\n   $$\\text{Max Tuples Per Page} = \\left\\lfloor \\frac{8192 - 18}{24 + 4} \\right\\rfloor = \\left\\lfloor \\frac{8174}{28} \\right\\rfloor = 291 \\text{ tuples}$$\n\n   By coincidence this equals PostgreSQL's `MaxHeapTuplesPerPage`, which reaches 291 by different arithmetic:\n   $$\\left\\lfloor \\frac{8192 - 24}{\\text{MAXALIGN}(23) + 4} \\right\\rfloor = \\left\\lfloor \\frac{8168}{28} \\right\\rfloor = 291$$\n   In PostgreSQL 291 is a hard structural ceiling on line pointers per heap page, not merely the capacity for one particular row width.\n\n---\n\n## 3. Class Diagram: HeapFile & Pager Relationship\n\n```mermaid\nclassDiagram\n    class HeapFile {\n        -unique_ptr~Pager~ pager_\n        -BufferPoolManager* bpm_\n        +insert(record, xmin) CTID\n        +update(old_ctid, record, tx_id) CTID\n        +delete_tuple(target_ctid, tx_id) bool\n        +get(ctid) optional~HeapTuple~\n        +seq_scan() vector~pair~CTID, HeapTuple~~\n        +num_pages() size_t\n    }\n    class Pager {\n        -fstream file_\n        -size_t num_pages_\n        +read_page(page_id, buffer)\n        +write_page(page_id, buffer)\n    }\n    class Page {\n        -uint8_t* data_\n        +header() PageHeader&\n        +insert_tuple(data, len) slot_id_t\n        +get_tuple_ptr(slot_id, out_len) uint8_t*\n    }\n\n    HeapFile *-- Pager\n    HeapFile ..> Page : instantiates\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| CTID = (block, offset), 6 bytes, offsets 1-based | **Exact** (`ItemPointerData`) |\n| `t_ctid` self-references on the newest version, forward-points on update | **Exact** |\n| `xmin` / `xmax` are 4-byte XIDs at the head of the tuple header | **Exact** |\n| Tuple header is 16 bytes | **Simplified** — PostgreSQL is 23 B (`t_cid`, `t_infomask2`, `t_hoff`, `t_bits` omitted) |\n| `HEAP_HASEXTERNAL = 0x2000` | **Wrong for PostgreSQL** — real value is `0x0004`; `0x2000` is `HEAP_UPDATED` |\n| `HEAP_HOT_UPDATED` / `HEAP_ONLY_TUPLE` live in `infomask` | **Wrong field** — PostgreSQL stores both in `t_infomask2` |\n| 291 tuples per page | **Coincidentally exact** — matches `MaxHeapTuplesPerPage` |\n| `xmax == 0` means live | **Simplified** — PostgreSQL also writes `xmax` for row *locks* (`HEAP_XMAX_LOCK_ONLY`) and for `MultiXactId`s, neither of which deletes the row |\n"},{"path":"04-mvcc-and-snapshots.md","title":"Item 4: MVCC & Transaction Snapshot Visibility","md":"# Item 4: MVCC & Transaction Snapshot Visibility\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/tx.h:1-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/tx.h), [include/pg/mvcc.h:1-45](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/mvcc.h), [src/tx.cpp:1-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/tx.cpp), [src/mvcc.cpp:1-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/mvcc.cpp), [tests/test_mvcc.cpp:1-135](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_mvcc.cpp)\n\n---\n\n## 1. Multi-Version Concurrency Control (MVCC) Overview\n\nPostgreSQL implements multi-version concurrency control using row-version header stamps (`xmin` and `xmax`). Readers never block writers, and writers never block readers.\n\nTwo clarifications the rest of this chapter depends on:\n\n- **Snapshot Isolation is not the default.** PostgreSQL's default isolation level is **Read Committed**, which takes a *fresh snapshot at the start of every statement*. Snapshot Isolation in the textbook sense (one snapshot for the whole transaction) is PostgreSQL's `REPEATABLE READ`. `SERIALIZABLE` layers Serializable Snapshot Isolation (SSI) predicate-lock tracking on top of that. `cpp-postgres` implements exactly one model — one snapshot per transaction — which corresponds to `REPEATABLE READ`.\n- **A snapshot's `xmin` does not mean \"everything below is committed.\"** It means everything below is *finished* — committed **or** aborted. Whether a sub-`xmin` transaction committed still has to be answered from CLOG (Item 13). PostgreSQL's own comment on `SnapshotData` is that XIDs `< xmin` are \"visible to the snapshot\" only in the sense that no further in-progress test is needed.\n\n```mermaid\nflowchart TD\n    subgraph TransactionTimeline[\"Transaction Horizon\"]\n        XMIN[\"xmin (Lowest Still-Running Tx ID)\\nAll Tx < xmin are FINISHED\\n(committed OR aborted - ask CLOG)\"]\n        ACTIVE[\"Active In-Flight Transactions\\n(active_txs set)\"]\n        XMAX[\"xmax (Next Tx ID Counter)\\nAll Tx >= xmax are in the FUTURE\"]\n    end\n\n    V1[\"Tuple A\\n[xmin=5, xmax=0]\"] -->|xmin < Snapshot.xmax & committed| VISIBLE[\"VISIBLE to Reader\"]\n    V2[\"Tuple B\\n[xmin=15, xmax=0]\"] -->|xmin in active_txs or >= xmax| INVISIBLE[\"INVISIBLE to Reader\"]\n```\n\n---\n\n## 2. Invariants & Visibility State Machine\n\nA tuple version is visible to a `Snapshot` if and only if **both** of the following conditions hold (`[src/mvcc.cpp:25]`):\n\n0. **Preliminary**: this engine evaluates every `xmin`/`xmax` by calling into CLOG. PostgreSQL first checks the tuple's **hint bits** (`HEAP_XMIN_COMMITTED`, `HEAP_XMAX_INVALID`, …) and only falls back to CLOG on a miss, then writes the answer back into the tuple header. That write is why a pure `SELECT` can dirty pages in PostgreSQL — a behaviour this engine does not exhibit.\n\n1. **Creation Visibility (`xmin`)**:\n   - `xmin == snapshot.current_tx_id` (created by current tx), OR\n   - (`xmin < snapshot.xmax` AND `xmin` is NOT in `snapshot.active_txs` AND `status(xmin) == COMMITTED`).\n2. **Deletion Invisibility / Retention (`xmax`)**:\n   A tuple remains visible regarding its deletion state if:\n   - `xmax == 0` (never deleted or updated), OR\n   - `status(xmax) == ABORTED` (deleter transaction rolled back), OR\n   - `status(xmax) == IN_PROGRESS` (deleter transaction is still running concurrently), OR\n   - `xmax >= snapshot.xmax` (deleted in the future after this snapshot was taken), OR\n   - `xmax` IS in `snapshot.active_txs` (deleter was in-flight when snapshot started).\n   *(Note: If `xmax == snapshot.current_tx_id`, the deletion was executed by the current transaction itself, making the tuple invisible).*\n\n   **Where PostgreSQL is harder than this.** The rule above assumes `xmax != 0` means \"deleted or updated\". In PostgreSQL `xmax` is overloaded:\n   - `HEAP_XMAX_LOCK_ONLY (0x0080)` — `xmax` records a row **lock** (`SELECT … FOR UPDATE/SHARE`), not a deletion. The row is still live.\n   - `HEAP_XMAX_IS_MULTI (0x1000)` — `xmax` is a `MultiXactId`, a handle for *several* transactions locking the same row, resolved through the `pg_multixact` SLRUs.\n   - `t_cid` and `HEAP_COMBOCID (0x0020)` — within one transaction, a row inserted by command 1 must be invisible to command 1 itself but visible to command 2. This engine has no command ids, so intra-transaction statement ordering is not modelled.\n\n   PostgreSQL's real implementation lives in `HeapTupleSatisfiesMVCC()` in `heapam_visibility.c`, and it is roughly 150 lines of exactly these special cases.\n\n---\n\n## 3. Sequence Diagram: Concurrent MVCC Reads and Writes\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Tx1 as Tx 1 (Writer)\n    participant Tx2 as Tx 2 (Reader)\n    participant Heap as Heap Storage\n    participant TM as Transaction Manager\n\n    Tx1->>TM: begin_transaction() -> TxID: 10\n    Tx2->>TM: begin_transaction() -> TxID: 11\n    Tx2->>TM: take_snapshot(11) -> Snapshot (xmin 10, xmax 12, active: 10)\n\n    Tx1->>Heap: insert(Item 100, xmin=10) -> Stored at (0, 1)\n    Tx2->>Heap: seq_scan(snapshot_11)\n    Note over Tx2,Heap: Reads (0, 1) [xmin=10].<br/>10 is in active_txs -> INVISIBLE!\n    Heap-->>Tx2: 0 rows returned\n\n    Tx1->>TM: commit(10)\n    Note over Tx1,TM: Tx 1 marked COMMITTED in CLOG.\n\n    participant Tx3 as Tx 3 (New Reader)\n    Tx3->>TM: take_snapshot(12) -> Snapshot (xmin 12, xmax 13, active: none)\n    Tx3->>Heap: seq_scan(snapshot_12)\n    Note over Tx3,Heap: Reads (0, 1) [xmin=10].<br/>10 < xmin (12) and COMMITTED -> VISIBLE!\n    Heap-->>Tx3: 1 row returned (Item 100)\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| MVCC via `xmin`/`xmax` stamps; readers do not block writers | **Exact** |\n| Snapshot = (xmin, xmax, active_txs) triple | **Exact** — PostgreSQL's `SnapshotData` is `xmin`, `xmax`, `xip[]` |\n| Visibility = \"created by a committed, non-concurrent tx AND not deleted by one\" | **Exact in shape** |\n| \"PostgreSQL implements Snapshot Isolation\" | **Corrected** — that is `REPEATABLE READ`; the default is Read Committed, one snapshot *per statement* |\n| \"All Tx < snapshot.xmin are COMMITTED\" | **Corrected** — they are *finished*; committed vs aborted still comes from CLOG |\n| CLOG consulted on every visibility test | **Simplified** — PostgreSQL short-circuits through hint bits first |\n| `xmax != 0` implies deleted/updated | **Simplified** — PostgreSQL also uses `xmax` for row locks and MultiXactIds |\n| No command-id (`t_cid`) handling | **Missing** — affects visibility *within* a single transaction |\n| No XID freezing / wraparound handling | **Missing** — PostgreSQL must freeze `xmin` before the 32-bit XID space wraps, or refuse writes |\n\n### Implementation status (2026-08-27)\n\nTransaction state now lives in a `Session`, one per connection, so two clients no\nlonger share a transaction and two snapshots can coexist — which is the situation\nthese visibility rules exist for. `TransactionManager` publishes each running\ntransaction's snapshot xmin (PostgreSQL's `PGPROC.xmin`) so the VACUUM horizon is\ncomputed from snapshots rather than transaction ids.\n\nA `LockManager` serialises writers on the same row. MVCC keeps readers out of the\nway, but two transactions updating one row must not both succeed; with a\nsingle-threaded executor there is nobody to wait for, so the conflict is reported\nrather than silently losing the first write.\n\nStill missing: command ids (`t_cid`), hint bits, MultiXacts, XID freezing.\n"},{"path":"05-vacuum-engine.md","title":"Item 5: VACUUM Engine & In-Place Page Defragmentation","md":"# Item 5: VACUUM Engine & In-Place Page Defragmentation\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/vacuum.h:1-35](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/vacuum.h), [src/vacuum.cpp:1-120](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/vacuum.cpp), [tests/test_vacuum.cpp:1-115](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_vacuum.cpp)\n\n---\n\n## 1. Dead Tuple Reclamation Mechanics\n\nWhen rows are updated or deleted under MVCC, old tuple versions become **dead** once their `xmax` falls below the oldest snapshot that could still see them — PostgreSQL's `OldestXmin`, computed across every backend and replication slot in the cluster:\n\n$$\\text{Dead Condition: } (\\text{xmax} > 0) \\ \\land \\ (\\text{status}(\\text{xmax}) = \\text{COMMITTED}) \\ \\land \\ (\\text{xmax} < \\text{oldest\\_active\\_xmin})$$\n\n```mermaid\nflowchart TD\n    subgraph SlottedPageDefrag[\"In-Place Page Compaction\"]\n        BEFORE[\"Before VACUUM:\\n[Slot 1: LIVE @ 8168]\\n[Slot 2: DEAD @ 8144]\\n[Slot 3: LIVE @ 8120]\\npd_upper = 8120 (Fragmented)\"]\n        PROCESS[\"VACUUM Pass:\\n1. Mark Slot 2 UNUSED (offset=0, len=0)\\n2. Shift Slot 3 data up to 8144\\n3. Update Slot 3 LinePointer offset\\n4. Set pd_upper = 8144 (Reclaimed 24B)\"]\n        AFTER[\"After VACUUM:\\n[Slot 1: LIVE @ 8168]\\n[Slot 2: UNUSED]\\n[Slot 3: LIVE @ 8144]\\npd_upper = 8144 (Contiguous Free Space)\"]\n    end\n\n    BEFORE --> PROCESS --> AFTER\n```\n\n---\n\n## 2. Invariants & CTID Stability\n\n1. **CTID Slot Stability**: VACUUM never shifts or renumbers existing `slot_id` line pointer indexes. Slot 3 remains `(page, 3)`, guaranteeing that foreign references and secondary index entries are not corrupted (`[src/page.cpp:125]`).\n2. **Compact Contiguous Allocation**: Surviving tuple payloads are slid upward towards the end of the 8KB page (`PAGE_SIZE = 8192`), coalescing all freed memory into a single contiguous block between `pd_lower` and `pd_upper`.\n\n---\n\n## 3. Sequence Diagram: Vacuum Page Lifecycle\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Admin as Maintenance Coordinator\n    participant Vac as VacuumEngine (src/vacuum.cpp)\n    participant TM as TransactionManager\n    participant Heap as Heap Storage\n    participant Page as Slotted Page (RAM)\n\n    Admin->>Vac: vacuum(heap, tm)\n    Vac->>TM: oldest_active_xmin() -> Cutoff XID (e.g. 50)\n    loop For each page_id in 0 .. num_pages-1\n        Vac->>Heap: read_page(page_id, page_buf)\n        loop For each slot_id in 1 .. num_slots\n            Vac->>Page: check tuple header (xmin, xmax)\n            alt xmax != 0 and xmax < cutoff and committed\n                Vac->>Page: mark line_pointer[slot_id] = UNUSED\n            end\n        end\n        Vac->>Page: compact_and_defragment()\n        Vac->>Heap: write_page(page_id, page_buf)\n    end\n    Vac-->>Admin: VacuumResult (reclaimed_tuples, reclaimed_bytes, pages_vacuumed)\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n### 4.1 VACUUM is three phases in PostgreSQL, not one\n\nThe single-pass loop diagrammed above — *see a dead tuple, mark its line pointer `UNUSED`, defragment* — is only correct for a **table with no indexes**. As soon as an index exists, marking a slot `UNUSED` immediately would leave index entries pointing at a slot that a later insert can reuse, and the index would silently return the wrong row.\n\nPostgreSQL therefore splits the work:\n\n```mermaid\nflowchart TD\n    P1[\"Phase 1: Heap scan\\n- find dead tuples\\n- set lp_flags = LP_DEAD\\n- record their TIDs in the dead-TID store\\n- opportunistic HOT prune\"]\n    P2[\"Phase 2: Index vacuum\\n- for every index, remove all entries\\n  whose TID is in the dead-TID list\\n- ambulkdelete / amvacuumcleanup\"]\n    P3[\"Phase 3: Heap cleanup pass\\n- now safe: LP_DEAD to LP_UNUSED\\n- PageRepairFragmentation\\n- update free space map + visibility map\"]\n    P1 --> P2 --> P3\n    P3 -.->|dead-TID store full? loop again| P1\n```\n\n`LP_DEAD -> LP_UNUSED` only becomes legal *after* every index has been cleaned. When the dead-TID store fills up, PostgreSQL runs phases 2 and 3 and then resumes phase 1 — a large VACUUM can cycle several times.\n\n### 4.2 What else PostgreSQL's VACUUM does\n\n- **Freezing.** The primary reason VACUUM is mandatory, not optional. XIDs are 32-bit and wrap; VACUUM rewrites old `xmin` values as frozen (via `HEAP_XMIN_FROZEN` hint bits) so that ancient rows stay visible after wraparound. Left unrun long enough, PostgreSQL refuses new writes. **Not modelled here at all.**\n- **Visibility map.** Two bits per heap page (`all-visible`, `all-frozen`) maintained by VACUUM. This is what makes index-only scans and page-skipping possible. **Not modelled.**\n- **Free space map.** A separate `_fsm` fork recording per-page free space so inserts can find a home without scanning. **Not modelled** — this engine appends or scans linearly.\n- **Truncation.** VACUUM can return trailing all-empty pages to the OS; otherwise space is reused inside the relation, never handed back. **Not modelled.**\n- **HOT pruning happens outside VACUUM.** `heap_page_prune_opt()` runs during ordinary page access, guarded by the `pd_prune_xid` hint (Item 2). Most dead-tuple cleanup in a healthy PostgreSQL is done by SELECTs, not by VACUUM.\n- **`VACUUM` vs `VACUUM FULL`.** Plain VACUUM defragments in place, exactly as modelled here. `VACUUM FULL` rewrites the entire relation into a new file and takes an `ACCESS EXCLUSIVE` lock — a different algorithm.\n- **Autovacuum.** A launcher plus worker processes driven by dead-tuple thresholds. This engine vacuums only on explicit command.\n\n### 4.3 Verdict table\n\n| Claim | Verdict |\n|---|---|\n| Dead = `xmax` committed and below the global oldest xmin | **Exact** in principle (`OldestXmin`) |\n| VACUUM never renumbers slot ids, preserving CTID stability for indexes | **Exact** — this is the core invariant PostgreSQL relies on |\n| Surviving tuples slide toward the page end, coalescing free space | **Exact** — `PageRepairFragmentation()` |\n| One pass, dead tuple straight to `UNUSED` | **Divergent** — safe only without indexes; PostgreSQL needs `LP_DEAD` -> index vacuum -> `LP_UNUSED` |\n| Freezing / wraparound, visibility map, FSM, truncation, autovacuum | **Missing** |\n\n### Implementation status (2026-08-27)\n\nVACUUM is now the three-phase algorithm described above, not a single pass:\n\n1. scan the heap, flag dead tuples `LP_DEAD`, collect their TIDs\n2. remove every index entry pointing at a collected TID\n3. demote `LP_DEAD` to `LP_UNUSED`, then compact\n\nA dead HOT chain root becomes `LP_REDIRECT` rather than being freed, so the index\nentry that points at it keeps working while the tuple bytes go away — and index\nscans follow the redirect via `HeapFile::hot_search`.\n\nIt also runs through the buffer pool. Reading the relation directly while every\nother subsystem went through the pool meant VACUUM acted on stale pages and its\nwork was later overwritten by whichever cached frame flushed last.\n\nStill missing: freezing and wraparound handling, the visibility map, the free\nspace map fork, relation truncation, autovacuum.\n"},{"path":"06-secondary-btree-index.md","title":"Item 6: Secondary B-Tree Index Subsystem","md":"# Item 6: Secondary B-Tree Index Subsystem\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/btree.h:1-69](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/btree.h), [src/btree.cpp:1-85](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/btree.cpp), [tests/test_index.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_index.cpp)\n\n---\n\n## 1. Index Decoupling & Multi-Version Addressing\n\n> **Implementation status.** `Engine` originally used the in-memory `BTreeIndex` multimap shown in this chapter, rebuilding it by full sequential scan of the heap on startup. Following the architecture audit (Finding 2.3), `Engine` was rewired to use `DiskBTree` (Chapter 14) directly via the abstract `Index` interface (`include/pg/index.h`), achieving on-disk persistence, buffer pool caching, VACUUM index pruning, and $O(1)$ startup.\n\nIn PostgreSQL, **every** index is a secondary index — there is no clustered/primary storage — and an index entry maps a key to a heap $\\text{CTID}$. Critically, an index tuple carries **no MVCC header**: no `xmin`, no `xmax`. This is the property that forces the heap dereference in §2.\n\nTwo corrections to the stronger form of that claim:\n\n- Index tuples **do** have a header. PostgreSQL's `IndexTupleData` is 8 bytes: `t_tid` (6 B, the heap CTID) plus `t_info` (2 B, holding the tuple size, a `INDEX_VAR_MASK` bit, and `INDEX_NULL_MASK`). When `INDEX_NULL_MASK` is set, a **null bitmap follows** — so index tuples do store null bitmaps, they just do not store visibility information.\n- Index tuples **can** store extra columns. `CREATE INDEX … INCLUDE (cols)` (covering indexes, v11+) stores non-key payload columns in the leaf tuples specifically so that index-only scans can answer without touching the heap.\n\n```mermaid\nflowchart LR\n    subgraph SecondaryIndex[\"B-Tree Index Map\"]\n        K100[\"Key 100\"] --> CTID_1[\"CTID (0, 1)\"]\n        K100 --> CTID_2[\"CTID (0, 2)\"]\n        K200[\"Key 200\"] --> CTID_3[\"CTID (0, 3)\"]\n    end\n\n    subgraph HeapTable[\"Physical Heap Pages\"]\n        H1[\"Tuple (0, 1)\\n[xmin=1, xmax=2] (DEAD)\"]\n        H2[\"Tuple (0, 2)\\n[xmin=2, xmax=0] (LIVE)\"]\n        H3[\"Tuple (0, 3)\\n[xmin=3, xmax=0] (LIVE)\"]\n    end\n\n    CTID_1 --> H1\n    CTID_2 --> H2\n    CTID_3 --> H3\n```\n\n---\n\n## 2. Invariants & Lookup Pipeline\n\n1. **Multi-Version Key Duplication**: Because updates create new row versions at new physical CTIDs without deleting the old version, a single index key can map to multiple candidate CTIDs simultaneously (`[src/btree.cpp:22]`).\n2. **Mandatory Heap MVCC Dereference**: The index lookup returns candidate CTIDs. The database must dereference each CTID against the physical Heap and evaluate snapshot visibility rules before returning tuples to the query caller (`[src/engine.cpp:140]`).\n\n---\n\n## 3. Sequence Diagram: Index Point Scan\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant SQL as SQL Query Engine\n    participant Idx as B-Tree Index (src/btree.cpp)\n    participant Heap as Heap Storage (src/heap.cpp)\n    participant MVCC as MVCC Evaluator (src/mvcc.cpp)\n\n    SQL->>Idx: find_entries(item_id = 100)\n    Idx-->>SQL: [ (0, 1), (0, 2) ] (Candidate CTIDs)\n\n    loop For each candidate CTID\n        SQL->>Heap: get(CTID)\n        Heap-->>SQL: HeapTuple (header, data)\n        SQL->>MVCC: is_visible(tuple.header, snapshot)\n        alt Visible\n            MVCC-->>SQL: true (Return tuple to client)\n        else Invisible (Dead or Future version)\n            MVCC-->>SQL: false (Skip candidate)\n        end\n    end\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| Index maps key -> CTID; the heap is the only source of row data | **Exact** |\n| Index tuples carry no `xmin`/`xmax`, so every hit needs a heap visibility check | **Exact** — the defining property of PostgreSQL's index design |\n| One key can map to several CTIDs because updates create new versions | **Exact** |\n| \"Index does not store null bitmaps\" | **Corrected** — `IndexTupleData.t_info` has `INDEX_NULL_MASK` and a null bitmap follows when set |\n| \"Index does not store row columns\" | **Corrected for modern PostgreSQL** — `INCLUDE` columns are stored in leaf tuples |\n\n### Mechanisms PostgreSQL adds that this engine does not model\n\n- **Index-only scans.** If the visibility map says every tuple on the target heap page is all-visible, PostgreSQL skips the heap fetch entirely and answers from the index tuple. Without a visibility map (Item 5) this engine can never do that — the heap dereference in §2 is genuinely mandatory *here*, but only usually mandatory in PostgreSQL.\n- **`kill_prior_tuple` / `LP_DEAD` index hints.** When an index scan dereferences a CTID and finds the tuple dead to everyone, it flags that index entry `LP_DEAD` so later scans skip it without a heap read, and so the page can be cleaned without a full index vacuum.\n- **B-tree deduplication (v13+).** Repeated keys are folded into a single *posting list* tuple holding a sorted TID array, which dramatically shrinks indexes on low-cardinality columns. In this engine every duplicate key costs a full entry.\n- **Bitmap index scans.** For a wide match set the planner collects TIDs into a bitmap, sorts by physical page, and scans the heap in page order to convert random I/O into sequential I/O. This engine always does one random heap fetch per candidate.\n- **Other access methods.** GiST, GIN, SP-GiST, BRIN and hash all exist behind the same `Key -> CTID` contract.\n"},{"path":"07-heap-only-tuples.md","title":"Item 7: Heap-Only Tuples (HOT) & Update Chains","md":"# Item 7: Heap-Only Tuples (HOT) & Update Chains\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/heap.h:40-50](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/heap.h), [src/heap.cpp:115-180](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/heap.cpp), [tests/test_hot.cpp:1-130](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_hot.cpp)\n\n---\n\n## 1. The Write-Amplification Problem & HOT Solution\n\nIn standard MVCC, updating an unindexed column (e.g. `UPDATE items SET price = 20 WHERE item_id = 100;`) forces a new entry into every secondary index on the table, leading to severe **index bloat**.\n\n**Heap-Only Tuples (HOT)** eliminates all secondary index writes when:\n1. No indexed column of **any** index on the table is modified by the update.\n2. The new tuple version fits onto the **same 8KB page** as the old version.\n\nBoth conditions are PostgreSQL's, exactly. Condition 2 is why `fillfactor` matters: lowering it below 100 reserves free space on each page at load time specifically to keep future updates HOT-eligible. Condition 1 is evaluated against the *union* of all indexed columns, which is why adding one index on a hot-updated column can collapse HOT for the whole table.\n\n```mermaid\nflowchart LR\n    subgraph BTree[\"Secondary Index (Root Entry)\"]\n        IDX[\"Key 100\\nPoints to -> (Page 0, Slot 1) ONLY\"]\n    end\n\n    subgraph Page0[\"Same 8KB Slotted Page (Page 0)\"]\n        LP1[\"Slot 1 Line Pointer\\nFlags: NORMAL\"] --> T1[\"Tuple (0, 1)\\n[infomask: HEAP_HOT_UPDATED]\\n[t_ctid -> (0, 2)]\"]\n        LP2[\"Slot 2 Line Pointer\\nFlags: NORMAL\"] --> T2[\"Tuple (0, 2)\\n[infomask: HEAP_ONLY_TUPLE]\\n[price: 20, t_ctid -> (0, 2)]\"]\n    end\n\n    IDX --> LP1\n    T1 -.->|HOT Chain Pointer| LP2\n```\n\n---\n\n## 2. Invariants & Infomask Flags\n\n1. **`HEAP_HOT_UPDATED` (`0x4000`)**: Stamped on the old tuple version. Indicates that the next version in the update chain resides on this exact same page (`[include/pg/tuple.h:51]`). *The value matches PostgreSQL, but PostgreSQL stores it in `t_infomask2`, not `t_infomask` — this engine has only one infomask word (Item 3).*\n2. **`HEAP_ONLY_TUPLE` (`0x8000`)**: Stamped on the newly created tuple version. Tells the engine that no index pointer references this tuple directly; it can only be reached by following the HOT chain from the root line pointer (`[include/pg/tuple.h:52]`). *Same note: `t_infomask2` in PostgreSQL.*\n3. **`ItemFlags::REDIRECT`**: When pruning removes the dead root tuple's data, it converts Slot 1's line pointer into a redirect (`lp_flags = REDIRECT, lp_offset = slot_2`), preserving index stability with zero tuple bytes. **This is exactly PostgreSQL's `LP_REDIRECT`**, and it is the reason the root line pointer of a HOT chain can never be reused: the index still points at it.\n4. **Pruning is not VACUUM.** In PostgreSQL, HOT chain collapsing is done by `heap_page_prune_opt()` during ordinary page access — including plain `SELECT`s — guarded by the `pd_prune_xid` page-header hint (Item 2). VACUUM also prunes, but it is not the primary mechanism. Because this engine has no `pd_prune_xid` and no opportunistic prune path, HOT chains here are only collapsed by an explicit `VACUUM`.\n\n---\n\n## 3. Sequence Diagram: HOT Chain Traversal\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as Query Engine\n    participant BTree as B-Tree Index\n    participant Page as Page 0 (Shared Buffers)\n\n    Client->>BTree: find_entries(100) -> Root CTID: (0, 1)\n    Client->>Page: fetch_tuple((0, 1))\n    Page-->>Client: Tuple 1 [xmin=1, xmax=2, flags: HEAP_HOT_UPDATED, t_ctid: (0, 2)]\n    Note over Client: Tuple 1 is DEAD under current snapshot.<br/>Has HEAP_HOT_UPDATED -> Follow t_ctid!\n    Client->>Page: fetch_tuple((0, 2))\n    Page-->>Client: Tuple 2 [xmin=2, xmax=0, flags: HEAP_ONLY_TUPLE, price: 20]\n    Note over Client: Tuple 2 is LIVE -> Return price 20!\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| HOT applies when no indexed column changes and the new version fits on the same page | **Exact** |\n| Old version gets `HEAP_HOT_UPDATED`, new version gets `HEAP_ONLY_TUPLE` | **Exact** (values `0x4000` / `0x8000` are PostgreSQL's) |\n| `t_ctid` links the chain forward within the page | **Exact** |\n| Index keeps pointing only at the root line pointer | **Exact** |\n| Pruning converts the root line pointer to `LP_REDIRECT` | **Exact** |\n| Those flags live in `infomask` | **Wrong field** — PostgreSQL puts both in `t_infomask2` |\n| Pruning happens in VACUUM | **Incomplete** — PostgreSQL prunes opportunistically on page access via `heap_page_prune_opt()` |\n| No `fillfactor` control | **Missing** — the main knob DBAs use to keep updates HOT |\n| HOT chain cannot span pages | **Exact** — an update that must move to another page falls back to a normal update plus index insert |\n"},{"path":"08-shared-buffers-and-clock-sweep.md","title":"Item 8: Shared Buffers & Clock-Sweep Replacement","md":"# Item 8: Shared Buffers & Clock-Sweep Replacement\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/buffer_pool.h:1-75](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/buffer_pool.h), [src/buffer_pool.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/buffer_pool.cpp), [tests/test_buffer_pool.cpp:1-120](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_buffer_pool.cpp)\n\n---\n\n## 1. Buffer Pool Manager (Shared Buffers) Architecture\n\n`BufferPoolManager` maintains a configurable pool of in-memory frames (defaulting to **16 frames**, each exactly 8,192 bytes) acting as an LRU-approximation cache between the execution engine and physical disk files.\n\nPostgreSQL's equivalent is `shared_buffers`, defaulting to **128 MB = 16,384 buffers**. Sixteen frames here is a teaching size chosen so that eviction is observable in the GUI after a handful of inserts.\n\n```mermaid\nflowchart TD\n    subgraph RAM[\"RAM: Buffer Pool Manager (16 Frames)\"]\n        F0[\"Frame 0\\n[Page 0, pin=1, dirty=1, use=3]\"]\n        F1[\"Frame 1\\n[Page 5, pin=0, dirty=0, use=0]\"]\n        F2[\"Frame 2\\n[Page 2, pin=0, dirty=1, use=2]\"]\n        FN[\"Frame 15\\n[Page 9, pin=2, dirty=0, use=1]\"]\n    end\n\n    subgraph ClockSweep[\"PostgreSQL Clock-Sweep Hand\"]\n        HAND[\"Clock Hand (frame_id)\"] -->|Checks pin & usage| F1\n    end\n\n    subgraph Disk[\"Physical Disk File\"]\n        DISK_P[\"Heap / B-Tree Pages (.db)\"]\n    end\n\n    F1 -->|If dirty, flush before reuse| DISK_P\n```\n\n---\n\n## 2. Invariants & Clock-Sweep State Machine\n\n1. **Pin Count Protection (`pin_count > 0`)**: Any frame currently pinned by an active query worker is immediately skipped by the clock-sweep hand; it can **never** be evicted while in use (`[src/buffer_pool.cpp:85]`).\n2. **Second-Chance Algorithm (`usage_count`)**:\n   - If `pin_count == 0` and `usage_count > 0`, the clock hand decrements `usage_count--` and advances to the next frame.\n   - If `pin_count == 0` and `usage_count == 0`, the frame is selected as the eviction victim.\n\n   PostgreSQL's `StrategyGetBuffer()` is the same algorithm with one bound this engine lacks: `usage_count` saturates at **`BUF_USAGECOUNT_MAX = 5`**. Without a cap, a page touched ten thousand times would need ten thousand hand passes to become evictable, and the sweep degenerates. PostgreSQL also consults a **freelist** of never-used or explicitly freed buffers *before* starting the sweep.\n3. **Dirty Writeback Before Eviction**: If the victim frame has `is_dirty == true`, it is written to disk via `Pager::write_page()` before being repurposed for the new page.\n4. **WAL Ordering Applies to Eviction Too**: PostgreSQL's `FlushBuffer()` calls `XLogFlush(page.pd_lsn)` *before* the write, so evicting a dirty buffer can force a WAL flush. This is the same invariant as Item 9, enforced at the eviction site.\n\n---\n\n## 3. Sequence Diagram: Page Fetch & Eviction Lifecycle\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Subsystem as Engine / Heap / Index\n    participant BPM as BufferPoolManager (src/buffer_pool.cpp)\n    participant Disk as Physical Disk (Pager)\n\n    Subsystem->>BPM: fetch_page(page_id = 42)\n    alt Page 42 already resident in RAM (Cache Hit)\n        BPM->>BPM: frame.pin_count++<br/>frame.usage_count++\n        BPM-->>Subsystem: uint8_t* (Memory pointer to 8KB frame)\n    else Cache Miss (All 16 frames occupied)\n        loop Clock-Sweep Eviction Search\n            BPM->>BPM: Check frame at clock_hand_\n            alt pin_count > 0\n                BPM->>BPM: Skip frame (in use)\n            else pin_count == 0 and usage_count > 0\n                BPM->>BPM: usage_count-- (Second chance granted)\n            else pin_count == 0 and usage_count == 0\n                BPM->>BPM: VICTIM IDENTIFIED!\n            end\n            BPM->>BPM: clock_hand_ = (clock_hand_ + 1) % 16\n        end\n        alt Victim frame is dirty\n            BPM->>Disk: write_page(old_page_id, frame.data)\n        end\n        BPM->>Disk: read_page(42, frame.data)\n        BPM->>BPM: Update page_table_[42] = victim_frame<br/>frame.pin_count = 1<br/>frame.usage_count = 1\n        BPM-->>Subsystem: uint8_t* (Pointer to frame)\n    end\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| Fixed array of 8KB frames, hash table from page id to frame | **Exact** (`BufferDesc` array + `SharedBufHash`) |\n| Clock-sweep with pin count and usage count | **Exact** (`StrategyGetBuffer`) |\n| Pinned buffers are never evicted | **Exact** |\n| Dirty victim is written before reuse | **Exact** |\n| 16 frames | **Teaching size** — PostgreSQL defaults to 16,384 (128 MB) |\n| `usage_count` unbounded | **Divergent** — PostgreSQL caps at `BUF_USAGECOUNT_MAX = 5` |\n| Sweep starts immediately on miss | **Simplified** — PostgreSQL checks the freelist first |\n| No WAL flush on eviction | **Divergent** — PostgreSQL's `FlushBuffer()` calls `XLogFlush()` first |\n\n### Not modelled\n\n- **Buffer access strategies (ring buffers).** Sequential scans of large tables, `COPY`, `CREATE TABLE AS` and VACUUM each run inside a small ring (`BufferAccessStrategy`) so a single big scan cannot flush the whole cache. Without this, one large scan in PostgreSQL would evict everything.\n- **The background writer.** A dedicated process that trickles dirty buffers out ahead of the clock hand so foreground backends rarely have to write during eviction.\n- **Local buffers.** Temporary tables use a per-backend local buffer pool, not shared buffers.\n- **Buffer content locks and pin/refcount separation.** PostgreSQL splits a *pin* (the page will not be evicted) from a *content lock* (shared/exclusive access to the bytes), and tracks both in shared memory with atomic state words. This engine has a single-mutex model.\n- **Double buffering.** PostgreSQL deliberately keeps `shared_buffers` modest and relies on the OS page cache underneath; sizing advice follows from that layering.\n\n### Implementation status (2026-08-27)\n\nThree changes bring the pool closer to the real thing:\n\n- **`usage_count` is capped at `BUF_USAGECOUNT_MAX = 5`.** Uncapped, a hot page\n  needed as many hand passes as it had hits, and the sweep gave up while frames\n  sat unpinned and evictable — it threw \"all frames are pinned\" when none were.\n  The cap is what makes the sweep terminate.\n- **The WAL rule is enforced at eviction.** `write_frame` calls\n  `WALManager::flush_up_to(page.lsn())` before any page reaches disk.\n- **Pages are pinned across read-modify-write.** `PinnedPage` is an RAII pin, and\n  `fetch_page` returns a view into the frame rather than a copy, so a caller\n  mutates shared memory instead of a private copy it later writes back over\n  whatever happened in between.\n\nStill missing: strategy rings, a background writer, local buffers for temp\nrelations, and separate pin/content-lock states.\n"},{"path":"09-write-ahead-logging.md","title":"Item 9: Write-Ahead Logging (WAL) & REDO Durability","md":"# Item 9: Write-Ahead Logging (WAL) & REDO Durability\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/wal.h:1-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/wal.h), [src/wal.cpp:1-180](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/wal.cpp), [tests/test_wal.cpp:1-135](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_wal.cpp)\n\n---\n\n## 1. Write-Ahead Logging (WAL) Architecture\n\nTo guarantee **ACID Durability** and high write throughput, PostgreSQL converts random 8KB page writes into sequential, append-only log records in the Write-Ahead Log (`*.log`).\n\n```mermaid\nflowchart LR\n    subgraph TransactionWorker[\"Transaction Commit Flow\"]\n        DML[\"1. DML Execution\\n(Mutates RAM Buffer Frame)\"]\n        LOG[\"2. Append WAL Record\\n[LSN, Type, XID, Data, CRC32]\"]\n        FLUSH[\"3. Flush WAL to Disk (fsync)\"]\n        COMMIT[\"4. Commit Complete to Client\"]\n        DIRTY[\"5. Dirty Page Flush\\n(Delayed / Checkpoint)\"]\n    end\n\n    DML --> LOG --> FLUSH --> COMMIT\n    FLUSH -.->|Must precede| DIRTY\n```\n\n---\n\n## 2. Invariants & Record Binary Layout\n\n1. **The WAL Invariant**:\n   $$\\text{page.pd\\_lsn} \\le \\text{wal.flushed\\_lsn}$$\n   A dirty page in RAM is never written to disk before all WAL records up to the page's `pd_lsn` have been flushed to disk (`[src/wal.cpp:110]`).\n2. **Log Record Structure (35-Byte Header + Dynamic Payload — this engine's own format)** (`[include/pg/wal.h:35-47]`):\n   - `lsn` (8 Bytes): Monotonically increasing Log Sequence Number. *In PostgreSQL an LSN is not a counter — it is a byte position in the logical WAL stream, which is why `pg_current_wal_lsn()` prints as `hex/hex`.*\n   - `prev_lsn` (8 Bytes): Backward pointer for UNDO / transaction rollback chains. **This has no PostgreSQL analogue.** PostgreSQL's `xl_prev` links to the *immediately preceding record in the stream* and exists to detect stale/recycled WAL pages during recovery, not to drive rollback — PostgreSQL never rolls back from WAL (Item 16).\n   - `tx_id` (4 Bytes): Transaction ID.\n   - `type` (1 Byte): `1`=INSERT, `2`=UPDATE, `3`=COMMIT, `4`=ABORT, `5`=CHECKPOINT, `6`=FPI, `7`=CLR.\n   - `page_id` (4 Bytes), `slot_id` (2 Bytes): Target heap page and line pointer.\n   - `payload_len` (4 Bytes): Byte length of following payload (`uint32_t`).\n   - `crc` (4 Bytes): CRC-32 (IEEE 802.3 polynomial) checksum verifying record integrity. *PostgreSQL has used **CRC-32C (Castagnoli)** since 9.5, chosen for the `SSE4.2` `crc32` instruction.*\n\n   PostgreSQL's `XLogRecord` header is **24 bytes**: `xl_tot_len` (4), `xl_xid` (4), `xl_prev` (8), `xl_info` (1), `xl_rmid` (1), 2 bytes padding, `xl_crc` (4). Everything after that is resource-manager-specific and self-describing: `xl_rmid` names the resource manager (heap, btree, xact, …), and a chain of `XLogRecordBlockHeader` entries describes each page the record touches — including whether a full-page image is attached (Item 15). There is no fixed `page_id`/`slot_id` in PostgreSQL's header; a single record can modify several blocks in several relations.\n\n---\n\n## 3. Sequence Diagram: REDO Crash Recovery Pass\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Engine as Database Engine (Startup)\n    participant WAL as WALManager (src/wal.cpp)\n    participant Heap as Heap Storage (RAM & Disk)\n\n    Engine->>WAL: recover(heap)\n    Note over WAL: Scan log file from byte 0 to EOF (PostgreSQL starts at the checkpoint REDO point)\n    loop For each WAL record in log\n        WAL->>WAL: verify_crc32(record)\n        alt CRC32 Mismatch\n            Note over WAL: Corrupted record / torn tail -> Stop scan!\n        else CRC32 Valid\n            alt Record is COMMIT / ABORT\n                WAL->>WAL: Track committed_txs set\n            else Record is INSERT / UPDATE\n                WAL->>WAL: Add to redo_records list\n            end\n        end\n    end\n    loop For each committed record in redo_records\n        WAL->>Heap: replay_record(record)\n        Note over Heap: Reapplies physical insert/update.<br/>Updates page.pd_lsn = record.lsn.\n    end\n    WAL-->>Engine: Replay complete (Survives power failure!)\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| WAL turns random page writes into sequential log writes | **Exact** |\n| `page.pd_lsn <= flushed_lsn` before a dirty page reaches disk | **Exact** — the WAL rule, enforced in `FlushBuffer()`/`XLogFlush()` |\n| Commit is acknowledged only after the WAL record is fsynced | **Exact by default** — `synchronous_commit = on`; PostgreSQL lets you trade this away (`off`, `local`, `remote_write`, `remote_apply`) |\n| CRC per record, torn tail detected by CRC mismatch and scan stops | **Exact in shape** |\n| Redo replays inserts/updates for committed transactions | **Exact in shape** |\n| CRC-32 IEEE | **Divergent** — PostgreSQL uses CRC-32C |\n| 35-byte fixed header with `page_id` + `slot_id` | **Divergent** — PostgreSQL: 24-byte `XLogRecord` + rmgr block headers, multi-block capable |\n| `prev_lsn` used for undo chains | **No analogue** — PostgreSQL has no undo; `xl_prev` is a stream-integrity link |\n| Recovery scans from byte 0 | **Divergent** — PostgreSQL starts at the checkpoint's REDO pointer from `pg_control` (Item 15) |\n| LSN as an abstract counter | **Divergent** — a PostgreSQL LSN is a byte offset in the WAL stream |\n\n### Not modelled\n\n- **WAL segmentation.** PostgreSQL writes 16 MB segment files under `pg_wal/`, recycles them, and archives them (`archive_command`). One flat `.log` file here.\n- **Resource managers.** Heap, btree, xact, clog, gist, … each register redo callbacks; `pg_waldump` decodes them.\n- **WAL levels.** `minimal` / `replica` / `logical` change what gets logged; `wal_level = logical` is what makes logical decoding and CDC possible.\n- **The WAL writer process**, group commit, and `commit_delay`.\n- **Streaming replication.** The same WAL stream is shipped to standbys; `wal_sender`/`wal_receiver`, replication slots, and hot standby all ride on this file format.\n\n### Implementation status (2026-08-27)\n\nThe write-ahead rule is now actually enforced, in three places that all had to\nchange together:\n\n- **`log_commit` is durable.** `WALManager::flush` calls `File::sync()`, a real\n  `fdatasync`/`_commit`. Previously it called `std::fstream::flush()`, which\n  leaves the bytes in the OS page cache — a power cut lost committed work.\n- **The record is written before the page changes.** `HeapFile` emits it while\n  holding the page pinned, then applies the change, then stamps `pd_lsn`. The\n  engine no longer logs after the fact, which was write-behind logging.\n- **`pd_lsn` is set on every modification**, so the buffer pool can refuse to\n  write a page out until the log covering it is durable.\n\nStill divergent: CRC-32 rather than CRC-32C, a 35-byte fixed header rather than\n`XLogRecord` plus rmgr block references, one log file rather than 16MB segments.\n"},{"path":"10-toast-oversized-attributes.md","title":"Item 10: TOAST Oversized-Attribute Storage","md":"# Item 10: TOAST Oversized-Attribute Storage\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/toast.h:1-65](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/toast.h), [src/toast.cpp:1-120](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/toast.cpp), [tests/test_toast.cpp:1-115](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_toast.cpp)\n\n---\n\n## 1. The TOAST Architecture\n\n**TOAST (The Oversized-Attribute Storage Technique)** prevents large text, JSON, and binary attributes from degrading the row density of 8KB slotted heap pages.\n\nWhen an attribute payload exceeds **2,048 bytes (2KB)**, the storage engine slices the payload into discrete 2,048-byte chunks stored in a dedicated auxiliary TOAST relation, replacing the inline data with a compact **18-byte `ToastPointer`**.\n\n> **PostgreSQL's real numbers and real trigger.** Both constants here are round approximations, and the trigger condition is different in kind:\n> - The threshold is `TOAST_TUPLE_THRESHOLD` = **2032 bytes**, and it is tested against the **size of the whole tuple**, not of one attribute. A row of six 500-byte columns gets toasted; a single 1 KB column in an otherwise narrow row does not.\n> - The chunk size is `TOAST_MAX_CHUNK_SIZE` = **1996 bytes**, sized so that exactly four chunk tuples fit in an 8 KB TOAST page after the heap tuple header and `chunk_id`/`chunk_seq` columns.\n> - **Compression comes first.** PostgreSQL's `heap_toast_insert_or_update()` loops: compress the largest attribute (pglz, or lz4 when `default_toast_compression = lz4`), re-measure the tuple; if still over threshold, push the largest attribute out of line; repeat. Out-of-line storage is the *fallback*, not the first move. This engine chunks uncompressed bytes directly.\n> - Behaviour is per-column configurable via `ALTER TABLE … SET STORAGE`: `PLAIN` (never toast), `EXTENDED` (compress then externalize — the default), `EXTERNAL` (externalize without compressing, so substring reads stay cheap), `MAIN` (compress, externalize only as a last resort).\n\n```mermaid\nflowchart LR\n    subgraph MainHeap[\"Main Heap Page (8KB)\"]\n        TUPLE[\"Heap Tuple\\n[item_id: 100, price: 10]\\n[ToastPointer: 18 Bytes]\"]\n    end\n\n    subgraph ToastRelation[\"Auxiliary TOAST Relation (*_toast.db)\"]\n        C0[\"Chunk 0 (seq=0, 2048 B)\\n[toast_id=1]\"]\n        C1[\"Chunk 1 (seq=1, 2048 B)\\n[toast_id=1]\"]\n        C2[\"Chunk 2 (seq=2, 1800 B)\\n[toast_id=1]\"]\n    end\n\n    TUPLE -.->|ToastPointer id 1, size 5896, 3 chunks| C0\n    C0 --- C1 --- C2\n```\n\n---\n\n## 2. Invariants & Binary Layout\n\n1. **ToastPointer Structure (18 Bytes)** (`[include/pg/toast.h:28-36]`):\n   - `toast_id` (8 Bytes): Unique 64-bit identifier linking to the auxiliary relation (`uint64_t`).\n   - `raw_size` (4 Bytes): Original uncompressed byte size of the attribute (`uint32_t`).\n   - `chunk_count` (4 Bytes): Total number of auxiliary chunks ($\\lceil \\text{raw\\_size} / 2048 \\rceil$, `uint32_t`).\n   - `flags` (2 Bytes): Compression and storage strategy flags (`uint16_t`).\n\n   PostgreSQL's on-disk TOAST pointer is **also 18 bytes**, but the fields differ: a 1-byte `varattrib_1b_e` header, a 1-byte `va_tag`, then a 16-byte `varatt_external` of `va_rawsize` (int32), `va_extsize` (int32), `va_valueid` (Oid) and `va_toastrelid` (Oid). Two consequences of that layout:\n   - PostgreSQL stores the *relation* OID in the pointer, so a detoast can find its TOAST table from the datum alone. This engine hard-wires a single TOAST relation.\n   - `va_extsize` is the **stored** (post-compression) size and `va_rawsize` the original; when they differ, the value is compressed and the low bits of `va_rawsize` encode which algorithm. There is no chunk count — PostgreSQL derives it by scanning the TOAST index.\n2. **ToastChunkHeader & Chunk Structure** (`[include/pg/toast.h:40-57]`):\n   - `ToastChunkHeader` (16 Bytes):\n     - `toast_id` (8 Bytes): ID of the toasted attribute (`uint64_t`).\n     - `chunk_seq` (4 Bytes): Chunk sequence number $0 \\le \\text{seq} < \\text{chunk\\_count}$ (`uint32_t`).\n     - `data_len` (4 Bytes): Byte length of chunk payload ($\\le 2048$, `uint32_t`).\n   - Every chunk is stored as a slotted tuple `(ToastChunkHeader + chunk_data)` on dedicated 8KB TOAST pages.\n   - **Cross-Restart Reconstruction**: `ToastManager::scan_existing_pages()` scans all allocated TOAST pages on startup, populates `chunk_index_`, and initializes `next_toast_id_ = max(id) + 1`.\n   - **WAL Logging & Crash Durability**: Each chunk write generates a `WALRecordType::TOAST_INSERT` record before updating disk, setting `pd_lsn` on the TOAST page. During startup crash recovery, `WALManager::recover()` replays `TOAST_INSERT` records to reconstruct missing or uncommitted chunks.\n3. **Sequential Scan Preservation**: Sequential scans over normal columns (e.g. `SELECT price FROM items;`) never read or load TOAST pages into shared buffers, avoiding massive I/O pollution (`[src/toast.cpp:65]`).\n\n---\n\n## 3. Sequence Diagram: Storing and Reassembling TOAST Data\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant SQL as SQL Executor\n    participant Heap as HeapFile (src/heap.cpp)\n    participant Toast as ToastManager (src/toast.cpp)\n    participant ToastDisk as Toast Relation (*_toast.db)\n\n    Note over SQL,ToastDisk: Insertion of 10,000 Byte Document\n    SQL->>Heap: insert_with_doc(id=200, price=20, doc=10KB)\n    Heap->>Toast: store_toast_payload(toast_id=1, data=10KB)\n    loop For each 2048-byte chunk (5 chunks total)\n        Toast->>ToastDisk: write_chunk(toast_id=1, seq_num=i, chunk_data)\n    end\n    Toast-->>Heap: ToastPointer {toast_id: 1, raw_size: 10000, chunk_count: 5}\n    Heap->>Heap: Store 18-byte ToastPointer inline inside HeapTuple\n    Heap-->>SQL: CTID (0, 2)\n\n    Note over SQL,ToastDisk: Selection / Reassembly of Document\n    SQL->>Heap: select_doc_by_id(200)\n    Heap->>Heap: Extract ToastPointer from tuple\n    Heap->>Toast: fetch_toast_payload(toast_id=1, raw_size=10000)\n    loop For chunk_seq in 0 .. 4\n        Toast->>ToastDisk: read_chunk(toast_id=1, seq=chunk_seq)\n        Toast->>Toast: Append 2048 bytes to result_buffer\n    end\n    Toast-->>Heap: std::string (Full 10,000-byte document reassembled)\n    Heap-->>SQL: Display document\n```\n\n---\n\n## 4. PostgreSQL Fidelity Check\n\n| Claim | Verdict |\n|---|---|\n| Oversized values move out of line to an auxiliary relation, replaced by a small pointer | **Exact** |\n| Pointer is 18 bytes | **Exact size, different fields** (`varatt_external`) |\n| Value is sliced into fixed-size chunks addressed by `(id, seq)` | **Exact** |\n| Scans of non-TOASTed columns never touch TOAST pages | **Exact** — detoasting is lazy, driven by `pg_detoast_datum()` |\n| Threshold 2048 bytes per attribute | **Wrong** — `TOAST_TUPLE_THRESHOLD` is **2032**, applied to the **whole tuple** |\n| Chunk size 2048 bytes | **Wrong** — `TOAST_MAX_CHUNK_SIZE` is **1996** |\n| No compression step | **Missing** — PostgreSQL compresses (pglz/lz4) before externalizing |\n| Single hard-wired TOAST relation, no index | **Simplified** — PostgreSQL uses a real heap + unique index on `(chunk_id, chunk_seq)` |\n| No storage strategies | **Missing** — `PLAIN` / `EXTENDED` / `EXTERNAL` / `MAIN` |\n| No 1 GB limit modelling | **Missing** — a single TOASTed varlena tops out at 1 GB in PostgreSQL |\n"},{"path":"11-sql-repl-and-engine.md","title":"Item 11: SQL REPL CLI & End-to-End Engine Capstone","md":"# Item 11: SQL REPL CLI & End-to-End Engine Capstone\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/engine.h:1-85](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/engine.h), [src/engine.cpp:1-250](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/engine.cpp), [src/main.cpp:1-95](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/main.cpp), [tests/test_repl.cpp:1-125](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_repl.cpp)\n\n---\n\n## 1. Engine Coordination Architecture\n\nThe `pg::Engine` class provides a unified facade coordinating transactions, memory buffers, slotted heap tables, secondary indexes, WAL logging, and TOAST auxiliary relations.\n\n```mermaid\nflowchart TD\n    subgraph Frontend[\"Frontend Client Interface\"]\n        REPL[\"pg_cli.exe (Terminal REPL)\"]\n        SQL_STR[\"SQL String Input:\\ne.g. 'INSERT INTO items VALUES (100, 10);'\"]\n    end\n\n    subgraph EngineCoord[\"Engine (src/engine.cpp)\"]\n        PARSE[\"Lexer / Command Dispatcher\"]\n        TX_AUTO[\"Auto-Transaction Wrapper\\n(ensure_transaction)\"]\n    end\n\n    subgraph Subsystems[\"Coordinated Subsystems\"]\n        TM[\"TransactionManager\"]\n        BPM[\"BufferPoolManager\"]\n        HEAP[\"HeapFile\"]\n        IDX[\"BTreeIndex\"]\n        WAL[\"WALManager\"]\n    end\n\n    REPL --> SQL_STR --> PARSE --> TX_AUTO\n    TX_AUTO --> TM\n    TX_AUTO --> BPM\n    TX_AUTO --> HEAP\n    TX_AUTO --> IDX\n    TX_AUTO --> WAL\n```\n\n---\n\n## 2. Invariants & Execution Rules\n\n1. **Auto-Transaction Invariant**: Every standalone DML statement executed outside of an explicit `BEGIN ... COMMIT` block automatically receives an implicit transaction ID, snapshot, and immediate WAL commit flush (`[src/engine.cpp:38]`). **Exactly PostgreSQL's behaviour** — every statement runs in a transaction whether you asked for one or not. One difference: PostgreSQL assigns an XID *lazily*, only when a statement first writes, so read-only statements consume no transaction id at all.\n2. **Tabular ASCII Formatting**: Query outputs render PostgreSQL-standard tabular ASCII grids displaying `item_id`, `price`, `xmin`, `xmax`, and physical `CTID`. `xmin`, `xmax` and `ctid` are genuine PostgreSQL system columns — `SELECT ctid, xmin, xmax, * FROM items;` works against a real server — but PostgreSQL hides them unless named explicitly, whereas this engine always shows them.\n3. **Physical Diagnostic Commands**:\n   - `DUMP PAGE <id>;`: Outputs exact byte offsets, `pd_lower`, `pd_upper`, line pointer flag states, and hex dumps.\n   - `STATUS;`: Outputs active buffer pool residency, cache hit rates, WAL flushed LSN, and transaction horizons.\n\n---\n\n## 3. Sequence Diagram: End-to-End Insert Pipeline\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant CLI as CLI REPL (pg_cli.exe)\n    participant Eng as Engine (src/engine.cpp)\n    participant TM as TransactionManager\n    participant WAL as WALManager\n    participant Heap as HeapFile\n    participant BPM as BufferPoolManager\n    participant Idx as BTreeIndex\n\n    CLI->>Eng: execute SQL insert item 100, price 10\n    Eng->>TM: begin_transaction() -> TxID 1\n    Eng->>Heap: insert item (id 100, price 10, xmin 1)\n    Heap->>BPM: fetch_page(0)\n    Heap->>Heap: insert_tuple() -> Landed at CTID (0, 1)\n    Heap->>BPM: unpin_page(0, is_dirty=true)\n    Eng->>WAL: log_insert(tx 1, ctid 0:1, item 100)\n    Eng
