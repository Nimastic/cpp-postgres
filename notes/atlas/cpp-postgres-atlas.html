d: (a.price = b.price)) (hash_entries=5, produced_tuples=9)\n    ->  Seq Scan on items (scanned_pages=1, produced_tuples=5)\n    ->  Seq Scan on items (scanned_pages=1, produced_tuples=5)\n```\n"},{"path":"25-two-phase-locking-deadlock.md","title":"Item 25: Two-Phase Locking (2PL) & Wait-For Graph Deadlock Detection","md":"# Item 25: Two-Phase Locking (2PL) & Wait-For Graph Deadlock Detection\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/lock.h:1-210](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/lock.h), [src/lock.cpp:1-240](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/lock.cpp), [include/pg/session.h:1-45](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/session.h), [tests/test_locks.cpp:1-200](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_locks.cpp)\n\n---\n\n## 1. Concurrency Control: MVCC + Strict 2PL\n\nIn a relational database, MVCC (Multi-Version Concurrency Control) provides snapshot isolation for read queries: readers never acquire read locks and never block writers, and writers never block readers.\n\nHowever, when two or more transactions concurrently attempt to modify the same physical tuple version (write-write conflict), MVCC alone cannot prevent lost updates. PostgreSQL enforces serializability of conflicting operations through **Strict Two-Phase Locking (Strict 2PL)** managed by the `LockManager` (`src/backend/storage/lmgr/`):\n\n1. **Growing Phase**: Transactions acquire Shared (S) or Exclusive (X) locks on row versions (`CTID`) or relation tables during statement execution.\n2. **Shrinking Phase**: All locks acquired by a transaction are held until transaction termination (`COMMIT` or `ROLLBACK`), where they are released atomically in bulk (`release_all(tx_id)`). This prevents cascading aborts and guarantees serializability.\n\n```mermaid\nflowchart TD\n    subgraph LockSystem[\"Two-Phase Locking (2PL) & Deadlock Subsystem\"]\n        REQ[\"Lock Request (Tx, Mode: S/X)\"]\n        CHECK{\"Lock Compatible & Queue Empty?\"}\n        GRANT[\"Grant Lock (Add to granted_list)\"]\n        QUEUE[\"Enqueue in FIFO wait_queue\"]\n        WFG[\"Update Wait-For Graph (WFG)\"]\n        DFS{\"3-Color DFS Cycle Detected?\"}\n        ABORT[\"Abort Requester (DeadlockException)\"]\n        BLOCK[\"Block Thread on Condition Variable\"]\n    end\n\n    REQ --> CHECK\n    CHECK -->|Yes| GRANT\n    CHECK -->|No| QUEUE\n    QUEUE --> WFG\n    WFG --> DFS\n    DFS -->|Cycle Found| ABORT\n    DFS -->|Acyclic| BLOCK\n```\n\n---\n\n## 2. Lock Compatibility Matrix & Lock Head\n\nThe `LockManager` maintains an in-memory hash table mapping each `LockResource` (Row `CTID` or Relation ID) to a `LockHead`. Each `LockHead` tracks a list of active holders (`granted_list`) and an ordered FIFO wait queue (`wait_queue`).\n\n```\n+---------------------+-------------------+---------------------+\n| Requested Mode      | Existing SHARED   | Existing EXCLUSIVE  |\n+---------------------+-------------------+---------------------+\n| SHARED (S)          | GRANT (Compatible)| WAIT (Incompatible) |\n| EXCLUSIVE (X)       | WAIT (Incompatible)| WAIT (Incompatible) |\n+---------------------+-------------------+---------------------+\n```\n\n### FIFO Ordering Invariant\nTo prevent starvation where continuous incoming Shared lock requests starve an Exclusive lock writer, the `LockManager` strictly enforces FIFO queueing: if the `wait_queue` is non-empty, incoming Shared requests are enqueued behind earlier Exclusive requests rather than jumping ahead.\n\n---\n\n## 3. Wait-For Graph (WFG) & DFS Cycle Detection\n\nWhen a transaction blocks in the wait queue, it introduces dependencies on all current lock holders:\n$$E = \\{ (T_{\\text{waiter}} \\to T_{\\text{holder}}) \\mid T_{\\text{waiter}} \\in \\text{wait\\_queue}(R), T_{\\text{holder}} \\in \\text{granted\\_list}(R) \\}$$\n\nA deadlock occurs if and only if the directed graph $G = (V, E)$ contains a cycle.\n\n### 3-Color Depth-First Search (DFS)\nThe `LockManager` executes a 3-color topological cycle detection algorithm whenever a transaction is about to block:\n- **WHITE (0)**: Node unvisited.\n- **GRAY (1)**: Node currently on the active recursion call stack.\n- **BLACK (2)**: Node and all descendants fully explored.\n\nIf DFS encounters an edge pointing to a **GRAY** node, a back-edge is confirmed, proving a directed cycle.\n\n```mermaid\nflowchart LR\n    subgraph DeadlockCycle[\"Mutual 2-Tx Deadlock Cycle\"]\n        T1[\"Tx 501 (Holds A, Waits B)\"]\n        T2[\"Tx 502 (Holds B, Waits A)\"]\n        T1 -->|Wait-for edge| T2\n        T2 -->|Back-edge: Deadlock!| T1\n    end\n```\n\n---\n\n## 4. Sequence Diagram: Deadlock Detection & Victim Abort\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant T1 as Transaction 501\n    participant LM as LockManager\n    participant T2 as Transaction 502\n\n    Note over T1,T2: 1. Growing Phase: Initial Lock Grants\n    T1->>LM: acquire(Row A, EXCLUSIVE)\n    LM-->>T1: granted\n    T2->>LM: acquire(Row B, EXCLUSIVE)\n    LM-->>T2: granted\n\n    Note over T1,T2: 2. Contention: T1 Waits on B\n    T1->>LM: acquire(Row B, EXCLUSIVE)\n    Note over LM: B held by T2 -> enqueue T1 (Edge: 501 -> 502)\n    Note over T1: T1 blocks on condition variable\n\n    Note over T1,T2: 3. Mutual Wait: T2 Requests A (Cycle Closes)\n    T2->>LM: acquire(Row A, EXCLUSIVE)\n    Note over LM: A held by T1 -> edge 502 -> 501\n    Note over LM: DFS: 502 -> 501 -> 502 (Cycle Detected!)\n    LM-->>T2: throw DeadlockException(\"deadlock detected: Tx 502 -> Tx 501 -> Tx 502\")\n\n    Note over T1,T2: 4. Victim Abort & Cascade Resolution\n    T2->>LM: release_all(502)\n    Note over LM: B released -> promote T1 from wait queue\n    LM-->>T1: unblock & grant Row B\n```\n"},{"path":"26-dynamic-catalogs-multi-table-ddl.md","title":"Item 26: Dynamic Catalogs & Multi-Table DDL (`pg_class`, `pg_attribute`)","md":"# Item 26: Dynamic Catalogs & Multi-Table DDL (`pg_class`, `pg_attribute`)\n\n**Confidence**: `verified`  \n**Citations**: [include/pg/catalog.h:1-65](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/catalog.h), [src/catalog.cpp:1-120](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/catalog.cpp), [include/pg/engine.h:75-115](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/include/pg/engine.h), [src/engine.cpp:550-670,710-840](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/src/engine.cpp), [tests/test_catalog.cpp:1-150](file:///c:/Users/jerie/Documents/GitHub/cpp-postgres/tests/test_catalog.cpp)\n\n---\n\n## 1. Hardcoded Relations vs. Dynamic System Catalogs\n\nIn a relational database system, the schema is not immutable or hardcoded into the binary. In classical PostgreSQL (`src/include/catalog/`), relation descriptors, attribute definitions, types, and constraints are maintained as metadata records within **System Catalogs**:\n- `pg_class`: Catalogs every table, index, sequence, and view with attributes such as relation name (`relname`), object identifier (`Oid`), physical file node (`relfilenode`), and page count.\n- `pg_attribute`: Catalogs individual columns within each relation, tracking column name (`attname`), data type (`atttypid`), column length (`attlen`), and ordinal position (`attnum`).\n\nMilestone 26 elevates our engine from a single-table prototype into a full multi-relation storage engine supporting dynamic schema definition (`CREATE TABLE`), schema inspection (`SHOW TABLES`, `DESCRIBE`), table drop (`DROP TABLE`), and physical file isolation.\n\n```mermaid\nflowchart TD\n    subgraph CatalogSystem[\"Dynamic System Catalog Layer\"]\n        CATALOG[\"CatalogManager pg_class and pg_attribute\"]\n        SYS[\"Default items Relation Oid 16384\"]\n        REL1[\"users Relation Oid 16385\"]\n        REL2[\"orders Relation Oid 16386\"]\n    end\n\n    subgraph PhysicalStorage[\"Physical Disk Files\"]\n        FILE_ITEMS[\"items_heap.db / items_index.db\"]\n        FILE_USERS[\"users_heap.db / users_index.db\"]\n        FILE_ORDERS[\"orders_heap.db / orders_index.db\"]\n    end\n\n    CATALOG --> SYS\n    CATALOG --> REL1\n    CATALOG --> REL2\n\n    SYS --> FILE_ITEMS\n    REL1 --> FILE_USERS\n    REL2 --> FILE_ORDERS\n```\n\n---\n\n## 2. Dynamic DDL Lifecycle & Storage Isolation\n\nWhen a DDL statement is executed, the `Engine` coordinates with the `CatalogManager` and the storage subsystem:\n\n1. **`CREATE TABLE <name> (<columns>)`**:\n   - Assigns a monotonically increasing relation OID starting at `16384` (PostgreSQL's `FirstNormalObjectId`).\n   - Registers relation metadata in `<db_prefix>_catalog.db`.\n   - Initializes dedicated physical storage files (`<prefix>_<name>_heap.db` and `<prefix>_<name>_index.db`).\n   - Binds the new relation into the dynamic relation cache with active WAL logging and buffer pool management.\n2. **`DROP TABLE <name>`**:\n   - Validates that system-critical relations (e.g., `items`) cannot be dropped.\n   - Closes and flushes cached `HeapFile` and `DiskBTree` instances.\n   - Deletes underlying physical `.db` files from disk.\n   - Removes schema records from the system catalog.\n\n---\n\n## 3. Sequence Diagram: Multi-Table Creation & Isolated Insertion\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Client as Query Client\n    participant Engine as Unified Engine\n    participant Catalog as CatalogManager\n    participant Heap as HeapFile users_heap\n    participant WAL as WALManager\n\n    Note over Client,WAL: 1. CREATE TABLE users\n    Client->>Engine: execute CREATE TABLE users\n    Engine->>Catalog: create_table users, columns\n    Catalog-->>Engine: rel_id 16385 saved to disk\n    Engine->>Heap: open users_heap.db\n    Engine-->>Client: relation users created\n\n    Note over Client,WAL: 2. INSERT INTO users\n    Client->>Engine: execute INSERT INTO users VALUES 1, 25\n    Engine->>Catalog: get_table users\n    Catalog-->>Engine: metadata heap_path\n    Engine->>Heap: insert tuple, tx_id 1\n    Heap->>WAL: log_insert tx_id 1, CTID 0-1\n    Heap-->>Engine: CTID 0-1\n    Engine-->>Client: INSERT successful\n```\n\n---\n\n## 4. SQL REPL & Schema Inspection Commands\n\nThe SQL parser dynamically detects and formats catalog inspection and DDL queries:\n\n```sql\n-- Create dynamic schema relation\nCREATE TABLE users (user_id INT, age INT);\n\n-- List all registered relations\nSHOW TABLES;\n\n-- Output:\n+--------+----------------------+\n| Rel ID | Relation Name        |\n+--------+----------------------+\n|  16384 | items                |\n|  16385 | users                |\n+--------+----------------------+\n(2 relations)\n\n-- Inspect column schema\nDESCRIBE users;\n\n-- Output:\nTable \"users\" (oid=16385):\n+-----+----------------------+------+--------+\n| Pos | Column Name          | Type | Length |\n+-----+----------------------+------+--------+\n|   1 | user_id              |  INT |      4 |\n|   2 | age                  |  INT |      4 |\n+-----+----------------------+------+--------+\n```\n"}];

const slug = (s, i) => 'ch' + i + '-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);

// Pull mermaid blocks out before markdown parsing so the fence content survives verbatim.
const blocks = [];
const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  if (lang === 'mermaid') { blocks.push(code); return `<div class="mermaid" data-i="${blocks.length - 1}"></div>`; }
  return `<pre><code class="language-${lang || ''}">${code.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</code></pre>`;
};
marked.setOptions({ renderer, gfm: true, breaks: false });

const book = document.getElementById('book');
const toc = document.getElementById('toc');

DOCS.forEach((doc, i) => {
  const sec = document.createElement('section');
  sec.className = 'chapter';
  // Drop the leading H1 — the chapter heading is emitted with a stable anchor instead.
  const body = doc.md.replace(/^#\s+.+$/m, '').trim();
  const id = slug(doc.title, i);
  sec.innerHTML = `<h1 id="${id}">${i + 1}. ${doc.title}</h1>` + marked.parse(body);
  book.appendChild(sec);

  const li = document.createElement('li');
  li.innerHTML = `<a href="#${id}"><span class="num">${i + 1}</span>${doc.title}</a>`;
  const subs = [...sec.querySelectorAll('h2')];
  if (subs.length) {
    const ol = document.createElement('ol');
    subs.forEach((h, j) => {
      const sid = id + '-s' + j;
      h.id = sid;
      const sli = document.createElement('li');
      sli.innerHTML = `<a href="#${sid}">${h.textContent}</a>`;
      ol.appendChild(sli);
    });
    li.appendChild(ol);
  }
  toc.appendChild(li);
});

// LaTeX. Walk text nodes rather than elements: a paragraph containing an inline <code>
// still has math outside it, so skipping whole elements loses real formulae.
const mathWalker = document.createTreeWalker(book, NodeFilter.SHOW_TEXT, {
  acceptNode: (n) => (!n.parentElement.closest('code, pre, .mermaid') && n.nodeValue.includes('$'))
    ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
});
const mathNodes = [];
while (mathWalker.nextNode()) mathNodes.push(mathWalker.currentNode);

for (const node of mathNodes) {
  const parts = node.nodeValue.split(/(\$\$[^$]+?\$\$|\$[^$\n]+?\$)/g);
  if (parts.length < 2) continue;
  const frag = document.createDocumentFragment();
  for (const part of parts) {
    const display = /^\$\$[\s\S]+\$\$$/.test(part);
    const inline = !display && /^\$[^$\n]+\$$/.test(part);
    if (!display && !inline) { if (part) frag.appendChild(document.createTextNode(part)); continue; }
    const tex = display ? part.slice(2, -2) : part.slice(1, -1);
    const span = document.createElement('span');
    try { span.innerHTML = katex.renderToString(tex, { displayMode: display, throwOnError: false }); }
    catch { span.textContent = part; }
    frag.appendChild(span);
  }
  node.replaceWith(frag);
}

let mermaidFailures = 0;
try {
  mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose',
                       flowchart: { htmlLabels: false }, fontFamily: 'inherit' });
  for (const el of document.querySelectorAll('.mermaid')) {
    const src = blocks[+el.dataset.i];
    try {
      const { svg } = await mermaid.render('m' + el.dataset.i + '-' + Math.random().toString(36).slice(2), src);
      el.innerHTML = svg;
    } catch (e) {
      mermaidFailures++;
      el.className = 'mermaid-failed';
      el.innerHTML = '<b>diagram failed to render</b><pre>' + src.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) + '</pre>';
    }
  }
} catch (e) { mermaidFailures = -1; }

window.__diag = { chapters: DOCS.length, diagrams: blocks.length, mermaidFailures };
document.title = "PostgreSQL Storage Engine Architecture Atlas" + ' · ok:' + blocks.length + ':' + mermaidFailures;
window.__ready = true;
</script>
